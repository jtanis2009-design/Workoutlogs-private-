<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Workout Log</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Workout">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b0c10">
<meta name="color-scheme" content="dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{color-scheme:dark;
    --bg:#0b0c10; --bg2:#11131a; --card:#171a22; --card2:#1e2230; --line:#272c3a;
    --txt:#eef0f5; --mut:#8a90a0; --mut2:#616878;
    --acc:#ff4a4a; --acc-d:#1c0303; --red:#ff6b6b; --blu:#7cc4ff; --r:15px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{background:var(--bg);color:var(--txt);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    font-size:15px;line-height:1.45;padding-bottom:calc(78px + env(safe-area-inset-bottom));
    -webkit-font-smoothing:antialiased}
  #app{max-width:640px;margin:0 auto;padding:0 14px}

  header{padding:calc(18px + env(safe-area-inset-top)) 0 13px;display:flex;align-items:baseline;gap:10px}
  header h1{font-size:21px;font-weight:800;letter-spacing:-.02em;margin:0}
  header .sub{font-size:12px;color:var(--mut2);font-weight:600}

  .banner{background:#2a2412;border:1px solid #4a3f15;color:#e8d98a;border-radius:12px;padding:9px 12px;font-size:12.5px;margin-bottom:14px}

  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin-bottom:12px;overflow:hidden}
  .card.hl{border-color:color-mix(in srgb,var(--acc) 38%,#272c3a);background:linear-gradient(180deg,color-mix(in srgb,var(--acc) 9%,#171a22),#171a22 60%)}
  .card-h{display:flex;align-items:center;gap:10px;padding:15px 15px}
  .card-b{padding:0 15px 16px}
  .sec-t{font-size:13px;font-weight:700;color:var(--mut);margin:22px 0 10px 2px}
  .chip{font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:999px;background:var(--card2);color:var(--mut);white-space:nowrap}
  .chip.a{background:var(--acc);color:var(--acc-d)}
  .chip.b{background:#17293a;color:var(--blu)}

  button{font-family:inherit;font-size:14px;border:0;background:none;color:inherit;cursor:pointer;padding:0}
  .btn{display:flex;align-items:center;justify-content:center;gap:7px;padding:12px 15px;border-radius:11px;
    font-weight:600;font-size:14px;background:var(--card2);color:var(--txt);border:1px solid var(--line);width:100%}
  .btn:active{transform:scale(.985)}
  label.btn{cursor:pointer;box-sizing:border-box}
  .gapopt{display:flex;width:100%;align-items:center;gap:10px;text-align:left;background:transparent;border:0;border-top:1px solid var(--line);color:inherit;padding:10px 2px;font:inherit;cursor:pointer}
  .gapopt span{flex:1;min-width:0}.gapopt b{display:block;font-size:13.5px}.gapopt small{display:block;font-size:11.5px;color:var(--mut2);margin-top:2px}
  .gapopt i{font-style:normal;font-weight:800;color:var(--acc);font-size:13px}
  .ssbar{font-size:11.5px;font-weight:800;color:var(--acc);margin:10px 0 -4px}
  .ses-ex.ss{border-left:3px solid var(--acc);padding-left:10px}
  .sstag{font-style:normal;background:var(--acc);color:#111;border-radius:6px;padding:1px 6px;font-size:12px;margin-right:6px}
  .phcmp{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .phgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
  .phcmp figure,.phgrid figure{margin:0}
  .phcmp img,.phgrid img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:10px;display:block;background:var(--card2)}
  .phcmp figcaption,.phgrid figcaption{font-size:11px;color:var(--mut2);margin-top:3px;display:flex;justify-content:space-between;align-items:center}
  .phgrid figcaption button{background:none;border:0;color:var(--mut2);font:inherit;cursor:pointer}
  .cups{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}
  .cups i{width:16px;height:20px;border:2px solid #3987e5;border-top-width:1px;border-radius:2px 2px 5px 5px;opacity:.35}
  .cups i.on{background:#3987e5;opacity:1}
  .wbtns{display:grid;grid-template-columns:1fr 1fr 1fr .8fr;gap:6px}
  .wbtns .btn{padding:8px 4px;font-size:13px;line-height:1.2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
  .wbtns small{display:block;font-size:10.5px;color:var(--mut2);font-weight:600}
  .mgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:10px}
  .mgrid small{display:block;font-size:11px;margin-top:3px}
  .mchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
  .mchips button{background:var(--card2,#151821);border:1px solid var(--line);color:inherit;border-radius:999px;padding:8px 13px;font:inherit;font-size:13px;font-weight:700;cursor:pointer}
  .mchips button.on{background:var(--acc);border-color:var(--acc);color:#111}
  .mbar{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--card2,#151821);border:1px solid var(--line);border-radius:11px;padding:8px 12px;margin:8px 0;font-size:13px}
  .mbar button{background:none;border:0;color:var(--acc);font:inherit;font-weight:800;cursor:pointer}
  .lookgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .lookgrid button{display:flex;flex-direction:column;align-items:center;gap:4px;background:var(--card2,#151821);border:1px solid var(--line);border-radius:14px;padding:10px 4px;color:inherit;font:inherit;cursor:pointer;min-width:0}
  .lookgrid button.on{border-color:var(--acc)}
  .lookgrid button.lk{opacity:.55;cursor:default}
  .lookgrid b{font-size:12px}
  .lookgrid small{font-size:10px;color:var(--mut2);text-align:center;line-height:1.3}
  .lkw{position:relative;display:inline-block;line-height:0}
  .lkw i{position:absolute;right:-2px;bottom:-2px;font-style:normal;font-size:14px;line-height:1}
  .qrow{display:flex;gap:8px;overflow-x:auto;margin:-2px 0 12px;padding-bottom:2px;-webkit-overflow-scrolling:touch}
  .qmeal{flex:0 0 auto;max-width:170px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 12px;color:inherit;font:inherit;cursor:pointer;position:relative}
  .qmeal:active{border-color:var(--acc)}
  .qmeal b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .qmeal small{display:block;font-size:11px;color:var(--mut2);margin-top:2px}
  .qmeal em{position:absolute;top:5px;right:7px;font-style:normal;font-size:11px;color:var(--acc)}
  .ci-row{display:flex;align-items:center;gap:10px;margin:6px 0}
  .ci-row>span{flex:0 0 74px;font-size:13px;font-weight:700}
  .ci-row>div{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;flex:1}
  .ci-row button{background:var(--card2,#151821);border:1px solid var(--line);border-radius:10px;padding:9px 0;color:inherit;font:inherit;font-weight:800;cursor:pointer}
  .ci-row button.on{background:var(--acc);border-color:var(--acc);color:#111}
  .wrow{display:flex;gap:8px;margin:-2px 0 12px}
  .wrow input{flex:1;min-width:0}
  .lnk{background:none;border:0;color:var(--acc);font:inherit;font-weight:700;padding:0;cursor:pointer}
  .ses-ex-h{align-items:center}
  .lchg{margin-left:8px;flex:none;background:var(--card2,#1b1f27);border:1px solid var(--line,#2a2f3a);color:var(--mut);border-radius:9px;padding:6px 10px;font:inherit;font-size:12px;font-weight:700;cursor:pointer}
  .lchg.on{color:var(--acc);border-color:var(--acc)}
  .lmenu{background:var(--card2,#151821);border:1px solid var(--line,#262b36);border-radius:12px;padding:10px;margin:2px 0 10px}
  .lm-t{font-size:11.5px;color:var(--mut2);font-weight:700;margin-bottom:6px}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
  .qchip{background:transparent;border:1px solid var(--line,#2f3542);color:inherit;border-radius:999px;padding:8px 12px;font:inherit;font-size:13px;cursor:pointer}
  .qchip:active{border-color:var(--acc);color:var(--acc)}
  .lm-row{display:flex;gap:6px;align-items:center;margin-top:4px}
  .lm-row input{flex:1;min-width:0}
  .lm-btns{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
  .lm-btns .btn{padding:9px 6px;font-size:13px}
  .lbar{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--card2,#151821);border:1px solid var(--acc);border-radius:11px;padding:8px 12px;margin:8px 0;font-size:13px}
  .lbar button{background:none;border:0;color:var(--acc);font:inherit;font-weight:800;cursor:pointer}
  body.gated nav{display:none}
  .tri3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
  .tri3 .btn{padding-left:6px;padding-right:6px;font-size:13.5px;text-align:center}
  .fsres{margin-top:8px}
  .fs-hint{font-size:12px;color:var(--mut2);line-height:1.5;padding:4px 2px}
  .fs-row{display:flex;width:100%;align-items:center;gap:10px;text-align:left;background:transparent;border:0;border-top:1px solid var(--line,#23262e);color:inherit;padding:10px 2px;font:inherit;cursor:pointer}
  .fs-row span{flex:1;min-width:0}
  .fs-row b{display:block;font-size:13.5px;line-height:1.3}
  .fs-row small{display:block;font-size:11.5px;color:var(--mut2);margin-top:2px;line-height:1.35}
  .fs-row i{font-style:normal;font-weight:800;font-size:14px;color:var(--acc)}
  .fs-row:disabled{opacity:.6}
  .btn.p{background:var(--acc);color:var(--acc-d);border-color:var(--acc);font-weight:800}
  .btn.g{background:none;border:1px dashed var(--line);color:var(--mut)}
  .btn.d{color:var(--red);border-color:#43252b;background:#1f1418}
  .btn[disabled]{opacity:.45}
  .icn{width:30px;height:30px;flex:0 0 30px;border-radius:9px;display:flex;align-items:center;justify-content:center;
    color:var(--mut2);background:var(--card2);font-size:15px;line-height:1}
  .icn.d{color:var(--red)}
  .icn.warn{background:#3a1c22;color:#ff8f8f;width:auto;flex:0 0 auto;padding:0 10px;font-size:11px;font-weight:800}

  input,textarea{font-family:inherit;font-size:15px;color:var(--txt);background:var(--bg2);border:1px solid var(--line);
    border-radius:10px;padding:10px 11px;width:100%;outline:none;resize:none}
  input:focus,textarea:focus{border-color:var(--acc);background:#0e1014}
  input::placeholder,textarea::placeholder{color:var(--mut2)}
  textarea{line-height:1.5;min-height:84px}
  .fld{display:flex;flex-direction:column;gap:5px;min-width:0}
  .fld label{font-size:11.5px;font-weight:600;color:var(--mut2);padding-left:2px}
  .name-in{font-size:16px;font-weight:700;background:none;border:0;border-bottom:1px solid transparent;border-radius:0;padding:4px 0}
  input[type=date]{font-weight:600}

  .ex{border-top:1px solid var(--line);padding:12px 0 13px}
  .ex-top{display:flex;align-items:center;gap:8px}
  .trio{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:9px}
  .duo{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}

  /* calendar */
  .cal-h{display:flex;align-items:center;gap:10px;padding:4px 2px 12px}
  .cal-h b{flex:1;font-size:16px;font-weight:800;letter-spacing:-.01em}
  .cal-nav{width:34px;height:34px;border-radius:10px;background:var(--card2);border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;font-size:15px;color:var(--mut)}
  .dow{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:5px}
  .dow span{text-align:center;font-size:10px;font-weight:800;letter-spacing:.05em;color:var(--mut2)}
  .grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
  .cell{position:relative;aspect-ratio:1/1;border-radius:10px;background:var(--bg2);border:1px solid transparent;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:13.5px;font-weight:700;color:var(--txt)}
  .cell.out{color:#3b414f;background:transparent}
  .cell.main{background:color-mix(in srgb,var(--acc) 7%,#11131a)}
  .cell.has{background:var(--card2);border-color:color-mix(in srgb,var(--acc) 40%,#272c3a)}
  .cell.done{background:#13332a;border-color:#199e70;color:#7fe3bb}
  .cell.skip{background:#2a2113;border-color:#5a4624;color:#d9b98a}
  .dot.done{background:#38e2a8}
  .dot.miss{background:#d9a05a}
  .cell.today{border-color:var(--acc);color:var(--acc)}
  .cell.sel{background:var(--acc);color:var(--acc-d);border-color:var(--acc)}
  .cell.sel .dot{background:var(--acc-d)!important}
  .dot{width:4px;height:4px;border-radius:50%;background:var(--acc)}
  .dot.done{background:var(--blu)}
  .dot.ghost{background:#4a5330}
  .legend{display:flex;gap:14px;justify-content:center;padding:12px 0 2px;font-size:11px;color:var(--mut2);font-weight:600}
  .legend i{display:inline-block;width:5px;height:5px;border-radius:50%;margin-right:5px;vertical-align:1px}

  /* brief */
  .brief{border-top:1px solid var(--line);padding:14px 0 2px;display:flex;gap:11px}
  .brief:first-child{border-top:0}
  .bnum{width:24px;height:24px;flex:0 0 24px;border-radius:7px;background:var(--acc);color:var(--acc-d);
    font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;margin-top:1px}
  .bnum.b{background:#17293a;color:var(--blu)}
  .btxt{flex:1;min-width:0}
  .btxt .nm{font-size:15.5px;font-weight:700;line-height:1.3}
  .btxt .pr{font-size:13px;font-weight:700;color:var(--acc);margin-top:2px}
  .btxt .pr.b{color:var(--blu)}
  .btxt .fo{font-size:12.5px;color:var(--mut);margin-top:6px;line-height:1.55}
  .btxt .seg{font-size:12.5px;color:var(--mut);margin-top:4px;display:flex;gap:8px}
  .btxt .seg b{color:var(--txt);font-weight:700;flex:0 0 92px}

  /* session */
  .ses-ex{border-top:1px solid var(--line);padding:14px 0 6px}
  .ses-ex:first-child{border-top:0}
  .ses-ex-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
  .ses-ex-h .nm{font-size:15.5px;font-weight:700}
  .ses-ex-h .tg{font-size:11.5px;color:var(--mut2);font-weight:700;white-space:nowrap}
  .fo-box{font-size:12.5px;color:var(--mut);line-height:1.55;margin:7px 0 8px;padding-left:10px;border-left:2px solid var(--line)}
  .prog{font-size:11.5px;font-weight:700;color:var(--blu);margin:0 0 9px;padding-left:10px;border-left:2px solid #24384d}
  .srow{display:grid;grid-template-columns:18px 1fr 1fr .78fr 40px;gap:6px;align-items:center;margin-bottom:7px}
  .srow.seg{grid-template-columns:18px 1.05fr 1fr 40px}
  .snum{font-size:12px;font-weight:800;color:var(--mut2);text-align:center}
  .unit{position:relative}
  .unit span{position:absolute;right:9px;top:50%;transform:translateY(-50%);font-size:10.5px;font-weight:700;color:var(--mut2);pointer-events:none;text-transform:lowercase}
  .unit input{padding-right:30px;text-align:center;font-weight:700}
  .srow.seg input{font-size:13px;text-align:left;font-weight:600;padding:10px 9px}
  .chk{height:40px;border-radius:10px;border:1px solid var(--line);background:var(--bg2);display:flex;
    align-items:center;justify-content:center;font-size:15px;color:var(--mut2)}
  .chk.on{background:var(--acc);border-color:var(--acc);color:var(--acc-d);font-weight:800}
  .srow.done .unit input{border-color:#2d3a1d;background:#121607}
  .trow{display:grid;grid-template-columns:1fr 1fr auto;gap:7px;align-items:end;margin:2px 0 10px}
  .tcell{display:grid;grid-template-columns:1fr auto;gap:4px;align-items:center;min-width:0}
  .tcell label{grid-column:1/-1;font-size:11px;font-weight:600;color:var(--mut2);padding-left:2px}
  .tcell input{padding:8px 6px;font-size:13.5px;font-weight:600;min-width:0}
  .tcell button{font-size:11.5px;font-weight:700;color:var(--mut);padding:8px 9px;border:1px solid var(--line);border-radius:9px}
  .tdur{font-size:12px;font-weight:800;color:var(--acc);min-width:46px;text-align:right;padding-bottom:9px}
  .mini{display:flex;gap:8px;margin:3px 0 4px}
  .mini button{font-size:12px;font-weight:700;color:var(--mut);padding:5px 10px;border:1px solid var(--line);border-radius:8px}

  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 10px;text-align:center}
  .stat b{display:block;font-size:19px;font-weight:800;letter-spacing:-.02em}
  .stat small{font-size:11px;font-weight:600;color:var(--mut2)}

  .pick{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);
    border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:9px}
  .pick .t{flex:1;min-width:0}
  .pick .t b{display:block;font-size:16px;font-weight:700}
  .pick .t small{font-size:12px;color:var(--mut2);font-weight:600}
  .pick .go{color:var(--acc);font-size:18px;font-weight:700}

  .hrow{display:flex;align-items:center;gap:11px;padding:13px 14px;cursor:pointer}
  .hrow .t{flex:1;min-width:0}
  .hrow .t b{display:block;font-size:15px;font-weight:700}
  .hrow .t small{font-size:12px;color:var(--mut2);font-weight:600}
  .hline{display:flex;justify-content:space-between;gap:12px;font-size:13px;padding:6px 0;border-top:1px solid var(--line)}
  .hline span:last-child{color:var(--mut);font-variant-numeric:tabular-nums;text-align:right}

  .rv{font-size:14px;line-height:1.62}
  .rv h3{font-size:11px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--acc);margin:16px 0 6px}
  .rv h3:first-child{margin-top:0}
  .rv p{margin:0 0 9px}
  .rv ul{margin:0 0 10px;padding-left:18px}
  .rv li{margin-bottom:5px}
  .rv strong{color:#fff;font-weight:700}
  .quote{font-size:13px;color:var(--mut);font-style:italic;border-left:2px solid var(--line);padding-left:10px;margin:0 0 12px}
  .spin{display:inline-block;width:12px;height:12px;border:2px solid var(--line);border-top-color:var(--acc);border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px;margin-right:7px}
  @keyframes sp{to{transform:rotate(360deg)}}

  /* coach */
  .msgs{display:flex;flex-direction:column;gap:10px;margin-bottom:14px}
  .msg{max-width:88%;padding:11px 13px;border-radius:14px;font-size:14px;line-height:1.55}
  .msg.u{align-self:flex-end;background:var(--acc);color:var(--acc-d);font-weight:600;border-bottom-right-radius:5px}
  .msg.a{align-self:flex-start;background:var(--card);border:1px solid var(--line);border-bottom-left-radius:5px}
  .msg.a p{margin:0 0 8px}
  .msg.a p:last-child{margin:0}
  .msg.a ul{margin:4px 0 8px;padding-left:17px}
  .msg.a strong{color:#fff;font-weight:700}
  .msg.s{align-self:center;background:#15201a;border:1px solid #27402f;color:#9fdcb4;
    font-size:11.5px;font-weight:700;padding:6px 11px;border-radius:999px;max-width:94%;text-align:center}
  .ask{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:end;margin-bottom:10px}
  .ask textarea{min-height:46px;max-height:140px;font-size:14.5px;padding:12px}
  .send{width:46px;height:46px;flex:0 0 46px;border-radius:12px;background:var(--acc);color:var(--acc-d);
    font-size:17px;font-weight:800;display:flex;align-items:center;justify-content:center}
  .send[disabled]{opacity:.4}
  .sugg{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:6px}
  .sugg button{font-size:12px;font-weight:600;color:var(--mut);padding:7px 11px;border:1px solid var(--line);

  var prevMax=0; if(h[1]) h[1].sets.forEach(function(s){ if(s.kg>prevMax) prevMax=s.kg; });
  if(cut&&prevMax&&maxKg<prevMax) return {kg:maxKg,why:'Last time '+fmt(maxKg)+'kg × '+hit+' — a dip while you are losing weight is normal; hold here and build back'};
  return {kg:maxKg,why:'Last time '+fmt(maxKg)+'kg × '+hit+' — hold the weight and beat the reps'};
}

function beep(){
  if(!actx) return;
  try{
    [0,0.22].forEach(function(off){
      var o=actx.createOscillator(), g=actx.createGain();
      o.connect(g); g.connect(actx.destination);
      o.type='sine'; o.frequency.value=880;
      var t=actx.currentTime+off;
      g.gain.setValueAtTime(0.0001,t);
      g.gain.exponentialRampToValueAtTime(0.22,t+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,t+0.16);
      o.start(t); o.stop(t+0.18);
    });
  }catch(e){}
}

/* ---------------- progress charts ---------------- */
function exerciseNames(){
  var seen={},out=[];
  finished().slice().reverse().forEach(function(s){
    (s.ex||[]).forEach(function(e){
      if(e.kind==='protocol') return;
      if(!(e.sets||[]).filter(function(x){return x.done;}).length) return;
      var k=String(e.name||'').trim(), ky=exKey(k);
      if(!k) return;
      if(ky in seen){ out[seen[ky]]=k; return; }     /* same exercise under another name: show the newest name */
      seen[ky]=out.length; out.push(k);
    });
  });
  return out;
}
function progData(name){
  var key=exKey(name), out=[];
  finished().slice().reverse().forEach(function(s){      /* oldest first */
    (s.ex||[]).forEach(function(e){
      if(exKey(e.name)!==key) return;
      var done=(e.sets||[]).filter(function(x){return x.done&&!x.warm;});
      if(!done.length) return;
      var top=0,vol=0,best=0;
      done.forEach(function(x){
        var k=num(x.kg)+exBase(e); if(k>top) top=k;
        vol+=setLoad(e,x)*num(x.reps);
        var r=e1rm(e,x); if(r>best) best=r;
      });
      out.push({x:new Date(s.finishedAt).toLocaleDateString(LOC(),{day:'numeric',month:'short'}),
        top:top,vol:vol,e1rm:Math.round(best*10)/10,sets:done.length,at:s.finishedAt});
    });
  });
  return out;
}
/* one series per chart, so the title carries identity and no legend is needed */
function chartSVG(pts,color){
  var n=pts.length, W=320,H=134,PL=38,PR=18,PT=18,PB=22;
  var vals=pts.map(function(p){return p.y;});
  var mn=Math.min.apply(null,vals), mx=Math.max.apply(null,vals);
  if(mx===mn){ var d0=Math.abs(mx)*0.1||1; mn-=d0; mx+=d0; }
  var pad=(mx-mn)*0.18; mn=Math.max(0,mn-pad); mx=mx+pad;
  /* snap the axis to readable round numbers rather than whatever the data lands on */
  var raw=(mx-mn)/2, mag=Math.pow(10,Math.floor(Math.log(raw)/Math.LN10)), q=raw/mag;
  var gs=(q<1.5?1:q<3?2:q<7?5:10)*mag;
  mn=Math.max(0,Math.floor(mn/gs)*gs); mx=Math.ceil(mx/gs)*gs;
  if(mx<=mn) mx=mn+gs;
  var X=function(i){ return n<2?PL+(W-PL-PR)/2:PL+i*(W-PL-PR)/(n-1); };
  var Y=function(v){ return PT+(H-PT-PB)*(1-(v-mn)/((mx-mn)||1)); };
  var h='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="trend chart">';
  for(var g=mn;g<=mx+gs*0.001;g+=gs){
    var y=Y(g);
    h+='<line class="gl" x1="'+PL+'" y1="'+y.toFixed(1)+'" x2="'+(W-PR)+'" y2="'+y.toFixed(1)+'"/>'
      + '<text class="ax" x="'+(PL-7)+'" y="'+(y+3.2).toFixed(1)+'" text-anchor="end">'
      + fmt(Math.round(g*100)/100)+'</text>';
  }
  h+='<path d="'+pts.map(function(p,i){ return (i?'L':'M')+X(i).toFixed(1)+' '+Y(p.y).toFixed(1); }).join(' ')
    + '" fill="none" stroke="'+color+'" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>';
  var best=0; pts.forEach(function(p,i){ if(p.y>pts[best].y) best=i; });
  pts.forEach(function(p,i){
    h+='<circle cx="'+X(i).toFixed(1)+'" cy="'+Y(p.y).toFixed(1)+'" r="4" fill="'+color+'" stroke="#171a22" stroke-width="2"/>';
  });
  var lab=function(i){
    h+='<text class="lb" x="'+X(i).toFixed(1)+'" y="'+(Y(pts[i].y)-10).toFixed(1)+'" text-anchor="'
      + (i===0?'start':i===n-1?'end':'middle')+'">'+esc(fmt(pts[i].y))+'</text>';
  };
  if(best!==n-1) lab(best);
  lab(n-1);
  h+='<text class="ax" x="'+X(0).toFixed(1)+'" y="'+(H-5)+'" text-anchor="start">'+esc(pts[0].x)+'</text>';
  if(n>1) h+='<text class="ax" x="'+X(n-1).toFixed(1)+'" y="'+(H-5)+'" text-anchor="end">'+esc(pts[n-1].x)+'</text>';
  return h+'</svg>';
}

function simpleTrend(title,cap,pts,color,unit){

/* flat trend AND no new best — both, so adding reps does not read as a stall */
function stallInfo(rows){
  var pts=rows.filter(function(r){ return r.e1rm>0; });
  if(pts.length<3) return null;
  var cut=Date.now()-28*86400000;
  var win=pts.filter(function(p){ return p.at>=cut; });
  if(win.length<3) return null;
  var n=win.length, t0=win[0].at, sx=0,sy=0,sxy=0,sxx=0;
  win.forEach(function(p){ var x=(p.at-t0)/604800000; sx+=x; sy+=p.e1rm; sxy+=x*p.e1rm; sxx+=x*x; });
  var den=n*sxx-sx*sx; if(!den) return null;
  var slope=(n*sxy-sx*sy)/den;
  var cur=win[win.length-1].e1rm;
  var pct=cur?slope/cur*100:0;
  var before=pts.filter(function(p){ return p.at<cut; });
  var bestBefore=before.reduce(function(a,p){ return p.e1rm>a?p.e1rm:a; },0);
  var bestIn=win.reduce(function(a,p){ return p.e1rm>a?p.e1rm:a; },0);
  /* with no history before the window there is nothing to beat, so it is not a PR */
  var newPR=before.length>0&&bestIn>bestBefore;
  return {pct:pct,weeks:Math.round((win[win.length-1].at-t0)/604800000*10)/10,
    newPR:newPR, stalled:pct<1&&!newPR};
}
function repPRs(name){
  var key=exKey(name), best={};
  finished().forEach(function(s){
    (s.ex||[]).forEach(function(e){
      if(exKey(e.name)!==key) return;
      (e.sets||[]).forEach(function(x){
        if(!x.done) return;
        var w=Math.round((num(x.kg)+exBase(e))*100)/100, r=num(x.reps);
        if(!w||!r) return;
        if(!best[w]||r>best[w].reps) best[w]={reps:r,at:s.finishedAt};
      });
    });
  });
  return Object.keys(best).map(Number).sort(function(a,b){ return b-a; })
    .map(function(w){ return {kg:w,reps:best[w].reps,at:best[w].at}; });
}

function prevSession(dayId,notId){

function statsBlock(ses){

function buildPrompt(ses){

  (ses.ex||[]).forEach(function(e,i){

    if(e.note) L.push('   cue given: '+e.note);
    if(e.kind==='protocol') (e.segs||[]).forEach(function(s){ var n=segNums(e,s);
      L.push('   block '+(s.label||'?')+': '+(s.detail||'?')+' — '+(s.done?'done':'NOT DONE')
        +(s.act&&(s.act.kmh||s.act.min)?' (actually: '+(n.kmh?fmt(n.kmh)+' km/h':'')+(n.min?' for '+fmt(n.min)+' min':'')+(n.incl?' at '+fmt(n.incl)+' deg':'')+')':'')); });

    if(tm!=null) L.push('   time on this exercise: '+tm+' min ('+e.t0+' to '+e.t1+')');
  });
  try{ L.push(''); L.push(bodyBrief()); L.push('Judge the numbers in that light: a held lift during a cut is a good result.'); }catch(e){}
  var rprs=sessionPRs(ses), rk=Object.keys(rprs);
  if(rk.length){ L.push(''); L.push('PERSONAL RECORDS THIS SESSION (call these out):');
    (ses.ex||[]).forEach(function(e){ if(rprs[e.id]) L.push('- '+e.name+': '+rprs[e.id].text+' ('+rprs[e.id].was+')'); }); }
  var gaps=[];
  (ses.ex||[]).forEach(function(e,i){
    var nx=(ses.ex||[])[i+1];
    if(nx&&hm(e.t1)!=null&&hm(nx.t0)!=null){ var g=hm(nx.t0)-hm(e.t1); if(g<0) g+=1440; if(g<120) gaps.push(e.name+' -> '+nx.name+': '+g+' min'); }
  });
  if(gaps.length) L.push('Transitions between exercises: '+gaps.join('; ')+'.');
  var prev=prevSession(ses.dayId,ses.id);
  if(prev){
    L.push(''); L.push('PREVIOUS TIME THEY DID THIS ('+stampLabel(prev.finishedAt)+'):');
    (prev.ex||[]).forEach(function(e){
      var d=(e.sets||[]).filter(function(x){return x.done;});
      if(d.length) L.push('- '+e.name+': '+d.map(function(x){return num(x.kg)+'kg×'+num(x.reps);}).join(', '));
    });
    L.push('Previous total volume: '+fmt(volume(prev))+' kg.');
  }
  L.push(''); L.push("LIFTER'S COMMENTS: "+(ses.notes?('"'+ses.notes+'"'):'(none written)'));
  L.push('');
  L.push('Write the review in markdown with exactly these headings:');
  L.push('## Verdict — 2-3 sentences on the session overall.');
  L.push('## What stood out — 2-4 bullets citing their actual numbers.');
  L.push('## Watch out — 1-3 bullets on form, fatigue or skipped work. Omit the heading if there is nothing real to say.');
  L.push('## Next time — 2-3 bullets with concrete weight or rep targets.');
  L.push('If per-exercise times are given, comment briefly on pacing: which exercise ran long, and whether transitions dragged.');
  L.push('Under 260 words. Address them as "you". Use only the data above — never invent lifts, numbers or injuries.');
  return L.join('\n');
}
function mdToHtml(md){
  var out='',inUl=false;
  function inline(s){ return esc(s).replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/\*([^*]+)\*/g,'<em>$1</em>'); }
  String(md||'').split('\n').forEach(function(ln){
    var t=ln.trim();
    if(/^#{1,4}\s/.test(t)){ if(inUl){out+='</ul>';inUl=false;} out+='<h3>'+inline(t.replace(/^#{1,4}\s*/,''))+'</h3>'; }
    else if(/^[-*•]\s/.test(t)){ if(!inUl){out+='<ul>';inUl=true;} out+='<li>'+inline(t.replace(/^[-*•]\s*/,''))+'</li>'; }
    else if(!t){ if(inUl){out+='</ul>';inUl=false;} }
    else { if(inUl){out+='</ul>';inUl=false;} out+='<p>'+inline(t)+'</p>'; }
  });
  if(inUl) out+='</ul>';
  return out;
}
function paintReview(){
  var el=document.getElementById('rvbody'); if(!el) return;
  el.innerHTML=S.reviewText?mdToHtml(S.reviewText)
    :'<p style="color:var(--mut)"><span class="spin"></span>Reading through your session…</p>';
}
function askReview(sesId){
  var ses=byId('sessions',sesId); if(!ses) return;
  S.reviewing=true; S.reviewText=''; S.reviewNote=''; S.showReview=sesId; S.view='today'; render();
  var finish=function(text,note){
    S.reviewing=false; S.reviewText=text; S.reviewNote=note||'';
    var s=byId('sessions',sesId);
    if(s){ var c=JSON.parse(JSON.stringify(s)); c.review={text:text,at:Date.now()}; put('sessions',c,true); }
    else render();
  };
  if(!S.sample){
    if(!aiKey()){ finish(localReview(ses),''); return; }
    geminiCall(buildPrompt(ses)).then(function(res){ finish(res.text,''); })
      .catch(function(e){ finish(localReview(ses),aiErr(e)+' Showing the built-in review instead.'); });
    return;
  }
  var done=false,timer=setTimeout(function(){ if(!done){done=true;finish(localReview(ses),'The review took too long — summary instead.');} },45000);
  try{
    S.sample(buildPrompt(ses),{modelTier:'default',onText:function(o){ if(!done){ S.reviewText=o.text||''; paintReview(); } }})
    .then(function(res){ if(done)return; done=true; clearTimeout(timer); finish((res&&res.text)||localReview(ses),''); })
    .catch(function(err){
      if(done)return; done=true; clearTimeout(timer);
      var c=err&&err.code;
      finish(localReview(ses), c==='not_granted'?'AI review not available here — summary instead.'
        : c==='rate_limited'?'Rate limited — summary instead, try again in a minute.'
        : 'Could not reach the AI reviewer — summary instead.');
    });
  }catch(e){ done=true; clearTimeout(timer); finish(localReview(ses),'Could not start the AI review.'); }
}

    }

      reps:String(e.reps==null?'8-10':e.reps),kg:String(e.kg==null?'':e.kg),note:String(e.note||'')};

function sysMsg(text){ put('chat',{id:uid(),role:'sys',text:text,at:Date.now()},true); }

/* the coach writes workouts as plain lines — flat strings travel far better than nested schemas */
var PLAN_FORMAT='One exercise per line, in order. '
 +'LIFT lines: Name | sets | reps | kg | cue  — e.g. "Chest Press Machine | 4 | 8-10 | 45 | Scapula retracted, 2-second negative, explode up". '
 +'CARDIO or timed lines start with the word cardio: cardio | Name | spec | block = detail ; block = detail | cue '
 +'— e.g. "cardio | Incline Treadmill Finisher | 10 minutes @ 15 degree incline | 0:00-7:00 = 6.0 km/h ; 7:00-9:00 = 7.0 km/h ; 9:00-10:00 = 5.5 km/h cool down | Keep the incline at 15 the whole way". '
 +'Always give a cue. Use kg numbers only, no units.';

function parsePlan(txt){
  var out=[];
  String(txt||'').split('\n').forEach(function(ln){
    var t=ln.trim(); if(!t) return;
    t=t.replace(/^[-*•]\s*/,'').replace(/^\d+[\).]\s*/,'');
    var p=t.split('|').map(function(x){ return x.trim(); });
    if(/^cardio$/i.test(p[0])||/^protocol$/i.test(p[0])){
      var segs=[];
      String(p[3]||'').split(';').forEach(function(s){
        if(!s.trim()) return;
        var k=s.indexOf('=');
        segs.push(k<0?{label:s.trim(),detail:''}:{label:s.slice(0,k).trim(),detail:s.slice(k+1).trim()});
      });
      out.push({id:uid(),kind:'protocol',name:p[1]||'Finisher',spec:p[2]||'',note:p[4]||'',segs:segs});
    } else {
      out.push({id:uid(),kind:'strength',name:p[0]||'Exercise',sets:p[1]||'4',
        reps:p[2]||'8-10',kg:p[3]||'',note:p[4]||''});
    }
  });
  return out;
}
var RESULT_FORMAT='One exercise per line, in order. '
 +'LIFT lines: Name | set ; set ; set | optional comment — each set is weight x reps, e.g. '
 +'"Seated Row Machine | 100x8 ; 100x8 ; 100x7 ; 95x8 | last set was a grind". '
 +'For bodyweight work give reps alone: "Push Ups | 12 ; 10 ; 10". '
 +'CARDIO lines: cardio | Name | spec | block = detail ; block = detail | optional comment '
 +'— every block is recorded as completed. Weights are plain kg numbers, no units.';

/* a workout that already happened, with the weights and reps actually hit */
function parseResults(txt){
  var out=[];
  String(txt||'').split('\n').forEach(function(ln){
    var t=ln.trim(); if(!t) return;
    t=t.replace(/^[-*\u2022]\s*/,'').replace(/^\d+[\).]\s*/,'');
    var p=t.split('|').map(function(x){ return x.trim(); });
    if(/^cardio$/i.test(p[0])||/^protocol$/i.test(p[0])){
      var segs=[];
      String(p[3]||'').split(';').forEach(function(sg){
        if(!sg.trim()) return;
        var k=sg.indexOf('=');
        segs.push(k<0?{label:sg.trim(),detail:'',done:true}
                     :{label:sg.slice(0,k).trim(),detail:sg.slice(k+1).trim(),done:true});
      });
      var cl0=exLib(fixTypos(p[1]||''));
      out.push({id:uid(),kind:'protocol',name:cl0&&cl0.load==='cardio'?cl0.name:(p[1]||'Finisher'),spec:p[2]||'',note:'',
        segs:segs,comment:p[4]||''});
      return;
    }
    var sets=[];
    String(p[1]||'').split(/[;,]/).forEach(function(sv){
      var v=sv.trim(); if(!v) return;
      var m=v.match(/(-?\d+(?:[.,]\d+)?)\s*[x×*@]\s*(\d+(?:[.,]\d+)?)/i);
      if(m){ sets.push({kg:String(num(m[1])),reps:String(num(m[2])),done:true}); return; }
      if(/^\d+(?:[.,]\d+)?$/.test(v)) sets.push({kg:'',reps:String(num(v)),done:true});
    });
    if(!sets.length) return;
    var top=0; sets.forEach(function(x){ if(num(x.kg)>top) top=num(x.kg); });
    out.push({id:uid(),kind:'strength',name:p[0]||'Exercise',note:'',comment:p[2]||'',
      target:{sets:sets.length,reps:String(num(sets[0].reps)),kg:top},sets:sets});
  });
  return out;
}
function dowFromName(s){
  var n=String(s||'').trim().toLowerCase().slice(0,3);
  var i=['sun','mon','tue','wed','thu','fri','sat'].indexOf(n);
  if(i>=0) return i;
  var d=parseInt(s,10);
  return (d>=0&&d<=6)?d:-1;
}

function planSnapshot(){
  var L=[],t=new Date();
  L.push("TODAY: "+t.toLocaleDateString(LOC(),{weekday:'long',day:'numeric',month:'long',year:'numeric'})+" ("+ymd(t)+")");
  L.push('MAIN TRAINING DAYS right now: '+mainDayNames()+'. These come from whichever standing routines are in force.');
  L.push('GYM: '+gym().name+'. Hours: '+[1,2,3,4,5,6,0].map(function(w){
    var h=gymDay(w); return DOW[w]+' '+(h?h[0]+'-'+h[1]:'closed'); }).join(', ')
    +'. Never schedule a session on a day it is closed, and warn when a day closes early.');
  if((S.profile.gymMissing||[]).length) L.push('NOT AVAILABLE at their gym, never suggest or add these: '+S.profile.gymMissing.join(', ')+'.');
  L.push('');

function coachSend(text){
  text=String(text||'').trim(); if(!text||S.busy) return;
  put('chat',{id:uid(),role:'user',text:text,at:Date.now()},true);
  S.draft=''; S.busy=true; S.stream=''; render();
  setTimeout(scrollEnd,30);
  var pm=null, tx=nlIn(text); try{ pm=/\b(swap|replace|switch|instead of|remove|drop|move|between|after|before)\b/i.test(tx)?null:parseSetMessage(tx); }catch(e){}
  if(pm||parseReorder(tx)||parseClear(tx)){ coachRules(text); return; }                /* exact numbers are logged by the app, not paraphrased by a model */
  if(!S.sample){ if(aiKey()) coachGemini(text); else coachRules(text); return; }

  var msgs=[{role:'user',content:coachPreamble()+'\n\nReply to this setup message with exactly: Ready.'},
            {role:'assistant',content:'Ready.'}];
  S.chat.filter(function(m){ return m.role==='user'||m.role==='assistant'; }).slice(-14).forEach(function(m){
    msgs.push({role:m.role,content:m.text});
  });
  if(msgs[msgs.length-1].role!=='user') msgs.push({role:'user',content:text});

  var done=false;
  var settle=function(text){
    if(done)return; done=true; S.busy=false; S.stream='';
    put('chat',{id:uid(),role:'assistant',text:text||'(no reply)',at:Date.now()},true);
    setTimeout(scrollEnd,30);
  };
  var timer=setTimeout(function(){ settle('That took too long — try asking again.'); },120000);

  var run=function(withTools){
    var opts={modelTier:'default',onText:function(o){ if(!done){ S.stream=o.text||''; paintStream(); } }};
    if(withTools) opts.tools=coachTools();
    return S.sample(msgs,opts);
  };

  /* tool plumbing is the most likely thing to break: fall back to plain advice rather than nothing */
  var handle=function(err,retried){
    var c=(err&&err.code)||'';
    if(c==='not_granted'){ clearTimeout(timer); return settle("I can't reach the AI coach from this page."); }
    if(c==='rate_limited'){ clearTimeout(timer); return settle('Rate limited — give it a minute and ask again.'); }
    if(!retried){
      try{
        return run(false).then(function(res){
          clearTimeout(timer);
          settle(((res&&res.text)||'')+'\n\n*(Answered without plan editing this time, so nothing in your calendar changed.)*');
        }).catch(function(e2){ handle(e2,true); });
      }catch(e3){ return handle(e3,true); }
    }
    clearTimeout(timer);
    settle('Coach unavailable'+(c?' ('+c+')':'')
      +((err&&err.message)?': '+err.message:'. Try again in a moment.'));
  };

  try{
    run(true).then(function(res){ clearTimeout(timer); settle((res&&res.text)||''); })
      .catch(function(err){ handle(err,false); });
  }catch(e){ handle(e,false); }
}

/* Mifflin-St Jeor. With no sex given, the midpoint of the two formulas. */
function energy(){
  var p=S.profile, w=num(p.weightKg), h=num(p.heightCm), a=num(p.age);
  if(!w||!h||!a) return null;
  var male=10*w+6.25*h-5*a+5, female=10*w+6.25*h-5*a-161;
  var bmr=p.sex==='m'?male:p.sex==='f'?female:(male+female)/2;

  var tdee=bmr*af;
  var adj=aimAdj(p.aim||'keep');
  return {bmr:Math.round(bmr),tdee:Math.round(tdee),
    target:Math.max(1200,Math.round((tdee+adj)/10)*10),
    floored:(tdee+adj)<1200, protein:Math.round(w*1.8)};
}
/* smoothed body weight: raw scale readings swing with water and food */
function trendWeights(){
  var P=0.1, trend=null, out=[];
  S.weights.slice().sort(function(a,b){ return String(a.date)<String(b.date)?-1:1; })
    .forEach(function(w){
      var kg=num(w.kg); if(!kg) return;
      trend = (trend==null) ? kg : trend + P*(kg-trend);
      out.push({date:w.date,raw:kg,trend:Math.round(trend*100)/100,at:fromYmd(w.date).getTime()});
    });
  return out;
}
/* solve for expenditure instead of predicting it:
   mean intake minus the energy the trend says you actually gained or lost */
function adaptiveTDEE(){
  var tr=trendWeights();
  if(tr.length<2) return null;
  var endAt=tr[tr.length-1].at;
  var win=tr.filter(function(p){ return p.at>=endAt-21*86400000; });
  if(win.length<2) return {ready:false,why:'Weigh in a few more times over a couple of weeks.'};
  var days=Math.round((win[win.length-1].at-win[0].at)/86400000);
  if(days<10) return {ready:false,why:'Needs about two weeks between your first and last weigh-in.'};
  var logged=0,total=0;
  for(var i=0;i<=days;i++){
    var dsx=ymd(new Date(win[0].at+i*86400000)), kc=dayTotals(dsx).kcal;
    if(kc>0&&!partialDay(dsx)){ total+=kc; logged++; }
  }
  var missing=days+1-logged;
  if(logged<Math.ceil((days+1)*0.7))
    return {ready:false,why:'Food is logged on '+logged+' of the last '+(days+1)+' days. It needs about 70%.'};
  var meanIntake=total/logged;
  var dTrend=win[win.length-1].trend-win[0].trend;
  var est=meanIntake-(dTrend*7700)/days;          /* 7700 kcal per kg of tissue */
  if(!(est>800&&est<6000)) return {ready:false,why:'The numbers do not look settled yet. Keep logging.'};
  return {ready:true,tdee:Math.round(est/10)*10,days:days,logged:logged,missing:missing,
    intake:Math.round(meanIntake),dTrend:Math.round(dTrend*100)/100,
    rate:Math.round(dTrend/days*7*100)/100};
}

/* ================= BODY WEIGHT: what your scale trend means for training ================= */
/* Uses the smoothed trend, not single weigh-ins. Needs about a week between first and last weigh-in. */
function bodyState(){
  var tr=trendWeights(), p=S.profile||{}, aim=p.aim||'keep';
  var cur=tr.length?tr[tr.length-1].trend:num(p.weightKg);
  var out={kg:cur?Math.round(cur*10)/10:0,aim:aim,phase:'unknown',rate:0,pct:0,days:0,fast:false,
    lastAt:tr.length?tr[tr.length-1].at:0,n:tr.length,ready:false,note:''};
  if(!cur) return out;
  if(tr.length>=2){
    var end=tr[tr.length-1], win=tr.filter(function(x){ return x.at>=end.at-28*86400000; }), first=win[0];
    var days=(end.at-first.at)/86400000;
    if(days>=6&&win.length>=3){
      /* straight-line fit through the raw weigh-ins: the smoothed line lags too much to read a rate from */
      var n=win.length, mx=0, my=0, sxy=0, sxx=0;
      win.forEach(function(x){ mx+=(x.at-first.at)/86400000; my+=x.raw; }); mx/=n; my/=n;
      win.forEach(function(x){ var dx=(x.at-first.at)/86400000-mx; sxy+=dx*(x.raw-my); sxx+=dx*dx; });
      var slope=sxx?sxy/sxx:0;
      cur=my+slope*(days-mx); out.kg=Math.round(cur*10)/10;
      out.ready=true; out.days=Math.round(days);
      out.rate=Math.round(slope*7*100)/100;                                   /* kg per week */
      out.pct=Math.round(out.rate/cur*1000)/10;                              /* % of body weight per week */
      out.phase=out.pct<=-0.25?'cutting':out.pct>=0.25?'gaining':'steady';
      out.fast=out.pct<=-1||out.pct>=0.75;
    }
  }
  var want=aim==='lose'?'cutting':aim==='gain'?'gaining':'steady';
  if(!out.ready) out.note='Weigh in a few times over a week or more and training advice will follow your trend.';
  else if(out.phase==='cutting'&&out.pct<=-1) out.note='Losing fast (about '+fmt(Math.abs(out.pct))+'% a week). Strength usually slips at this pace; holding your weights is a good result, and a little more food would protect them.';
  else if(out.phase==='cutting') out.note='Losing about '+fmt(Math.abs(out.rate))+' kg a week. Expect slower strength gains; holding weights and adding reps counts as progress.';
  else if(out.phase==='gaining'&&out.pct>=0.75) out.note='Gaining fast (about '+fmt(out.pct)+'% a week). Much of that is likely fat; a smaller surplus builds the same muscle.';
  else if(out.phase==='gaining') out.note='Gaining about '+fmt(out.rate)+' kg a week. Good time to push weights up.';
  else out.note='Weight is steady. Progress comes from beating reps, then adding weight.';
  if(out.ready&&want!==out.phase&&!(want==='steady'&&!out.fast)) out.note+=' Your goal is set to '+(aim==='lose'?'lose':aim==='gain'?'gain':'maintain')+', so the trend and the goal disagree.';
  return out;
}

function shrink(file,max,q,asData){
  return new Promise(function(res,rej){
    var url=URL.createObjectURL(file), img=new Image();
    img.onload=function(){
      var sc=Math.min(1,max/Math.max(img.width,img.height)||1);
      var c=document.createElement('canvas');
      c.width=Math.max(1,Math.round(img.width*sc));
      c.height=Math.max(1,Math.round(img.height*sc));
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(url);
      if(asData){ try{ res(c.toDataURL('image/jpeg',q)); }catch(e){ rej(e); } return; }
      c.toBlob(function(b){ b?res(b):rej(new Error('Could not process that image')); },'image/jpeg',q);
    };
    img.onerror=function(){ URL.revokeObjectURL(url); rej(new Error('That file is not an image I can read')); };
    img.src=url;
  });
}

    per:{kcal:k/100,protein:pr/100,carbs:c/100,fat:f/100}
  };
}
function offGet(url){
  var ctl=typeof AbortController!=='undefined'?new AbortController():null;
  var t=setTimeout(function(){ if(ctl) ctl.abort(); },12000);
  return fetch(url,ctl?{signal:ctl.signal}:{}).then(function(r){
    clearTimeout(t);
    if(!r.ok){ var e=new Error('http'); e.status=r.status; throw e; }
    return r.json();
  },function(e){ clearTimeout(t); throw e; });
}
function lookupErr(e){
  if(typeof navigator!=='undefined'&&navigator.onLine===false) return 'You are offline. Type the numbers in, or try again with signal.';
  if(e&&e.status===429) return 'The food database is busy. Wait a moment and search again.';
  if(e&&e.status) return 'The food database gave an error ('+e.status+'). Try again shortly.';
  return hosted()?'The food database cannot be reached from inside Claude. It works in the browser version.'
                 :'Could not reach the food database. Check your connection and try again.';
}
function useFoodItem(it,source){
  var pd=S.food.pending&&!S.food.pending.editId?S.food.pending:{thumb:'',kcal:0,protein:0,carbs:0,fat:0};
  pd.name=it.name; pd.items=[{name:it.name,grams:it.grams,kcal:it.kcal,protein:it.protein,carbs:it.carbs,fat:it.fat,per:it.per}];
  pd.source=source; pd.confidence=''; pd.assumptions=it.serving?'One serving on the label is '+it.serving+'. Change the grams to what you ate.'
    :'No serving size on the label, so this starts at 100 g. Change the grams to what you ate.';
  recalc(pd);
  S.food.pending=pd; S.food.search=null; S.food.err=''; S.view='food'; render();
}

function searchHTML(){

function paintSearch(){ var el=document.getElementById('fsres'); if(el) el.innerHTML=searchHTML(); }
function foodSearchSoon(q){
  q=String(q||'').trim();
  clearTimeout(searchT);
  if(q.length<3){ S.food.search=null; paintSearch(); return; }
  S.food.search={q:q,loading:true,results:(S.food.search&&S.food.search.results)||[]};
  paintSearch();
  searchT=setTimeout(function(){ foodSearch(q); },850);       /* the database allows only a few searches a minute */
}
var SEARCHC={};
function offSearch(q){
  if(SEARCHC[q]) return Promise.resolve(SEARCHC[q]);
  var main=OFF+'/cgi/search.pl?search_terms='+encodeURIComponent(q)
    +'&search_simple=1&action=process&json=1&page_size=20&sort_by=unique_scans_n&fields='+OFF_FIELDS;
  var backup='https://search.openfoodfacts.org/search?q='+encodeURIComponent(q)+'&page_size=20&fields='+OFF_FIELDS;
  var take=function(d){ var list=(d&&(d.products||d.hits))||[]; if(!list.length&&!(d&&('count' in d))) throw new Error('empty'); return list; };
  return offGet(main).then(take).catch(function(e1){
    return offGet(backup).then(take).catch(function(){ throw e1; });        /* the main search is often busy; try the newer one */
  }).then(function(list){ SEARCHC[q]=list; return list; });
}
function foodSearch(q){
  var seq=++searchSeq;
  offSearch(q)
  .then(function(list){
    if(seq!==searchSeq) return;
    var out=myFoodMatches(q).concat(list.map(offItem).filter(Boolean)).slice(0,10);
    S.food.search={q:q,results:out,done:true}; paintSearch();
  })
  .catch(function(e){
    if(seq!==searchSeq) return;
    S.food.search={q:q,results:myFoodMatches(q),err:lookupErr(e)}; paintSearch();
  });
}
function namePrompt(q){
  return 'Estimate the nutrition of this food or meal for someone tracking calories and protein: "'+q+'".\n'
   + 'Assume one typical adult portion unless an amount is given. Break it into its main components.\n'
   + 'Reply with ONLY a JSON object, no prose, in this shape:\n'
   + '{"name":"short name","items":[{"name":"component","grams":150,"kcal":250,"protein":30,"carbs":0,"fat":14}],'
   + '"low_kcal":400,"high_kcal":650,"confidence":"low|medium|high","assumptions":"one sentence on the portion you assumed"}';
}
function aiFood(){
  var s=S.food.search; if(!s||!s.q||s.ai) return;
  s.ai=true; paintSearch();
  var q=s.q;
  (S.sample?S.sample(namePrompt(q)):geminiCall(namePrompt(q),{json:true}))
  .then(function(res){
    var d=looseJSON(res&&res.text); if(!d) throw new Error('unreadable');
    var items=prepItems(d.items);
    var pd=S.food.pending&&!S.food.pending.editId?S.food.pending:{thumb:''};
    pd.name=String(d.name||q); pd.items=items; pd.source='ai';
    pd.low=Math.round(num(d.low_kcal)); pd.high=Math.round(num(d.high_kcal));
    pd.confidence=String(d.confidence||''); pd.assumptions=String(d.assumptions||'');
    if(items.length) recalc(pd);
    S.food.pending=pd; S.food.search=null; render();
  })
  .catch(function(e){
    if(S.food.search){ S.food.search.ai=false; S.food.search.err=photoErr(e).replace('that photo','that meal'); }
    paintSearch();
  });
}

/* ---- barcode: its own layer outside #app so a redraw never kills the camera ---- */
var SCAN=null;
function closeScanner(){
  if(!SCAN) return;
  clearInterval(SCAN.timer);
  try{ if(SCAN.stream) SCAN.stream.getTracks().forEach(function(t){ t.stop(); }); }catch(e){}
  if(SCAN.el&&SCAN.el.parentNode) SCAN.el.parentNode.removeChild(SCAN.el);
  SCAN=null;
}
function scanMsg(t){ if(SCAN&&SCAN.msg) SCAN.msg.textContent=t; }
function lookupBarcode(code){
  code=String(code||'').replace(/\D/g,'');
  if(code.length<8){ scanMsg('A barcode has 8 to 13 digits.'); return; }
  if(SCAN){ if(SCAN.busy) return; SCAN.busy=true; }
  scanMsg('Found '+code+'. Looking it up…');
  offGet(OFF+'/api/v2/product/'+code+'.json?fields='+OFF_FIELDS)
  .then(function(d){
    var it=d&&d.status===1?offItem(d.product):null;
    if(!it){ if(SCAN) SCAN.busy=false;
      scanMsg(d&&d.status===1?'That product is listed without calories. Add it manually.':'Barcode '+code+' is not in the database. Add it manually.'); return; }
    closeScanner(); useFoodItem(it,'barcode');
  })
  .catch(function(e){ if(SCAN) SCAN.busy=false; scanMsg(lookupErr(e)); });
}
function openScanner(){
  closeScanner();
  var el=document.createElement('div');
  el.setAttribute('style','position:fixed;inset:0;z-index:90;background:#07080b;display:flex;flex-direction:column;padding:16px;gap:12px;overflow:auto');
  el.innerHTML='<div style="display:flex;justify-content:space-between;align-items:center">'
    + '<b style="font-size:17px">Scan a barcode</b><button class="btn" style="width:auto" data-s="close">Close</button></div>'
    + '<div style="position:relative;border-radius:16px;overflow:hidden;background:#000;aspect-ratio:4/3;max-height:46vh">'
    + '<video playsinline muted autoplay style="width:100%;height:100%;object-fit:cover"></video>'
    + '<div style="position:absolute;left:8%;right:8%;top:50%;height:2px;background:var(--acc);opacity:.85"></div></div>'
    + '<div data-s="msg" style="font-size:13.5px;color:var(--mut);line-height:1.5;min-height:40px">Starting the camera…</div>'
    + '<label class="btn" data-s="shot" style="display:none">Take a photo of the barcode instead'
    + '<input type="file" accept="image/*" capture="environment" style="position:absolute;left:-9999px;width:1px;height:1px;opacity:0"></label>'
    + '<div style="display:flex;gap:8px"><input data-s="num" type="text" inputmode="numeric" placeholder="or type the number under the bars" style="flex:1">'
    + '<button class="btn p" style="width:auto" data-s="go">Look up</button></div>';
  document.body.appendChild(el);
  var q=function(s){ return el.querySelector(s); };
  SCAN={el:el,msg:q('[data-s="msg"]'),video:q('video'),stream:null,timer:0,busy:false};
  q('[data-s="close"]').addEventListener('click',closeScanner);
  q('[data-s="go"]').addEventListener('click',function(){ lookupBarcode(q('[data-s="num"]').value); });
  q('[data-s="num"]').addEventListener('keydown',function(ev){ if(ev.key==='Enter') lookupBarcode(q('[data-s="num"]').value); });

  var det=null;
  try{ if('BarcodeDetector' in window) det=new window.BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e']}); }catch(e){ det=null; }
  var shot=q('[data-s="shot"]'), shotIn=shot.querySelector('input');
  if(det) shotIn.addEventListener('change',function(){
    var f=shotIn.files&&shotIn.files[0]; shotIn.value=''; if(!f) return;
    scanMsg('Reading the photo…');
    createImageBitmap(f).then(function(bmp){ return det.detect(bmp); })
      .then(function(r){ if(r&&r.length) lookupBarcode(r[0].rawValue); else scanMsg('No barcode found in that photo. Fill the frame with the bars and try again.'); })
      .catch(function(){ scanMsg('Could not read that photo. Type the number instead.'); });
  });
  var noLive=function(why){
    SCAN&&(SCAN.video.parentNode.style.display='none');
    if(det){ shot.style.display=''; scanMsg(why+' Take a photo of the barcode, or type the number.'); }
    else scanMsg(why+' Type the number printed under the bars.');
  };
  if(!det){ noLive('This browser cannot read barcodes from the camera.'); return; }
  if(!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia)){ noLive('The camera is not available on this page.'); return; }
  navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false}).then(function(stream){
    if(!SCAN||SCAN.el!==el){ stream.getTracks().forEach(function(t){ t.stop(); }); return; }
    SCAN.stream=stream; SCAN.video.srcObject=stream;
    var p=SCAN.video.play(); if(p&&p.catch) p.catch(function(){});
    scanMsg('Hold the barcode on the line.');
    SCAN.timer=setInterval(function(){
      if(!SCAN||SCAN.busy||SCAN.video.readyState<2) return;
      det.detect(SCAN.video).then(function(r){ if(r&&r.length&&SCAN&&!SCAN.busy) lookupBarcode(r[0].rawValue); }).catch(function(){});
    },300);
  }).catch(function(){ if(SCAN&&SCAN.el===el) noLive('The camera was blocked or is in use.'); });
}

function photoErr(e){
  var c=(e&&e.code)||'', m=(e&&e.message)||'';
  if(!S.sample) return m==='unreadable'?'The AI answered but not in a form I could read. Try again, or add it manually.':aiErr(e);
  return c==='images_unavailable'?'This view cannot send photos to Claude. It works in a desktop browser, and in the standalone app with a Gemini key.'
    : c==='not_granted'?'Claude was not allowed on this page, so the photo could not be read.'
    : c==='image_rejected'?'That image could not be used. Try a JPEG or PNG under 20 MB.'
    : c==='rate_limited'?'Rate limited. Try again in a minute.'
    : c==='refused'?'Claude declined that photo.'
    : m==='unreadable'?'Claude answered but not in a form I could read. Try again, or add it manually.'
    : m==='no-image'?'No photo came through from the picker. Try choosing it again.'
    : 'Could not estimate that photo'+(c?' ('+c+')':'')+'. Try again, or add it manually.';
}
function analyzePhoto(files,hint,keep){
  if(!S.sample&&!aiKey()){ S.food.err='Photo estimates need an AI key. Add one in You, Settings.'; S.view='food'; render(); return; }
  S.food.analyzing=true; S.food.err='';
  if(!keep) S.food.pending=null;
  S.view='food'; render();

  var blobs=[], thumbs=[], prep=Promise.resolve();
  if(files&&files.length){
    Array.prototype.slice.call(files,0,3).forEach(function(f){
      prep=prep
        .then(function(){ return shrink(f,160,0.6,true).catch(function(){ return ''; }); })   /* a thumbnail is optional */
        .then(function(t){ if(t) thumbs.push(t);
          /* Claude resizes on its side, so send the original; Gemini gets a smaller copy when we can make one */
          return S.sample?f:shrink(f,1200,0.85,false).catch(function(){ return f; }); })
        .then(function(b){ blobs.push(b); });
    });
  } else if(keep&&S.food.pending){
    blobs=S.food.pending.blobs||[]; thumbs=S.food.pending.thumbs||[];
  }

  prep.then(function(){
    if(!blobs.length) throw new Error('no-image');
    if(!S.sample) return geminiCall(foodPrompt(hint),{images:blobs,json:true});
    return Promise.resolve(S.sample.limits?S.sample.limits():null).catch(function(){ return null; }).then(function(l){
      if(l&&!l.images){ var e=new Error('images'); e.code='images_unavailable'; throw e; }
      return S.sample(foodPrompt(hint),{images:blobs});
    });
  })
  .then(function(res){
    var d=looseJSON(res&&res.text);
    if(!d) throw new Error('unreadable');
    var items=prepItems(d.items);
    var pd={
      name:String(d.name||'Meal'),
      items:items, blobs:blobs, thumbs:thumbs, thumb:thumbs[0]||'',
      low:Math.round(num(d.low_kcal)), high:Math.round(num(d.high_kcal)),
      confidence:String(d.confidence||''), assumptions:String(d.assumptions||''),
      toImprove:String(d.to_improve||''), hint:hint||'', source:'photo',
      kcal:0,protein:0,carbs:0,fat:0
    };
    if(items.length) recalc(pd);
    S.food.analyzing=false; S.food.pending=pd; render();
  })
  .catch(function(e){
    S.food.analyzing=false; S.food.err=photoErr(e); render();
  });
}

var EXMAP=[

 [/row/i,{lats:.9,traps:.8,biceps:.5,rear:.5,lower:.3}],

function musclesFor(name){
  var n=String(name||'');
  for(var i=0;i<EXMAP.length;i++) if(EXMAP[i][0].test(n)) return EXMAP[i][1];
  return null;
}
/* score = sets completed, doubled when every set reached the top of its rep range */
/* ================= PRs ================= */
function priorSessions(ses){
  var cut=ses.finishedAt||Infinity;
  return finished().filter(function(s){ return s.id!==ses.id&&(s.finishedAt||0)<cut; });
}
/* cardio blocks: what was actually done, falling back to what the block said */
function segNums(e,s){
  var a=s.act||{}, txt=(s.label||'')+' '+(s.detail||'');
  var kmh=num(a.kmh)||num(String((String(s.detail||'').match(/(\d+(?:[.,]\d+)?)\s*km/i)||[])[1]||'').replace(',','.'));
  var min=num(a.min);
  if(!min){
    var t=String(s.label||'').match(/(\d+):(\d{2})\s*[–—-]+\s*(\d+):(\d{2})/);
    if(t) min=((+t[3])*60+(+t[4])-((+t[1])*60+(+t[2])))/60;
    else { var mm=txt.match(/(\d+(?:[.,]\d+)?)\s*min/i); if(mm) min=num(mm[1].replace(',','.')); }
  }
  var incl=num(a.incl);
  if(!incl){ var im=(txt+' '+(e.spec||'')).match(/(\d+(?:[.,]\d+)?)\s*(?:°|deg|degree|%)/i); if(im) incl=num(im[1].replace(',','.')); }
  return {kmh:kmh,min:Math.round(min*10)/10,incl:incl};
}
function bestStrength(e){
  var kg=0, e1=0, bestSet=null;
  (e.sets||[]).forEach(function(x){ if(!x.done||x.warm) return;
    var k=num(x.kg)+exBase(e); if(k>kg) kg=k;
    var v=e1rm(e,x); if(v>e1){ e1=v; bestSet=x; } });
  return {kg:kg,e1:e1,set:bestSet};
}
/* one PR note per exercise, or nothing. First time doing an exercise is not a PR: there is nothing to beat */
function sessionPRs(ses){
  var out={}, prior=priorSessions(ses);
  (ses.ex||[]).forEach(function(e){
    var key=exKey(e.name);
    if(e.kind==='protocol'){
      var past=[];
      prior.forEach(function(p){ (p.ex||[]).forEach(function(pe){
        if(pe.kind!=='protocol'||exKey(pe.name)!==key) return;
        (pe.segs||[]).forEach(function(s){ if(s.done){ var n=segNums(pe,s); if(n.kmh&&n.min) past.push(n); } }); }); });
      if(!past.length) return;
      var best=null;
      (e.segs||[]).forEach(function(s){
        if(!s.done) return; var n=segNums(e,s); if(!n.kmh||!n.min) return;
        var beaten=past.some(function(p){ return p.incl>=n.incl&&p.kmh>=n.kmh&&p.min>=n.min; });
        if(!beaten&&(!best||n.kmh*n.min>best.kmh*best.min)) best=n;
      });
      if(best){
        var same=past.filter(function(p){ return p.incl>=best.incl&&p.kmh>=best.kmh; }).sort(function(a,b){ return b.min-a.min; })[0];
        out[e.id]={text:fmt(best.kmh)+' km/h for '+fmt(best.min)+' min'+(best.incl?' at '+fmt(best.incl)+'°':''),
          was:same?'longest at that pace before: '+fmt(same.min)+' min':'fastest ever at that incline'};
      }
      return;
    }
    if(isTimed(e)){
      var bestT=0,bestKg=0; (e.sets||[]).forEach(function(x){ if(x.done&&num(x.reps)>bestT){ bestT=num(x.reps); bestKg=num(x.kg); } });
      if(!bestT) return;
      var pT=0, anyT=false;
      prior.forEach(function(p){ (p.ex||[]).forEach(function(pe){ if(exKey(pe.name)!==key) return;
        (pe.sets||[]).forEach(function(x){ if(x.done&&num(x.kg)>=bestKg){ anyT=true; if(num(x.reps)>pT) pT=num(x.reps); } }); }); });
      if(anyT&&bestT>pT) out[e.id]={text:'longest ever: '+fmt(bestT)+' s'+(bestKg?' with '+fmt(bestKg)+' kg':''),was:'was '+fmt(pT)+' s'};
      return;
    }
    var cur=bestStrength(e); if(!cur.kg) return;
    var pk=0, pe1=0, any=false;
    prior.forEach(function(p){ (p.ex||[]).forEach(function(pe){
      if(pe.kind==='protocol'||exKey(pe.name)!==key) return;
      var b=bestStrength(pe); if(b.kg){ any=true; if(b.kg>pk) pk=b.kg; if(b.e1>pe1) pe1=b.e1; } }); });
    if(!any) return;
    if(cur.kg>pk+0.001){
      var top=0; (e.sets||[]).forEach(function(x){ if(x.done&&num(x.kg)+exBase(e)===cur.kg&&num(x.reps)>top) top=num(x.reps); });
      out[e.id]={text:'heaviest ever: '+fmt(cur.kg)+' kg × '+top,was:'was '+fmt(pk)+' kg'};
    } else if(cur.e1>pe1*1.005&&cur.set){
      out[e.id]={text:'best set ever: '+fmt(num(cur.set.kg))+' kg × '+fmt(num(cur.set.reps)),
        was:'estimated max '+fmt(Math.round(cur.e1*10)/10)+' kg, was '+fmt(Math.round(pe1*10)/10)};
    }
  });
  return out;
}

/* ================= EFFORT: how hard each muscle worked ================= */
/* Per set, 0–4. Reps-in-reserve beats everything. Without it, read the evidence:
   falling below the rep range, reps dropping at the same weight, cutting the weight, or a PR. */
function exEffort(e,pr){
  var done=(e.sets||[]).filter(function(x){ return x.done&&!x.warm; });
  if(!done.length) return null;
  var rng=String((e.target&&e.target.reps)||'').match(/\d+/g)||[], bot=rng.length?+rng[0]:0, top=rng.length?+rng[rng.length-1]:0;
  var best={v:0,why:'',rir:false};
  var bump=function(v,why,rir){ if(v>best.v||(v===best.v&&rir&&!best.rir)) best={v:v,why:why,rir:!!rir}; };
  done.forEach(function(x,i){
    var kg=num(x.kg), r=num(x.reps), rir=String(x.rir==null?'':x.rir).trim();
    if(rir!==''){ var q=num(rir);
      bump(q<=0?4:q<=1?3.5:q<=2?3:q<=4?2:1,'you logged '+fmt(q)+' rep'+(q===1?'':'s')+' left',true); return; }
    var v=2, why='reps held steady, so probably a few left in the tank';
    if(top&&r>=top+3){ v=1.5; why='well above the '+bot+'-'+top+' range, so the weight was light'; }
    var firstSame=0; for(var j=0;j<i;j++){ if(done[j].done&&num(done[j].kg)===kg&&num(done[j].reps)>firstSame) firstSame=num(done[j].reps); }
    if(firstSame&&firstSame-r>=3){ v=3.5; why='reps fell '+fmt(firstSame)+' → '+fmt(r)+' at '+fmt(kg)+' kg'; }
    else if(firstSame&&firstSame-r>=1){ v=3; why='reps fell '+fmt(firstSame)+' → '+fmt(r)+' at '+fmt(kg)+' kg'; }
    var nx=done[i+1];
    if(nx&&num(nx.kg)<kg&&(!top||r<=top)&&v<3.5){ v=3.5; why='you cut the weight after '+fmt(kg)+' × '+fmt(r); }
    if(bot&&r<bot){ v=4; why=fmt(kg)+' × '+fmt(r)+' fell short of the '+bot+'-'+top+' range'; }
    bump(v,why,false);
  });
  if(pr&&best.v<3&&!best.rir) best={v:3,why:'a new PR ('+pr.text.replace(/^[a-z ]+: /,'')+')',rir:false};
  return best;
}
function muscleScores(ses){
  var out={}, prs=sessionPRs(ses);
  (ses.ex||[]).forEach(function(e){
    if(e.kind==='protocol') return;
    var w=musclesFor(e.name); if(!w) return;
    var ef=exEffort(e,prs[e.id]); if(!ef) return;
    var n=(e.sets||[]).filter(function(x){ return x.done; }).length;
    Object.keys(w).forEach(function(m){
      if(w[m]<0.5) return;                                   /* a light assist is not training that muscle */
      var direct=w[m]>=0.85, v=direct?ef.v:Math.max(1,ef.v-1);
      var o=out[m]||(out[m]={v:0,why:'',from:'',sets:0,helper:0,rir:false});
      if(direct) o.sets+=n; else o.helper+=n;
      if(v>o.v){ o.v=v; o.why=ef.why; o.from=e.name+(direct?'':' (helping)'); o.rir=ef.rir; }
    });
  });
  return out;
}

function weekStart(d){

function localReview(ses){

  strength.forEach(function(e){ (e.sets||[]).forEach(function(x){

    +': **'+c.done+' of '+c.total+'** items, **'+hard+' hard sets**'
    +(pct<80?'. Skipped work is listed below so it does not quietly vanish.':'.'));

  var up=[],flat=[],down=[],skipped=[];
  strength.forEach(function(e){
    var done=(e.sets||[]).filter(function(x){ return x.done; });
    if(!done.length){ skipped.push(e.name); return; }
    var rows=progData(e.name), n=rows.length;
    var line='**'+e.name+'** '+done.map(function(x){ return fmt(num(x.kg))+'×'+fmt(num(x.reps)); }).join(', ');
    if(n>=2&&rows[n-1].e1rm&&rows[n-2].e1rm){
      var d=(rows[n-1].e1rm-rows[n-2].e1rm)/rows[n-2].e1rm*100;
      line+=' — estimated 1RM '+(d>=0?'+':'')+fmt(Math.round(d*10)/10)+'% on last time';
      (d>0.5?up:d<-0.5?down:flat).push(line);
    } else flat.push(line+' — first comparison point');
  });
  L.push('## What stood out');
  up.concat(flat,down).slice(0,6).forEach(function(x){ L.push('- '+x); });
  var bsr=bodyState();
  if(bsr.ready&&bsr.phase==='cutting'&&down.length) L.push('- You are losing about '+fmt(Math.abs(bsr.rate))+' kg a week, which explains some of the dips. Holding your weights during a cut is a win.');
  else if(bsr.ready&&bsr.phase==='cutting'&&up.length) L.push('- Getting stronger while losing about '+fmt(Math.abs(bsr.rate))+' kg a week is a great sign.');
  else if(bsr.ready&&bsr.phase==='gaining'&&flat.length&&!up.length) L.push('- You are gaining weight, so these lifts should be climbing. Push the weights next time.');
  if(skipped.length) L.push('- Not done: '+skipped.join(', '));

  var timed=(ses.ex||[]).map(function(e){ return {n:e.name,m:exMins(e)}; }).filter(function(x){ return x.m!=null; });
  if(timed.length){
    var tot=timed.reduce(function(a,x){ return a+x.m; },0);
    timed.sort(function(a,b){ return b.m-a.m; });
    L.push('## Pacing');
    L.push('- '+tot+' minutes on timed exercises. Longest: **'+timed[0].n+'** at '+timed[0].m+' min'
      +(timed.length>1?'; shortest: '+timed[timed.length-1].n+' at '+timed[timed.length-1].m+' min.':'.'));
    var slow=[];
    (ses.ex||[]).forEach(function(e,i){
      var nx=(ses.ex||[])[i+1];
      if(nx&&hm(e.t1)!=null&&hm(nx.t0)!=null){ var g=hm(nx.t0)-hm(e.t1); if(g<0) g+=1440; if(g>=6&&g<120) slow.push(g+' min before '+nx.name); }
    });
    if(slow.length) L.push('- Slow changeovers: '+slow.join(', ')+'.');
  }

  L.push('## Next time');
  var nextN=0;
  strength.forEach(function(e){
    if(nextN>=5||!(e.sets||[]).some(function(x){ return x.done; })) return;
    var t=e.target||{}, sg=suggest(e.name,t.kg,t.reps,t.sets,stepFor(e));

    nextN++;
  });
  if(!nextN) L.push('- Repeat this session and beat one number in it.');

  var d=[],i,j; for(i=0;i<=a.length;i++){ d[i]=[i]; } for(j=0;j<=b.length;j++) d[0][j]=j;

    d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
    if(i>1&&j>1&&a[i-1]===b[j-2]&&a[i-2]===b[j-1]) d[i][j]=Math.min(d[i][j],d[i-2][j-2]+1);   /* swapped letters */
  }
  return d[a.length][b.length];
}

    if(w.length<4||voc.indexOf(w)>=0) return w;

    return bd<=(w.length<=5?1:2)?best:w;

function setLogReply(r){

    var t='**'+d.name+'**: '+d.sets.length+' set'+(d.sets.length===1?'':'s')+', '+setsLine(d.sets)+'.';

    if(wv>=25&&wv<=350){ var wd=ymd(); put('weights',{id:'w-'+wd,date:wd,kg:wv},true); saveProfile({weightKg:wv});
      var b0=bodyState();
      return 'Saved **'+fmt(wv)+' kg** for today. Trend: **'+fmt(b0.kg)+' kg**'+(b0.ready?', '+(b0.rate>0?'+':'')+fmt(b0.rate)+' kg a week':'')+'.\n\n'+b0.note; } }
  if(/\b(my|body) ?weight\b|weight trend|am i (losing|gaining)|cutting|bulking/.test(lt)&&/\?|how|trend|what|am i|doing/.test(lt)&&!/\b(bump|increase|lower|reduce)\b/.test(lt)){
    var b1=bodyState();
    if(!b1.kg) return 'No weigh-ins yet. Tell me "I weigh 72.5" or log it on the Food tab, and I will start adapting to it.';
    return 'Your trend weight is **'+fmt(b1.kg)+' kg**'+(b1.ready?', '+(b1.rate>0?'+':'')+fmt(b1.rate)+' kg a week ('+(b1.pct>0?'+':'')+fmt(b1.pct)+'%)':'')+'.\n\n'+b1.note
      +(b1.ready&&b1.phase==='cutting'?'\n\nWhile you lose, I hold a weight for one more session before adding to it, and I count a held lift as a win.':'');
  }
  var isCmd=/\b(swap|replace|switch|instead of|remove|drop|move|reschedule|between)\b|\badd\b.*\b(to|on)\s+(today|tomorrow|mon|tue|wed|thu|fri|sat|sun)|\b(add|put|insert)\b.*\b(after|before)\b|^\s*(after|before)\b/.test(lt);
  var setMsg=isCmd?null:parseSetMessage(text);
  if(setMsg&&setMsg.some(function(e){ return isMuscleWord(e.name); })) return ABS_MSG+' Which one did you do? For example "abdominal crunches 25x12 25x10".';
  if(setMsg&&setMsg.date&&setMsg.date<ymd()){
    var rp=logSetsOn(setMsg.date,setMsg);
    UNDO={label:'log',items:[rp.before?{coll:'sessions',id:rp.sid,before:rp.before}:{coll:'sessions',id:rp.sid,before:null}]};
    return setLogReply(rp);
  }
  if(setMsg){ var snap=active()||finished().filter(function(x){ return ymd(new Date(x.finishedAt))===ymd(); })[0];
    var before=snap?JSON.parse(JSON.stringify(snap)):null, r0=logSetsToday(setMsg);
    var cur=active()||finished().filter(function(x){ return ymd(new Date(x.finishedAt))===ymd(); })[0];
    UNDO={label:'log',items:[before?{coll:'sessions',id:before.id,before:before}:{coll:'sessions',id:cur.id,before:null}]};
    return setLogReply(r0); }
  var exr=exerciseCommand(text); if(exr) return exr;
  var q=' '+String(text||'').toLowerCase()+' ', today=ymd();
  var has=function(){ for(var i=0;i<arguments.length;i++) if(q.indexOf(arguments[i])>=0) return true; return false; };
  var days=[]; q.replace(/\b(today|tomorrow|mon|tue|wed|thu|fri|sat|sun)[a-z]*/g,function(m,k){ days.push(k); return m; });
  var toDate=function(k){
    if(k==='today') return today;
    if(k==='tomorrow') return shiftYmd(today,1);
    var w=['sun','mon','tue','wed','thu','fri','sat'].indexOf(k);
    for(var i=0;i<7;i++){ var ds=shiftYmd(today,i); if(fromYmd(ds).getDay()===w) return ds; }
    return today;
  };

  /* gym hours */
  if(has('open','close','closing','closes','hours')&&!has('workout','session')){
    var st=gymStatus(), L=[gym().name+' is '+st.text+'.',''];
    [1,2,3,4,5,6,0].forEach(function(w){ var h=gymDay(w); L.push('- '+DOWFULL[w]+': '+(h?h[0]+' to '+h[1]:'closed')); });
    return L.join('\n');
  }

  /* move a workout */
  if(has('move','swap','shift','reschedule')&&days.length>=2){
    var from=toDate(days[0]), to=toDate(days[1]), p=plannedFor(from);
    if(!p||!(p.exercises||[]).length) return 'There is nothing planned on '+niceDate(from)+' to move.';
    if(busy(to)) return niceDate(to)+' already has a workout. Clear it first, or pick another day.';
    if(!gymDay(fromYmd(to).getDay())) return gym().name+' is closed on '+niceDate(to)+'.';
    put('days',{id:uid(),name:p.name,date:to,note:p.note||'',exercises:cloneEx(p.exercises),source:'coach'},true);
    if(p._virtual) put('days',{id:uid(),name:'Rest day',date:from,note:'Moved to '+niceDate(to)+'.',exercises:[],source:'coach'},true);
    else drop('days',p.id);
    sysMsg('Moved '+p.name+' to '+niceDate(to));
    return '**'+p.name+'** is now on '+niceDate(to)+' (gym open '+gymLine(to)+'), and '+niceDate(from)+' is free.';
  }

  /* an extra session this week */
  if(has('extra','one more','another','additional')&&has('session','workout','time','train','day')){
    var free=freeDays();
    if(!free.length) return 'There is no free day left this week when the gym is open. Tell me a day to move something instead.';
    var pick=free.filter(function(ds){ return !busy(shiftYmd(ds,-1))&&!busy(shiftYmd(ds,1)); })[0]||free[0];
    var pool=workoutPool();
    if(!pool.length) return 'There are no workouts to copy yet. Build one in Plan first.';
    pool.sort(function(a,b){ return lastTouched(a.name)-lastTouched(b.name); });
    var w=pool[0];
    put('days',{id:uid(),name:w.name,date:pick,note:w.note||'',exercises:cloneEx(w.exercises),source:'coach'},true);
    sysMsg('Added '+niceDate(pick)+' — '+w.name);
    return 'Added **'+w.name+'** on '+niceDate(pick)+'. I picked it because it is the workout you have gone longest without, '
      + 'and that day '+(busy(shiftYmd(pick,-1))||busy(shiftYmd(pick,1))?'was the only gap left':'has a rest day either side')
      + '. The gym is open '+gymLine(pick)+'.';
  }

  /* bump weights that were earned */
  if(has('bump','increase','raise','heavier','update')&&has('weight','kg','load')){
    var changed={};
    var walk=function(coll,doc){
      var touched=false, copy=JSON.parse(JSON.stringify(doc));
      (copy.exercises||[]).forEach(function(e){
        if(e.kind==='protocol') return;
        var sg=suggest(e.name,e.kg,e.reps,e.sets,stepFor(e));
        if(sg.why&&sg.kg>num(e.kg)+0.001){ changed[e.name]=fmt(num(e.kg))+' → '+fmt(sg.kg)+' kg'; e.kg=fmt(sg.kg); touched=true; }
      });
      if(touched) put(coll,copy,true);
    };
    S.routines.slice().forEach(function(r){ walk('routines',r); });
    S.days.slice().forEach(function(d){ if(d.date>=today) walk('days',d); });
    var names=Object.keys(changed);
    if(!names.length) return 'Nothing has earned a bump yet. A weight goes up once every set reaches the top of its rep range.';
    sysMsg('Raised '+names.length+' weight'+(names.length===1?'':'s'));
    return 'Raised these in your plan, because you hit the top of the range on every set last time:\n\n'
      + names.map(function(n){ return '- **'+n+'**: '+changed[n]; }).join('\n');
  }

  /* what to train */
  if(has('ideal','recommend','what should i train','which workout','what would be','best workout','what do you think')){
    var wk=weeklySets(0).total, lo=num(S.profile.setsLo)||10, pool2=workoutPool();
    if(!pool2.length) return 'There are no workouts in your plan yet to choose between.';
    var score=function(w){ var sc=0; (w.exercises||[]).forEach(function(e){
      var m=musclesFor(e.name); if(m) Object.keys(m).forEach(function(k){ sc+=Math.max(0,lo-(wk[k]||0))*m[k]; }); }); return sc; };
    pool2.sort(function(a,b){ return score(b)-score(a); });
    var best=pool2[0], low=trackedMuscles().filter(function(m){ return (wk[m]||0)<lo; })
      .sort(function(a,b){ return (wk[a]||0)-(wk[b]||0); }).slice(0,4);
    var when=days.length?toDate(days[0]):null;
    return 'I would do **'+best.name+'**'+(when?' on '+niceDate(when)+' (gym open '+gymLine(when)+')':'')+'.'
      + (low.length?' It covers what is furthest under your weekly target: '
          + low.map(function(m){ return (MNAME[m]||m)+' at '+fmt(Math.round((wk[m]||0)*10)/10)+' sets'; }).join(', ')+'.':'')
      + '\n\nSay "add an extra session" and I will put it on the calendar.';
  }

  /* progress */
  if(has('progress','stall','plateau','how am i','stronger','improv')){
    var names2=exerciseNames(); if(!names2.length) return 'Nothing is logged yet, so there is no trend to read.';
    var L2=['Estimated 1RM, first logged to latest:',''];
    names2.slice(0,8).forEach(function(n){
      var d=progData(n).filter(function(p){ return p.e1rm>0; });
      if(!d.length) return;
      var st2=stallInfo(progData(n));
      L2.push('- **'+n+'**: '+fmt(d[0].e1rm)+' → '+fmt(d[d.length-1].e1rm)+' kg'+(st2&&st2.stalled?' — stalled':''));
    });
    return L2.join('\n');
  }

  /* the week / today */
  if(has('week','schedule','coming up','plan')){
    var L3=['Next seven days:',''];
    for(var i=0;i<7;i++){ var ds=shiftYmd(today,i), p3=plannedFor(ds);
      L3.push('- '+niceDate(ds)+': '+(sessionOn(ds)?'done':skipOn(ds)?'missed ('+skipOn(ds).reason+')'
        :(p3&&(p3.exercises||[]).length)?'**'+p3.name+'**':'rest')+' · gym '+gymLine(ds)); }
    return L3.join('\n');
  }
  if(has('today','tonight','now')){
    var p4=plannedFor(today);
    return (sessionOn(today)?'You already trained today.':(p4&&(p4.exercises||[]).length)
      ?'**'+p4.name+'** is on today, '+(p4.exercises||[]).length+' items.':'Nothing is planned today.')
      + ' '+gym().name+' is '+gymStatus().text+'.';
  }

  return 'I am the built-in coach, so I understand a fixed set of requests:\n\n'
    + '- "swap leg press for hack squat" (add "today" for just today)\n- "do abdominal crunches instead of torso rotation"\n'
    + '- "add plank 3x60 to Thursday", "between calf raises and treadmill add shoulder press", "remove lateral raise", "undo"\n- "what is the abdominal machine"\n'
    + '- log today\'s sets: "abdominal crunches 25x12 25x10 25x8" (kg × reps, one per line is fine)\n'
    + '- "add an extra session this week"\n- "move Thursday to Friday"\n- "bump my weights"\n'
    + '- "what should I train on Sunday"\n- "how is my progress"\n- "what is on this week"\n- "when does the gym close"\n\n'
    + 'For free-form questions, add a free Gemini key in You, Settings and I can answer anything about your training.';
}

/* ---------- Gemini as the coach: it asks for changes in text, the app carries them out ---------- */
var ACTION_PROTOCOL=[
 'You cannot call tools directly in this setup. To change anything, end your reply with one line that begins with',
 'ACTIONS: followed by a JSON array on that same line. Each item is {"tool":"name","args":{...}}.',
 'Tools and args:',
 '- schedule_workout {date:"YYYY-MM-DD", name, note?, plan}',
 '- remove_workout {date:"YYYY-MM-DD"}  (makes it a rest day)',
 '- clear_workout {date?, name?}  (keeps the workout but with no exercises, to fill in as you go; pass name to rename it too. "make today empty" is this. schedule_workout always needs at least one exercise line)',
 '- set_routine {weekday:"tuesday", name, effective_from?, note?, plan}',
 '- log_workout {date:"YYYY-MM-DD", name, minutes?, notes?, results}',
 '- change_exercise {action:"replace"|"remove"|"add", exercise?, new_exercise?, when:"all"|"date", date?, weekday?, after?, before?, sets?, reps?, kg?, cue?}  (for "between A and B add C" use after:A)',
 '- log_sets {exercise, sets:"25x12, 25x10"}  (today only; pairs are kg x reps)',
 '- reorder_exercises {a, b, mode?:"swap"|"before"|"after", date?, every_week?}  (changes the ORDER only; a and b are 1-based positions or names. "switch exercise 3 and 5" is this, never change_exercise)',
 '- log_body_weight {kg, date?}',
 '- make_deload {undo?}',
 '- log_water {ml}',
 '- log_measurements {waist?, chest?, arm?, thigh?, hips?, neck?, bf?}  (cm, bf in %)',
 '- set_mode {mode: normal|failure|recovery|strength|pump|quick}',
 '- undo_last_change {}',
 'Inside plan and results, separate lines with \\n.',
 'plan format: '+PLAN_FORMAT,
 'results format: '+RESULT_FORMAT,
 'Never claim a change in your reply unless it is in the ACTIONS line. Leave ACTIONS out when nothing changes.'
].join('\n');
var RUNFAIL=0;
function runActions(raw){
  RUNFAIL=0;
  var a=raw.indexOf('['), b=raw.lastIndexOf(']'); if(a<0||b<a) return 0;
  var list; try{ list=JSON.parse(raw.slice(a,b+1)); }catch(e){ return 0; }
  var tools={}, n=0; coachTools().forEach(function(t){ tools[t.name]=t; });
  (Array.isArray(list)?list:[]).forEach(function(it){
    var t=tools[it&&it.tool];
    if(!t){ sysMsg('Unknown action skipped: '+String(it&&it.tool)); return; }
    try{ t.execute(it.args||{}); n++; }catch(e){ RUNFAIL++; sysMsg('Could not '+it.tool+': '+String(e.message||e).slice(0,80)); }
  });
  return n;
}
function coachGemini(text){
  var msgs=[{role:'user',content:coachPreamble()+'\n\n'+ACTION_PROTOCOL+'\n\nReply to this setup message with exactly: Ready.'},
            {role:'assistant',content:'Ready.'}];
  S.chat.filter(function(m){ return m.role==='user'||m.role==='assistant'; }).slice(-14).forEach(function(m){
    msgs.push({role:m.role,content:m.text}); });
  if(msgs[msgs.length-1].role!=='user') msgs.push({role:'user',content:text});
  var settle=function(t){ S.busy=false; S.stream='';
    put('chat',{id:uid(),role:'assistant',text:t||'(no reply)',at:Date.now()},true); setTimeout(scrollEnd,30); };
  geminiCall(msgs).then(function(res){
    var t=String(res.text||''), i=t.lastIndexOf('ACTIONS:');
    if(i>=0){ var done=runActions(t.slice(i+8)); t=t.slice(0,i).trim();
      if(RUNFAIL&&!done) t='That did not go through, so nothing changed. The note above says why; try saying it another way.';
      else if(RUNFAIL) t+='\n\n_Part of that did not go through, see the note above._'; }
    settle(t||'Done.');
  }).catch(function(e){
    var fb=''; try{ fb=ruleCoach(text); }catch(x){}
    settle((fb?fb+'\n\n':'')+'_Gemini did not answer, so this came from the built-in coach. '+aiErr(e)+'_');
  });
}

/* minutes spent on one exercise, from its start and end stamps */
