<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Workout Log</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Workout">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b0c10">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b0c10; --bg2:#11131a; --card:#171a22; --card2:#1e2230; --line:#272c3a;
    --txt:#eef0f5; --mut:#8a90a0; --mut2:#616878;
    --acc:#ff4a4a; --acc-d:#1c0303; --red:#ff6b6b; --blu:#7cc4ff; --r:15px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{background:var(--bg);color:var(--txt);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    font-size:15px;line-height:1.45;padding-bottom:calc(78px + env(safe-area-inset-bottom));
    -webkit-font-smoothing:antialiased}
  #app{max-width:640px;margin:0 auto;padding:0 14px}

  header{padding:calc(18px + env(safe-area-inset-top)) 0 13px;display:flex;align-items:baseline;gap:10px}
  header h1{font-size:21px;font-weight:800;letter-spacing:-.02em;margin:0}
  header .sub{font-size:12px;color:var(--mut2);font-weight:600}

  .banner{background:#2a2412;border:1px solid #4a3f15;color:#e8d98a;border-radius:12px;padding:9px 12px;font-size:12.5px;margin-bottom:14px}

  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin-bottom:12px;overflow:hidden}
  .card.hl{border-color:color-mix(in srgb,var(--acc) 38%,#272c3a);background:linear-gradient(180deg,color-mix(in srgb,var(--acc) 9%,#171a22),#171a22 60%)}
  .card-h{display:flex;align-items:center;gap:10px;padding:15px 15px}
  .card-b{padding:0 15px 16px}
  .sec-t{font-size:13px;font-weight:700;color:var(--mut);margin:22px 0 10px 2px}
  .chip{font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:999px;background:var(--card2);color:var(--mut);white-space:nowrap}
  .chip.a{background:var(--acc);color:var(--acc-d)}
  .chip.b{background:#17293a;color:var(--blu)}

  button{font-family:inherit;font-size:14px;border:0;background:none;color:inherit;cursor:pointer;padding:0}
  .btn{display:flex;align-items:center;justify-content:center;gap:7px;padding:12px 15px;border-radius:11px;
    font-weight:600;font-size:14px;background:var(--card2);color:var(--txt);border:1px solid var(--line);width:100%}
  .btn:active{transform:scale(.985)}
  label.btn{cursor:pointer;box-sizing:border-box}
  body.gated nav{display:none}
  .tri3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
  .tri3 .btn{padding-left:6px;padding-right:6px;font-size:13.5px;text-align:center}
  .fsres{margin-top:8px}
  .fs-hint{font-size:12px;color:var(--mut2);line-height:1.5;padding:4px 2px}
  .fs-row{display:flex;width:100%;align-items:center;gap:10px;text-align:left;background:transparent;border:0;border-top:1px solid var(--line,#23262e);color:inherit;padding:10px 2px;font:inherit;cursor:pointer}
  .fs-row span{flex:1;min-width:0}
  .fs-row b{display:block;font-size:13.5px;line-height:1.3}
  .fs-row small{display:block;font-size:11.5px;color:var(--mut2);margin-top:2px;line-height:1.35}
  .fs-row i{font-style:normal;font-weight:800;font-size:14px;color:var(--acc)}
  .fs-row:disabled{opacity:.6}
  .btn.p{background:var(--acc);color:var(--acc-d);border-color:var(--acc);font-weight:800}
  .btn.g{background:none;border:1px dashed var(--line);color:var(--mut)}
  .btn.d{color:var(--red);border-color:#43252b;background:#1f1418}
  .btn[disabled]{opacity:.45}
  .icn{width:30px;height:30px;flex:0 0 30px;border-radius:9px;display:flex;align-items:center;justify-content:center;
    color:var(--mut2);background:var(--card2);font-size:15px;line-height:1}
  .icn.d{color:var(--red)}
  .icn.warn{background:#3a1c22;color:#ff8f8f;width:auto;flex:0 0 auto;padding:0 10px;font-size:11px;font-weight:800}

  input,textarea{font-family:inherit;font-size:15px;color:var(--txt);background:var(--bg2);border:1px solid var(--line);
    border-radius:10px;padding:10px 11px;width:100%;outline:none;resize:none}
  input:focus,textarea:focus{border-color:var(--acc);background:#0e1014}
  input::placeholder,textarea::placeholder{color:var(--mut2)}
  textarea{line-height:1.5;min-height:84px}
  .fld{display:flex;flex-direction:column;gap:5px;min-width:0}
  .fld label{font-size:11.5px;font-weight:600;color:var(--mut2);padding-left:2px}
  .name-in{font-size:16px;font-weight:700;background:none;border:0;border-bottom:1px solid transparent;border-radius:0;padding:4px 0}
  input[type=date]{font-weight:600}

  .ex{border-top:1px solid var(--line);padding:12px 0 13px}
  .ex-top{display:flex;align-items:center;gap:8px}
  .trio{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:9px}
  .duo{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}

  /* calendar */
  .cal-h{display:flex;align-items:center;gap:10px;padding:4px 2px 12px}
  .cal-h b{flex:1;font-size:16px;font-weight:800;letter-spacing:-.01em}
  .cal-nav{width:34px;height:34px;border-radius:10px;background:var(--card2);border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;font-size:15px;color:var(--mut)}
  .dow{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:5px}
  .dow span{text-align:center;font-size:10px;font-weight:800;letter-spacing:.05em;color:var(--mut2)}
  .grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
  .cell{position:relative;aspect-ratio:1/1;border-radius:10px;background:var(--bg2);border:1px solid transparent;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:13.5px;font-weight:700;color:var(--txt)}
  .cell.out{color:#3b414f;background:transparent}
  .cell.main{background:color-mix(in srgb,var(--acc) 7%,#11131a)}
  .cell.has{background:var(--card2);border-color:color-mix(in srgb,var(--acc) 40%,#272c3a)}
  .cell.done{background:#13332a;border-color:#199e70;color:#7fe3bb}
  .cell.skip{background:#2a2113;border-color:#5a4624;color:#d9b98a}
  .dot.done{background:#38e2a8}
  .dot.miss{background:#d9a05a}
  .cell.today{border-color:var(--acc);color:var(--acc)}
  .cell.sel{background:var(--acc);color:var(--acc-d);border-color:var(--acc)}
  .cell.sel .dot{background:var(--acc-d)!important}
  .dot{width:4px;height:4px;border-radius:50%;background:var(--acc)}
  .dot.done{background:var(--blu)}
  .dot.ghost{background:#4a5330}
  .legend{display:flex;gap:14px;justify-content:center;padding:12px 0 2px;font-size:11px;color:var(--mut2);font-weight:600}
  .legend i{display:inline-block;width:5px;height:5px;border-radius:50%;margin-right:5px;vertical-align:1px}

  /* brief */
  .brief{border-top:1px solid var(--line);padding:14px 0 2px;display:flex;gap:11px}
  .brief:first-child{border-top:0}
  .bnum{width:24px;height:24px;flex:0 0 24px;border-radius:7px;background:var(--acc);color:var(--acc-d);
    font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;margin-top:1px}
  .bnum.b{background:#17293a;color:var(--blu)}
  .btxt{flex:1;min-width:0}
  .btxt .nm{font-size:15.5px;font-weight:700;line-height:1.3}
  .btxt .pr{font-size:13px;font-weight:700;color:var(--acc);margin-top:2px}
  .btxt .pr.b{color:var(--blu)}
  .btxt .fo{font-size:12.5px;color:var(--mut);margin-top:6px;line-height:1.55}
  .btxt .seg{font-size:12.5px;color:var(--mut);margin-top:4px;display:flex;gap:8px}
  .btxt .seg b{color:var(--txt);font-weight:700;flex:0 0 92px}

  /* session */
  .ses-ex{border-top:1px solid var(--line);padding:14px 0 6px}
  .ses-ex:first-child{border-top:0}
  .ses-ex-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
  .ses-ex-h .nm{font-size:15.5px;font-weight:700}
  .ses-ex-h .tg{font-size:11.5px;color:var(--mut2);font-weight:700;white-space:nowrap}
  .fo-box{font-size:12.5px;color:var(--mut);line-height:1.55;margin:7px 0 8px;padding-left:10px;border-left:2px solid var(--line)}
  .prog{font-size:11.5px;font-weight:700;color:var(--blu);margin:0 0 9px;padding-left:10px;border-left:2px solid #24384d}
  .srow{display:grid;grid-template-columns:18px 1fr 1fr .78fr 40px;gap:6px;align-items:center;margin-bottom:7px}
  .srow.seg{grid-template-columns:18px 1.05fr 1fr 40px}
  .snum{font-size:12px;font-weight:800;color:var(--mut2);text-align:center}
  .unit{position:relative}
  .unit span{position:absolute;right:9px;top:50%;transform:translateY(-50%);font-size:10.5px;font-weight:700;color:var(--mut2);pointer-events:none;text-transform:lowercase}
  .unit input{padding-right:30px;text-align:center;font-weight:700}
  .srow.seg input{font-size:13px;text-align:left;font-weight:600;padding:10px 9px}
  .chk{height:40px;border-radius:10px;border:1px solid var(--line);background:var(--bg2);display:flex;
    align-items:center;justify-content:center;font-size:15px;color:var(--mut2)}
  .chk.on{background:var(--acc);border-color:var(--acc);color:var(--acc-d);font-weight:800}
  .srow.done .unit input{border-color:#2d3a1d;background:#121607}
  .trow{display:grid;grid-template-columns:1fr 1fr auto;gap:7px;align-items:end;margin:2px 0 10px}
  .tcell{display:grid;grid-template-columns:1fr auto;gap:4px;align-items:center;min-width:0}
  .tcell label{grid-column:1/-1;font-size:11px;font-weight:600;color:var(--mut2);padding-left:2px}
  .tcell input{padding:8px 6px;font-size:13.5px;font-weight:600;min-width:0}
  .tcell button{font-size:11.5px;font-weight:700;color:var(--mut);padding:8px 9px;border:1px solid var(--line);border-radius:9px}
  .tdur{font-size:12px;font-weight:800;color:var(--acc);min-width:46px;text-align:right;padding-bottom:9px}
  .mini{display:flex;gap:8px;margin:3px 0 4px}
  .mini button{font-size:12px;font-weight:700;color:var(--mut);padding:5px 10px;border:1px solid var(--line);border-radius:8px}

  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 10px;text-align:center}
  .stat b{display:block;font-size:19px;font-weight:800;letter-spacing:-.02em}
  .stat small{font-size:11px;font-weight:600;color:var(--mut2)}

  .pick{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);
    border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:9px}
  .pick .t{flex:1;min-width:0}
  .pick .t b{display:block;font-size:16px;font-weight:700}
  .pick .t small{font-size:12px;color:var(--mut2);font-weight:600}
  .pick .go{color:var(--acc);font-size:18px;font-weight:700}

  .hrow{display:flex;align-items:center;gap:11px;padding:13px 14px;cursor:pointer}
  .hrow .t{flex:1;min-width:0}
  .hrow .t b{display:block;font-size:15px;font-weight:700}
  .hrow .t small{font-size:12px;color:var(--mut2);font-weight:600}
  .hline{display:flex;justify-content:space-between;gap:12px;font-size:13px;padding:6px 0;border-top:1px solid var(--line)}
  .hline span:last-child{color:var(--mut);font-variant-numeric:tabular-nums;text-align:right}

  .rv{font-size:14px;line-height:1.62}
  .rv h3{font-size:11px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--acc);margin:16px 0 6px}
  .rv h3:first-child{margin-top:0}
  .rv p{margin:0 0 9px}
  .rv ul{margin:0 0 10px;padding-left:18px}
  .rv li{margin-bottom:5px}
  .rv strong{color:#fff;font-weight:700}
  .quote{font-size:13px;color:var(--mut);font-style:italic;border-left:2px solid var(--line);padding-left:10px;margin:0 0 12px}
  .spin{display:inline-block;width:12px;height:12px;border:2px solid var(--line);border-top-color:var(--acc);border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px;margin-right:7px}
  @keyframes sp{to{transform:rotate(360deg)}}

  /* coach */
  .msgs{display:flex;flex-direction:column;gap:10px;margin-bottom:14px}
  .msg{max-width:88%;padding:11px 13px;border-radius:14px;font-size:14px;line-height:1.55}
  .msg.u{align-self:flex-end;background:var(--acc);color:var(--acc-d);font-weight:600;border-bottom-right-radius:5px}
  .msg.a{align-self:flex-start;background:var(--card);border:1px solid var(--line);border-bottom-left-radius:5px}
  .msg.a p{margin:0 0 8px}
  .msg.a p:last-child{margin:0}
  .msg.a ul{margin:4px 0 8px;padding-left:17px}
  .msg.a strong{color:#fff;font-weight:700}
  .msg.s{align-self:center;background:#15201a;border:1px solid #27402f;color:#9fdcb4;
    font-size:11.5px;font-weight:700;padding:6px 11px;border-radius:999px;max-width:94%;text-align:center}
  .ask{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:end;margin-bottom:10px}
  .ask textarea{min-height:46px;max-height:140px;font-size:14.5px;padding:12px}
  .send{width:46px;height:46px;flex:0 0 46px;border-radius:12px;background:var(--acc);color:var(--acc-d);
    font-size:17px;font-weight:800;display:flex;align-items:center;justify-content:center}
  .send[disabled]{opacity:.4}
  .sugg{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:6px}
  .sugg button{font-size:12px;font-weight:600;color:var(--mut);padding:7px 11px;border:1px solid var(--line);
    border-radius:999px;background:var(--card);text-align:left}

  .empty{text-align:center;padding:34px 18px;color:var(--mut2)}
  .empty p{margin:0 0 16px;font-size:14px;line-height:1.6}
  .empty .big{font-size:32px;margin-bottom:10px}

  /* rest timer */
  .rest{position:fixed;left:0;right:0;bottom:calc(72px + env(safe-area-inset-bottom));z-index:25;
    display:flex;justify-content:center;pointer-events:none;padding:0 14px}
  .rest-in{pointer-events:auto;display:flex;align-items:center;gap:9px;background:var(--card2);
    border:1px solid #3d4a1f;border-radius:999px;padding:7px 8px 7px 16px;box-shadow:0 10px 30px rgba(0,0,0,.6)}
  .rest-in b{font-size:17px;font-weight:800;font-variant-numeric:tabular-nums;min-width:48px;display:inline-block}
  .rest-in b.done{color:var(--acc)}
  .rest-in small{font-size:9.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--mut2)}
  .rest-in button{font-size:12px;font-weight:700;padding:8px 12px;border-radius:999px;background:var(--bg2);
    border:1px solid var(--line);color:var(--mut)}
  .rest-in button.p{background:var(--acc);color:var(--acc-d);border-color:var(--acc)}

  /* food */
  .kcal{display:flex;align-items:flex-end;gap:10px;margin-bottom:12px}
  .kcal .big{font-size:34px;font-weight:800;letter-spacing:-.03em;line-height:1}
  .kcal .of{font-size:13px;color:var(--mut2);font-weight:700;padding-bottom:4px}
  .kcal .rem{margin-left:auto;text-align:right;font-size:12px;font-weight:700;color:var(--mut)}
  .kcal .rem b{display:block;font-size:17px;color:var(--txt)}
  .kcal .rem b.over{color:#ffb020}
  .bar{height:9px;border-radius:99px;background:var(--bg2);overflow:hidden;margin-bottom:14px}
  .bar i{display:block;height:100%;border-radius:99px;background:var(--acc)}
  .bar i.over{background:#ffb020}
  .macros{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
  .macro small{font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--mut2)}
  .macro b{font-size:14px;font-weight:800;display:block;margin:1px 0 4px}
  .macro .t{height:5px;border-radius:99px;background:var(--bg2);overflow:hidden}
  .macro .t i{display:block;height:100%;border-radius:99px}
  .meal{display:flex;align-items:center;gap:11px;padding:11px 0;border-top:1px solid var(--line)}
  .meal:first-child{border-top:0}
  .meal img{width:42px;height:42px;border-radius:10px;object-fit:cover;flex:0 0 42px;background:var(--bg2)}
  .meal .ph{width:42px;height:42px;border-radius:10px;flex:0 0 42px;background:var(--bg2);
    display:flex;align-items:center;justify-content:center;color:var(--mut2);font-size:16px}
  .meal .t{flex:1;min-width:0}
  .meal .t b{display:block;font-size:14.5px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .meal .t small{font-size:11.5px;color:var(--mut2);font-weight:600}
  .meal .kc{font-size:15px;font-weight:800;white-space:nowrap}
  .daynav{display:flex;align-items:center;gap:10px;margin-bottom:13px}
  .daynav b{flex:1;text-align:center;font-size:14px;font-weight:800}
  .quad{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:9px}
  .thumbprev{width:100%;max-height:190px;object-fit:cover;border-radius:12px;margin-bottom:12px;display:block}
  .conf{font-size:12px;font-weight:700}
  .item{display:grid;grid-template-columns:1fr 74px 28px;gap:8px;align-items:center;
    padding:10px 0;border-top:1px solid var(--line)}
  .item .nm{min-width:0}
  .item .nm b{display:block;font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .item .nm small{font-size:11px;color:var(--mut2);font-weight:700}
  .item input{text-align:center;font-weight:700;font-size:13.5px;padding:9px 4px}
  .item .x{width:28px;height:28px;border-radius:8px;background:var(--card2);color:var(--red);
    display:flex;align-items:center;justify-content:center;font-size:13px}
  .tot{display:flex;align-items:baseline;gap:9px;padding:12px 0 2px;border-top:1px solid var(--line);margin-top:4px}
  .tot .n{font-size:27px;font-weight:800;letter-spacing:-.02em}
  .tot .m{font-size:12px;color:var(--mut);font-weight:700;margin-left:auto;text-align:right}
  .thumbs{display:flex;gap:7px;margin-bottom:12px}
  .thumbs img{flex:1;min-width:0;height:118px;object-fit:cover;border-radius:12px}

  .mleg{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;margin:10px 0 4px;
    font-size:10.5px;font-weight:700;color:var(--mut2)}
  .mleg i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px;vertical-align:0}
  .skipcard{background:#241a12;border:1px solid #4a3a1f;border-radius:var(--r);padding:13px 14px;margin-bottom:12px}
  .skipcard b{font-size:14.5px;font-weight:700;display:block}
  .skipcard small{font-size:12px;color:#d9b98a;font-weight:600}
  .cstrip{display:flex;gap:9px;overflow-x:auto;padding:2px 0 12px;-webkit-overflow-scrolling:touch}
  .cstrip button{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:5px;
    padding:8px 7px;border-radius:12px;border:1px solid transparent;background:var(--card);min-width:70px}
  .cstrip button.on{border-color:var(--acc);background:var(--card2)}
  .cstrip button.lk{opacity:.4}
  .cstrip span{font-size:10px;font-weight:700;color:var(--mut)}
  .cstrip button.on span{color:var(--txt)}
  .cstrip img{width:40px;height:40px;border-radius:50%;object-fit:cover;display:block}
  .swatch{display:flex;gap:9px;flex-wrap:wrap}
  .swatch button{width:40px;height:40px;border-radius:12px;border:2px solid transparent;position:relative}
  .swatch button.on{border-color:#fff}
  .swatch button.lk{opacity:.35}
  .swatch button i{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-style:normal;font-size:13px}

  .avwrap{position:relative;flex:0 0 64px;height:64px;line-height:0;cursor:pointer}

  /* segmented control + chips */

    border-radius:11px;padding:3px;margin-bottom:14px}

  nav{position:fixed;left:0;right:0;bottom:0;background:rgba(11,12,16,.93);backdrop-filter:blur(14px);

  nav button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0 7px;border-radius:12px;
    color:var(--mut2);font-size:9.5px;font-weight:600}
  nav button .d{font-size:18px;line-height:1}
  nav button.on{color:var(--acc);background:rgba(255,255,255,.045);font-weight:700}

    background:var(--card2);border:1px solid var(--line);color:var(--txt);padding:9px 15px;border-radius:999px;
    font-size:13px;font-weight:700;z-index:40;box-shadow:0 10px 30px rgba(0,0,0,.5);max-width:90vw;text-align:center}

</style>

<body>
<div id="app"></div>

<input type="file" id="photoin" accept="image/*" style="position:absolute;left:-9999px;width:1px;height:1px;opacity:0">

    <button data-act="tab" data-tab="today"><span class="d">▣</span>TODAY</button>

    <button data-act="tab" data-tab="you"><span class="d">◎</span>YOU</button>

<script>
/* =================================================================
   Workout Log — v3
   routines/<id>  { id, weekday:0-6, name, exercises:[...] }   standing week
   days/<id>      { id, name, date, exercises:[...], source }  dated one-off / override
   sessions/<id>  { id, dayId, dayName, startedAt, finishedAt, notes, review, ex:[...] }
   chat/<id>      { id, role:'user'|'assistant'|'sys', text, at }
   exercise: {id,kind:'strength',name,sets,reps,kg,note}
             {id,kind:'protocol',name,spec,note,segs:[{label,detail}]}
   ================================================================= */

var app=document.getElementById('app');
var STEP=2.5;               // default load increment
var DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

var S={
  view:'today', days:[], routines:[], sessions:[], chat:[],
  db:null, sample:null, local:false, ready:false,
  openDay:{}, openSes:{}, confirm:null,
  showReview:null, reviewing:false, reviewText:'', reviewNote:'',
  cal:null, sel:null,
  settings:{rest:90,step:2.5,gym:null}, rest:null, histTab:'log', progEx:'',
  preview:null, parked:false, avatarPick:false, skipFor:'', coachPick:false, charEdit:null,
  weekOff:0, importing:null,
  panels:{},
  meals:[], weights:[], profile:{}, skips:[], chars:[],
  notif:'', lastNudge:0,
  food:{date:'',pending:null,analyzing:false,openProfile:false},
  draft:'', busy:false, stream:''
};

/* ---------------- helpers ---------------- */
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function num(v){ var m=String(v==null?'':v).replace(',','.').match(/-?\d+(\.\d+)?/); return m?parseFloat(m[0]):0; }
function topRep(v){ var m=String(v==null?'':v).match(/\d+/g); return m?parseFloat(m[m.length-1]):0; }
function fmt(n){ return (Math.round(n*100)/100).toString(); }
function pad(n){ return n<10?'0'+n:''+n; }
function ymd(d){ d=d||new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function fromYmd(s){ var p=String(s||'').split('-'); return new Date(+p[0],(+p[1]||1)-1,+p[2]||1); }
function dayDiff(a,b){ return Math.round((new Date(a.getFullYear(),a.getMonth(),a.getDate())-new Date(b.getFullYear(),b.getMonth(),b.getDate()))/86400000); }

var toastT;
function toast(msg){
  var o=document.querySelector('.toast'); if(o) o.remove();
  var d=document.createElement('div'); d.className='toast'; d.textContent=msg;
  document.body.appendChild(d); clearTimeout(toastT);
  toastT=setTimeout(function(){ d.remove(); },2800);
}
function dateLabel(s){
  if(!s) return 'Any day';
  var a=fromYmd(s), diff=dayDiff(a,new Date());
  if(diff===0) return 'Today';
  if(diff===1) return 'Tomorrow';
  if(diff===-1) return 'Yesterday';
  var t=a.toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short'});
  if(diff>1&&diff<8) return t+' · in '+diff+' days';
  if(diff<-1&&diff>-8) return t+' · '+(-diff)+' days ago';
  return t;
}
function stampLabel(ts){
  var d=new Date(ts), diff=dayDiff(new Date(),d);
  if(diff===0) return 'Today';
  if(diff===1) return 'Yesterday';
  if(diff>1&&diff<7) return diff+' days ago';
  return d.toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short'});
}
function clock(ms){ var s=Math.max(0,Math.floor(ms/1000)),h=Math.floor(s/3600),m=Math.floor((s%3600)/60); return h?h+'h '+m+'m':m+'m'; }
/* what the implement actually weighs: logged number plus any machine or bar base */
function exBase(e){ return num(e&&e.base); }
function perSide(e){ return !!(e&&e.perSide); }
function setLoad(e,s){ return (num(s.kg)+exBase(e))*(perSide(e)?2:1); }
/* effective reps to failure: a set stopped 3 shy is a 3-rep-easier set */
function effReps(s){ return num(s.reps)+(String(s.rir||'').trim()===''?0:num(s.rir)); }
/* Epley, on the per-implement load. Unreliable past ~12 reps, so refuse rather than mislead. */
function e1rm(e,s){
  var w=num(s.kg)+exBase(e); if(!w) return 0;
  var r=effReps(s); if(r<1||r>12) return 0;
  return w*(1+r/30);
}
function volume(ses){
  var v=0;
  (ses.ex||[]).forEach(function(e){ (e.sets||[]).forEach(function(s){ if(s.done) v+=setLoad(e,s)*num(s.reps); }); });
  return v;
}
function counts(ses){ var d=0,t=0;(ses.ex||[]).forEach(function(e){
  (e.sets||[]).forEach(function(s){t++;if(s.done)d++;}); (e.segs||[]).forEach(function(s){t++;if(s.done)d++;}); }); return {done:d,total:t}; }
function target(e){
  if(e.kind==='protocol') return e.spec||'';
  var t=e.target||e;
  return (t.sets||'?')+' × '+(t.reps||'?')+'  ·  '+(num(t.kg)?fmt(num(t.kg))+' kg':'bodyweight');
}

/* ---------------- storage ---------------- */
function docRef(path){
  if(S.db.doc) return S.db.doc(path);
  var p=path.split('/');
  return S.db.collection(p.slice(0,-1).join('/')).doc(p[p.length-1]);
}
function normalize(snap){
  if(!snap) return [];
  var docs=snap.docs||(Array.isArray(snap)?snap:[]),out=[];
  for(var i=0;i<docs.length;i++){
    var d=docs[i], data=(d&&typeof d.data==='function')?d.data():(d&&d.data?d.data:d);
    if(!data) continue;
    out.push(Object.assign({},data,{id:(d&&d.id)||data.id||uid()}));
  }
  return out;
}
function LS(){ try{ return window.localStorage; }catch(e){ return null; } }
function loadLocal(){
  var ls=LS(); if(!ls) return;
  try{
    S.days=JSON.parse(ls.getItem('wl_days')||'[]')||[];
    S.routines=JSON.parse(ls.getItem('wl_rt')||'[]')||[];
    S.sessions=JSON.parse(ls.getItem('wl_ses')||'[]')||[];
    S.chat=JSON.parse(ls.getItem('wl_chat')||'[]')||[];
    S.meals=JSON.parse(ls.getItem('wl_meals')||'[]')||[];
    S.skips=JSON.parse(ls.getItem('wl_skips')||'[]')||[];
    S.chars=JSON.parse(ls.getItem('wl_chars')||'[]')||[];
    S.weights=JSON.parse(ls.getItem('wl_wt')||'[]')||[];
    S.profile=JSON.parse(ls.getItem('wl_prof')||'{}')||{};
    var st=JSON.parse(ls.getItem('wl_set')||'null'); if(st) S.settings=st;
  }catch(e){}
}
function saveLocal(){
  var ls=LS(); if(!ls) return;
  try{
    ls.setItem('wl_days',JSON.stringify(S.days)); ls.setItem('wl_rt',JSON.stringify(S.routines));
    ls.setItem('wl_ses',JSON.stringify(S.sessions)); ls.setItem('wl_chat',JSON.stringify(S.chat.slice(-60)));
    ls.setItem('wl_set',JSON.stringify(S.settings));
    ls.setItem('wl_meals',JSON.stringify(S.meals)); ls.setItem('wl_wt',JSON.stringify(S.weights));
    ls.setItem('wl_skips',JSON.stringify(S.skips)); ls.setItem('wl_chars',JSON.stringify(S.chars));
    ls.setItem('wl_prof',JSON.stringify(S.profile));
  }catch(e){}
  try{ if(!SY.applying) syncSoon(); }catch(e){}
}
function sortDays(a){ return a.slice().sort(function(x,y){ return (x.date||'9999')<(y.date||'9999')?-1:1; }); }

var writeQ={};
function store(coll){
  return coll==='days'?S.days : coll==='routines'?S.routines : coll==='chat'?S.chat
       : coll==='meals'?S.meals : coll==='weights'?S.weights
       : coll==='skips'?S.skips : coll==='chars'?S.chars : S.sessions;
}
function put(coll,obj,instant){
  var list=store(coll),i=-1;
  for(var k=0;k<list.length;k++){ if(list[k].id===obj.id){i=k;break;} }
  if(i>=0) list[i]=obj; else list.push(obj);
  if(coll==='days') S.days=sortDays(S.days);
  if(coll==='chat') S.chat=S.chat.slice().sort(function(a,b){return (a.at||0)-(b.at||0);});
  render();
  if(S.local){ saveLocal(); return; }
  var path=coll+'/'+obj.id;
  clearTimeout(writeQ[path]);
  var go=function(){
    try{ Promise.resolve(docRef(path).set(JSON.parse(JSON.stringify(obj))))
      .catch(function(){ toast("Couldn't save — check your connection"); }); }
    catch(e){ toast("Couldn't save"); }
  };
  if(instant) go(); else writeQ[path]=setTimeout(go,350);
}
function drop(coll,id){
  var list=store(coll),out=[];
  for(var i=0;i<list.length;i++){ if(list[i].id!==id) out.push(list[i]); }
  if(coll==='days') S.days=out; else if(coll==='routines') S.routines=out;
  else if(coll==='chat') S.chat=out; else if(coll==='meals') S.meals=out;
  else if(coll==='weights') S.weights=out; else if(coll==='skips') S.skips=out;
  else if(coll==='chars') S.chars=out; else S.sessions=out;
  render();
  if(S.local){ saveLocal(); return; }
  try{ Promise.resolve(docRef(coll+'/'+id).delete()).catch(function(){}); }catch(e){}
}
function goLocal(){
  if(S.local) return;
  S.local=true; S.ready=true;
  if(!S.days.length&&!S.sessions.length&&!S.routines.length) loadLocal();
  render();
}
var setT;
function saveSettings(){
  render();
  if(S.local){ saveLocal(); return; }
  clearTimeout(setT);
  setT=setTimeout(function(){
    try{ Promise.resolve(docRef('settings/app').set(JSON.parse(JSON.stringify(
        {id:'app',rest:S.settings.rest,step:S.settings.step,gym:S.settings.gym||null}))))
      .catch(function(){}); }catch(e){}
  },400);
}
function initDb(){
  var guard=setTimeout(function(){ if(!S.ready) goLocal(); },10000);
  if(!(window.claude&&typeof claude.use==='function')){ clearTimeout(guard); goLocal(); return; }
  claude.use('sample').then(function(s){ S.sample=s||null; render(); }).catch(function(){ S.sample=null; });
  claude.use('db').then(function(api){
    if(!api||!api.collection){ clearTimeout(guard); goLocal(); return; }
    S.db=api;
    var need=['d','r','s','c','g','m','w','pf','sk','ch'], got={};
    function mark(k){
      got[k]=1;
      if(need.every(function(x){ return got[x]; })) clearTimeout(guard);
      S.ready=true; renderSoft();
    }
    function sub(name,key,fn){
      try{ api.collection(name).onSnapshot(function(sn){ fn(normalize(sn)); mark(key); },
        function(){ clearTimeout(guard); goLocal(); }); }
      catch(e){ clearTimeout(guard); goLocal(); }
    }
    sub('days','d',function(v){ S.days=sortDays(v); });
    sub('routines','r',function(v){ S.routines=v; });
    sub('sessions','s',function(v){ S.sessions=v; });
    sub('chat','c',function(v){ S.chat=v.sort(function(a,b){return (a.at||0)-(b.at||0);}); });
    sub('settings','g',function(v){
      var a=v.filter(function(x){ return x.id==='app'; })[0];
      if(a) S.settings={rest:(a.rest===0?0:num(a.rest)||90),step:num(a.step)||2.5,gym:a.gym||null};
    });
    sub('meals','m',function(v){ S.meals=v; });
    sub('skips','sk',function(v){ S.skips=v; });
    sub('chars','ch',function(v){ S.chars=v; });
    sub('weights','w',function(v){ S.weights=v.sort(function(a,b){ return String(a.date)<String(b.date)?-1:1; }); });
    sub('profile','pf',function(v){ var a=v.filter(function(x){ return x.id==='me'; })[0]; if(a){ S.profile=a; applyTheme(); } });
  }).catch(function(){ clearTimeout(guard); goLocal(); });
}

/* ---------------- derived ---------------- */
function active(){ var b=null; S.sessions.forEach(function(s){ if(!s.finishedAt&&(!b||s.startedAt>b.startedAt)) b=s; }); return b; }
function finished(){ return S.sessions.filter(function(s){return !!s.finishedAt;})
  .sort(function(a,b){ return (b.finishedAt||0)-(a.finishedAt||0); }); }
function byId(coll,id){ return store(coll).filter(function(x){return x.id===id;})[0]; }
/* the routine in force on a weekday at a given date (routines can start on a date) */
function routineFor(w,dstr){
  var d=dstr||ymd();
  var list=S.routines.filter(function(r){
    return (r.weekday|0)===(w|0) && (!r.effectiveFrom||String(r.effectiveFrom)<=String(d));
  });
  list.sort(function(a,b){ return String(a.effectiveFrom||'')<String(b.effectiveFrom||'')?1:-1; });
  return list[0];
}
/* a routine for this weekday that kicks in later */
function futureRoutine(w,dstr){
  var d=dstr||ymd();
  var list=S.routines.filter(function(r){
    return (r.weekday|0)===(w|0) && r.effectiveFrom && String(r.effectiveFrom)>String(d);
  });
  list.sort(function(a,b){ return String(a.effectiveFrom)<String(b.effectiveFrom)?-1:1; });
  return list[0];
}
/* the weekdays that actually carry a workout on a given date */
function mainDays(dstr){
  var out=[];
  for(var w=0;w<7;w++){ var r=routineFor(w,dstr); if(r&&(r.exercises||[]).length) out.push(w); }
  return out;
}
function mainDayNames(dstr){
  var n=mainDays(dstr).map(function(w){ return DOW[w]; });
  return n.length? (n.length>1? n.slice(0,-1).join(', ')+' and '+n[n.length-1] : n[0]) : 'no fixed days';
}
function routineDays(){
  var set={};
  mainDays().forEach(function(w){ set[w]=1; });
  S.routines.forEach(function(r){ if((r.exercises||[]).length) set[r.weekday|0]=1; });
  return Object.keys(set).map(Number).sort(function(a,b){ return ((a+6)%7)-((b+6)%7); });
}

/* a workout for a date: explicit day doc wins, else the weekday's routine */
function plannedFor(dstr){
  var d=S.days.filter(function(x){ return x.date===dstr; })[0];
  if(d) return d;
  var r=routineFor(fromYmd(dstr).getDay(),dstr);
  if(r) return {id:'v:'+r.id+':'+dstr,name:r.name,date:dstr,note:r.note||'',
    exercises:r.exercises||[],_virtual:true,routineId:r.id};
  return null;
}
function resolveDay(id){
  var d=byId('days',id); if(d) return d;
  if(String(id).indexOf('v:')===0){
    var p=String(id).split(':'), r=byId('routines',p[1]);
    if(r) return {id:id,name:r.name,date:p[2],note:r.note||'',exercises:r.exercises||[],_virtual:true,routineId:r.id};
  }
  return null;
}
function sessionOn(dstr){
  return finished().filter(function(s){ return ymd(new Date(s.finishedAt))===dstr; })[0];
}
function nextWorkouts(n){
  var out=[],d=new Date();
  for(var i=0;i<60&&out.length<(n||4);i++){
    var s=ymd(new Date(d.getFullYear(),d.getMonth(),d.getDate()+i));
    var p=plannedFor(s);
    if(p&&(p.exercises||[]).length&&!sessionOn(s)) out.push(p);
  }
  return out;
}

/* ---- weight progression: learn from what was actually logged ---- */
function historyFor(name){
  var key=String(name||'').trim().toLowerCase(), out=[];
  if(!key) return out;
  finished().forEach(function(s){
    (s.ex||[]).forEach(function(e){
      if(String(e.name||'').trim().toLowerCase()!==key) return;
      var done=(e.sets||[]).filter(function(x){return x.done;});
      if(done.length) out.push({at:s.finishedAt,target:e.target||{},sets:done.map(function(x){
        return {kg:num(x.kg),reps:num(x.reps)}; })});
    });
  });
  return out;   // newest first (finished() is newest first)
}
function stepFor(e){ return num(e&&e.step)||num(S.settings.step)||STEP; }
function roundStep(kg,st){ st=num(st)||STEP; return Math.round(kg/st)*st; }
function suggest(name,planKg,planReps,planSets,st){
  st=num(st)||num(S.settings.step)||STEP;
  var h=historyFor(name);
  if(!h.length) return {kg:num(planKg),why:''};
  var last=h[0], top=topRep(planReps)||topRep(last.target.reps)||0;
  var maxKg=0; last.sets.forEach(function(s){ if(s.kg>maxKg) maxKg=s.kg; });
  var enough=last.sets.length>=(num(planSets)||last.sets.length);
  var allTop=top>0&&last.sets.every(function(s){ return s.reps>=top; })&&enough;
  var hit=last.sets.map(function(s){ return fmt(s.reps); }).join(',');
  if(allTop) return {kg:roundStep(maxKg+st,st),
    why:'Last time '+fmt(maxKg)+'kg × '+hit+' — all reps hit, so +'+fmt(st)+'kg'};
  return {kg:maxKg,why:'Last time '+fmt(maxKg)+'kg × '+hit+' — hold the weight and beat the reps'};
}

var actx=null;
function primeAudio(){
  try{

  }catch(e){ actx=null; }

function beep(){
  if(!actx) return;
  try{
    [0,0.22].forEach(function(off){
      var o=actx.createOscillator(), g=actx.createGain();
      o.connect(g); g.connect(actx.destination);
      o.type='sine'; o.frequency.value=880;
      var t=actx.currentTime+off;
      g.gain.setValueAtTime(0.0001,t);
      g.gain.exponentialRampToValueAtTime(0.22,t+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,t+0.16);
      o.start(t); o.stop(t+0.18);
    });
  }catch(e){}
}

/* ---------------- progress charts ---------------- */
function exerciseNames(){
  var seen={},out=[];
  finished().slice().reverse().forEach(function(s){
    (s.ex||[]).forEach(function(e){
      if(e.kind==='protocol') return;
      if(!(e.sets||[]).filter(function(x){return x.done;}).length) return;
      var k=String(e.name||'').trim();
      if(!k||seen[k]) return;
      seen[k]=1; out.push(k);
    });
  });
  return out;
}
function progData(name){
  var key=String(name||'').trim().toLowerCase(), out=[];
  finished().slice().reverse().forEach(function(s){      /* oldest first */
    (s.ex||[]).forEach(function(e){
      if(String(e.name||'').trim().toLowerCase()!==key) return;
      var done=(e.sets||[]).filter(function(x){return x.done;});
      if(!done.length) return;
      var top=0,vol=0,best=0;
      done.forEach(function(x){
        var k=num(x.kg)+exBase(e); if(k>top) top=k;
        vol+=setLoad(e,x)*num(x.reps);
        var r=e1rm(e,x); if(r>best) best=r;
      });
      out.push({x:new Date(s.finishedAt).toLocaleDateString(undefined,{day:'numeric',month:'short'}),
        top:top,vol:vol,e1rm:Math.round(best*10)/10,sets:done.length,at:s.finishedAt});
    });
  });
  return out;
}
/* one series per chart, so the title carries identity and no legend is needed */
function chartSVG(pts,color){
  var n=pts.length, W=320,H=134,PL=38,PR=18,PT=18,PB=22;
  var vals=pts.map(function(p){return p.y;});
  var mn=Math.min.apply(null,vals), mx=Math.max.apply(null,vals);
  if(mx===mn){ var d0=Math.abs(mx)*0.1||1; mn-=d0; mx+=d0; }
  var pad=(mx-mn)*0.18; mn=Math.max(0,mn-pad); mx=mx+pad;
  /* snap the axis to readable round numbers rather than whatever the data lands on */
  var raw=(mx-mn)/2, mag=Math.pow(10,Math.floor(Math.log(raw)/Math.LN10)), q=raw/mag;
  var gs=(q<1.5?1:q<3?2:q<7?5:10)*mag;
  mn=Math.max(0,Math.floor(mn/gs)*gs); mx=Math.ceil(mx/gs)*gs;
  if(mx<=mn) mx=mn+gs;
  var X=function(i){ return n<2?PL+(W-PL-PR)/2:PL+i*(W-PL-PR)/(n-1); };
  var Y=function(v){ return PT+(H-PT-PB)*(1-(v-mn)/((mx-mn)||1)); };
  var h='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="trend chart">';
  for(var g=mn;g<=mx+gs*0.001;g+=gs){
    var y=Y(g);
    h+='<line class="gl" x1="'+PL+'" y1="'+y.toFixed(1)+'" x2="'+(W-PR)+'" y2="'+y.toFixed(1)+'"/>'
      + '<text class="ax" x="'+(PL-7)+'" y="'+(y+3.2).toFixed(1)+'" text-anchor="end">'
      + fmt(Math.round(g*100)/100)+'</text>';
  }
  h+='<path d="'+pts.map(function(p,i){ return (i?'L':'M')+X(i).toFixed(1)+' '+Y(p.y).toFixed(1); }).join(' ')
    + '" fill="none" stroke="'+color+'" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>';
  var best=0; pts.forEach(function(p,i){ if(p.y>pts[best].y) best=i; });
  pts.forEach(function(p,i){
    h+='<circle cx="'+X(i).toFixed(1)+'" cy="'+Y(p.y).toFixed(1)+'" r="4" fill="'+color+'" stroke="#171a22" stroke-width="2"/>';
  });
  var lab=function(i){
    h+='<text class="lb" x="'+X(i).toFixed(1)+'" y="'+(Y(pts[i].y)-10).toFixed(1)+'" text-anchor="'
      + (i===0?'start':i===n-1?'end':'middle')+'">'+esc(fmt(pts[i].y))+'</text>';
  };
  if(best!==n-1) lab(best);
  lab(n-1);
  h+='<text class="ax" x="'+X(0).toFixed(1)+'" y="'+(H-5)+'" text-anchor="start">'+esc(pts[0].x)+'</text>';
  if(n>1) h+='<text class="ax" x="'+X(n-1).toFixed(1)+'" y="'+(H-5)+'" text-anchor="end">'+esc(pts[n-1].x)+'</text>';
  return h+'</svg>';
}

function simpleTrend(title,cap,pts,color,unit){

/* flat trend AND no new best — both, so adding reps does not read as a stall */
function stallInfo(rows){
  var pts=rows.filter(function(r){ return r.e1rm>0; });
  if(pts.length<3) return null;
  var cut=Date.now()-28*86400000;
  var win=pts.filter(function(p){ return p.at>=cut; });
  if(win.length<3) return null;
  var n=win.length, t0=win[0].at, sx=0,sy=0,sxy=0,sxx=0;
  win.forEach(function(p){ var x=(p.at-t0)/604800000; sx+=x; sy+=p.e1rm; sxy+=x*p.e1rm; sxx+=x*x; });
  var den=n*sxx-sx*sx; if(!den) return null;
  var slope=(n*sxy-sx*sy)/den;
  var cur=win[win.length-1].e1rm;
  var pct=cur?slope/cur*100:0;
  var before=pts.filter(function(p){ return p.at<cut; });
  var bestBefore=before.reduce(function(a,p){ return p.e1rm>a?p.e1rm:a; },0);
  var bestIn=win.reduce(function(a,p){ return p.e1rm>a?p.e1rm:a; },0);
  /* with no history before the window there is nothing to beat, so it is not a PR */
  var newPR=before.length>0&&bestIn>bestBefore;
  return {pct:pct,weeks:Math.round((win[win.length-1].at-t0)/604800000*10)/10,
    newPR:newPR, stalled:pct<1&&!newPR};
}
function repPRs(name){
  var key=String(name||'').trim().toLowerCase(), best={};
  finished().forEach(function(s){
    (s.ex||[]).forEach(function(e){
      if(String(e.name||'').trim().toLowerCase()!==key) return;
      (e.sets||[]).forEach(function(x){
        if(!x.done) return;
        var w=Math.round((num(x.kg)+exBase(e))*100)/100, r=num(x.reps);
        if(!w||!r) return;
        if(!best[w]||r>best[w].reps) best[w]={reps:r,at:s.finishedAt};
      });
    });
  });
  return Object.keys(best).map(Number).sort(function(a,b){ return b-a; })
    .map(function(w){ return {kg:w,reps:best[w].reps,at:best[w].at}; });
}

function prevSession(dayId,notId){

function statsBlock(ses){

  L.push('## Watch out — 1-3 bullets on form, fatigue or skipped work. Omit the heading if there is nothing real to say.');
  L.push('## Next time — 2-3 bullets with concrete weight or rep targets.');
  L.push('If per-exercise times are given, comment briefly on pacing: which exercise ran long, and whether transitions dragged.');
  L.push('Under 260 words. Address them as "you". Use only the data above — never invent lifts, numbers or injuries.');
  return L.join('\n');
}
function mdToHtml(md){
  var out='',inUl=false;
  function inline(s){ return esc(s).replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/\*([^*]+)\*/g,'<em>$1</em>'); }
  String(md||'').split('\n').forEach(function(ln){
    var t=ln.trim();
    if(/^#{1,4}\s/.test(t)){ if(inUl){out+='</ul>';inUl=false;} out+='<h3>'+inline(t.replace(/^#{1,4}\s*/,''))+'</h3>'; }
    else if(/^[-*•]\s/.test(t)){ if(!inUl){out+='<ul>';inUl=true;} out+='<li>'+inline(t.replace(/^[-*•]\s*/,''))+'</li>'; }
    else if(!t){ if(inUl){out+='</ul>';inUl=false;} }
    else { if(inUl){out+='</ul>';inUl=false;} out+='<p>'+inline(t)+'</p>'; }
  });
  if(inUl) out+='</ul>';
  return out;
}

function cleanEx(list){

      return {id:uid(),kind:'protocol',name:String(e.name||'Protocol'),spec:String(e.spec||''),note:String(e.note||''),
        segs:(e.segs||[]).map(function(s){ return {label:String(s.label||''),detail:String(s.detail||'')}; })};
    }

      reps:String(e.reps==null?'8-10':e.reps),kg:String(e.kg==null?'':e.kg),note:String(e.note||'')};

function sysMsg(text){ put('chat',{id:uid(),role:'sys',text:text,at:Date.now()},true); }

/* the coach writes workouts as plain lines — flat strings travel far better than nested schemas */
var PLAN_FORMAT='One exercise per line, in order. '
 +'LIFT lines: Name | sets | reps | kg | cue  — e.g. "Chest Press Machine | 4 | 8-10 | 45 | Scapula retracted, 2-second negative, explode up". '
 +'CARDIO or timed lines start with the word cardio: cardio | Name | spec | block = detail ; block = detail | cue '
 +'— e.g. "cardio | Incline Treadmill Finisher | 10 minutes @ 15 degree incline | 0:00-7:00 = 6.0 km/h ; 7:00-9:00 = 7.0 km/h ; 9:00-10:00 = 5.5 km/h cool down | Keep the incline at 15 the whole way". '
 +'Always give a cue. Use kg numbers only, no units.';

function parsePlan(txt){
  var out=[];
  String(txt||'').split('\n').forEach(function(ln){
    var t=ln.trim(); if(!t) return;
    t=t.replace(/^[-*•]\s*/,'').replace(/^\d+[\).]\s*/,'');
    var p=t.split('|').map(function(x){ return x.trim(); });
    if(/^cardio$/i.test(p[0])||/^protocol$/i.test(p[0])){
      var segs=[];
      String(p[3]||'').split(';').forEach(function(s){
        if(!s.trim()) return;
        var k=s.indexOf('=');
        segs.push(k<0?{label:s.trim(),detail:''}:{label:s.slice(0,k).trim(),detail:s.slice(k+1).trim()});
      });
      out.push({id:uid(),kind:'protocol',name:p[1]||'Finisher',spec:p[2]||'',note:p[4]||'',segs:segs});
    } else {
      out.push({id:uid(),kind:'strength',name:p[0]||'Exercise',sets:p[1]||'4',
        reps:p[2]||'8-10',kg:p[3]||'',note:p[4]||''});
    }
  });
  return out;
}
var RESULT_FORMAT='One exercise per line, in order. '
 +'LIFT lines: Name | set ; set ; set | optional comment — each set is weight x reps, e.g. '
 +'"Seated Row Machine | 100x8 ; 100x8 ; 100x7 ; 95x8 | last set was a grind". '
 +'For bodyweight work give reps alone: "Push Ups | 12 ; 10 ; 10". '
 +'CARDIO lines: cardio | Name | spec | block = detail ; block = detail | optional comment '
 +'— every block is recorded as completed. Weights are plain kg numbers, no units.';

/* a workout that already happened, with the weights and reps actually hit */
function parseResults(txt){
  var out=[];
  String(txt||'').split('\n').forEach(function(ln){
    var t=ln.trim(); if(!t) return;
    t=t.replace(/^[-*\u2022]\s*/,'').replace(/^\d+[\).]\s*/,'');
    var p=t.split('|').map(function(x){ return x.trim(); });
    if(/^cardio$/i.test(p[0])||/^protocol$/i.test(p[0])){
      var segs=[];
      String(p[3]||'').split(';').forEach(function(sg){
        if(!sg.trim()) return;
        var k=sg.indexOf('=');
        segs.push(k<0?{label:sg.trim(),detail:'',done:true}
                     :{label:sg.slice(0,k).trim(),detail:sg.slice(k+1).trim(),done:true});
      });
      out.push({id:uid(),kind:'protocol',name:p[1]||'Finisher',spec:p[2]||'',note:'',
        segs:segs,comment:p[4]||''});
      return;
    }
    var sets=[];
    String(p[1]||'').split(/[;,]/).forEach(function(sv){
      var v=sv.trim(); if(!v) return;
      var m=v.match(/(-?\d+(?:[.,]\d+)?)\s*[x×*@]\s*(\d+(?:[.,]\d+)?)/i);
      if(m){ sets.push({kg:String(num(m[1])),reps:String(num(m[2])),done:true}); return; }
      if(/^\d+(?:[.,]\d+)?$/.test(v)) sets.push({kg:'',reps:String(num(v)),done:true});
    });
    if(!sets.length) return;
    var top=0; sets.forEach(function(x){ if(num(x.kg)>top) top=num(x.kg); });
    out.push({id:uid(),kind:'strength',name:p[0]||'Exercise',note:'',comment:p[2]||'',
      target:{sets:sets.length,reps:String(num(sets[0].reps)),kg:top},sets:sets});
  });
  return out;
}
function dowFromName(s){
  var n=String(s||'').trim().toLowerCase().slice(0,3);
  var i=['sun','mon','tue','wed','thu','fri','sat'].indexOf(n);
  if(i>=0) return i;
  var d=parseInt(s,10);
  return (d>=0&&d<=6)?d:-1;
}

function coachTools(){
  return [
  { name:'schedule_workout',
    description:'Add or replace the workout on one specific date. Use for extra sessions, swaps, or filling an empty day. Overwrites whatever that date had.',
    inputSchema:{type:'object',properties:{
      date:{type:'string',description:'The date, as YYYY-MM-DD'},
      name:{type:'string',description:'Short workout name, e.g. "Push & Arms"'},
      note:{type:'string',description:'Optional whole-workout note: rep targets, hydration, overall intent'},
      plan:{type:'string',description:PLAN_FORMAT}
    },required:['date','name','plan']},
    execute:function(a){
      var ex=parsePlan(a.plan);
      if(!ex.length) throw new Error('No exercise lines could be read from plan. '+PLAN_FORMAT);
      var old=S.days.filter(function(d){ return d.date===a.date; })[0];
      var d={id:old?old.id:uid(),name:String(a.name),date:String(a.date),note:String(a.note||''),exercises:ex,source:'coach'};
      put('days',d,true);
      sysMsg((old?'Updated ':'Added ')+fromYmd(a.date).toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short'})+' — '+d.name);
      return {ok:true,date:d.date,exercises:ex.map(function(e){return e.name;})};
    }},

  { name:'remove_workout',
    description:'Clear the planned workout on a date. For a date that only comes from the standing weekly routine, this writes an empty rest day over it.',
    inputSchema:{type:'object',properties:{date:{type:'string',description:'YYYY-MM-DD'}},required:['date']},
    execute:function(a){
      var old=S.days.filter(function(d){ return d.date===a.date; })[0];
      if(old) drop('days',old.id);
      if(plannedFor(a.date)) put('days',{id:uid(),name:'Rest day',date:String(a.date),exercises:[],source:'coach'},true);
      sysMsg('Cleared '+fromYmd(a.date).toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short'}));
      return {ok:true};
    }},

  { name:'set_routine',
    description:'Set the standing workout for a weekday, repeating every week. Use this for lasting programme changes rather than one-off dates. Pass effective_from to make the change start on a future date and leave the current routine running until then.',
    inputSchema:{type:'object',properties:{
      weekday:{type:'string',description:'Day name, e.g. "tuesday"'},
      name:{type:'string'},
      effective_from:{type:'string',description:'Optional YYYY-MM-DD. The routine applies from this date onward; before it the old one still stands. Omit to change it starting now.'},
      note:{type:'string',description:'Optional whole-workout note: rep targets, hydration, overall intent'},
      plan:{type:'string',description:PLAN_FORMAT}
    },required:['weekday','name','plan']},
    execute:function(a){
      var w=dowFromName(a.weekday);
      if(w<0) throw new Error('Unrecognised weekday: '+a.weekday);
      var ex=parsePlan(a.plan);
      if(!ex.length) throw new Error('No exercise lines could be read from plan. '+PLAN_FORMAT);
      var from=String(a.effective_from||'');
      var old=from?S.routines.filter(function(r){ return (r.weekday|0)===w&&String(r.effectiveFrom||'')===from; })[0]
                  :routineFor(w);
      var r={id:old?old.id:uid(),weekday:w,name:String(a.name),effectiveFrom:from,
        note:String(a.note||''),exercises:ex};
      put('routines',r,true);
      sysMsg('Standing '+DOW[w]+' workout set — '+r.name+(from?' (from '+from+')':''));
      return {ok:true,weekday:DOW[w],effective_from:from||'now',exercises:ex.map(function(e){return e.name;})};
    }},

  { name:'log_workout',
    description:'Record a workout that was ALREADY DONE, on its real date, with the actual weights and reps the user reports. This writes a completed session into their history, which is what the progress charts and weight suggestions read. Replaces any session already logged on that date.',
    inputSchema:{type:'object',properties:{
      date:{type:'string',description:'The date it was done, as YYYY-MM-DD'},
      name:{type:'string',description:'Workout name, e.g. "Pull & Shoulders"'},
      minutes:{type:'number',description:'Optional session length in minutes'},
      notes:{type:'string',description:"Optional: how it went, in the user's own words"},
      results:{type:'string',description:RESULT_FORMAT}
    },required:['date','name','results']},
    execute:function(a){
      var when=fromYmd(a.date);
      if(isNaN(when.getTime())) throw new Error('Unreadable date: '+a.date+' (use YYYY-MM-DD)');
      var ex=parseResults(a.results);
      if(!ex.length) throw new Error('No exercise lines could be read from results. '+RESULT_FORMAT);
      var end=when.getTime()+18*3600000, mins=num(a.minutes)||70;
      var old=finished().filter(function(s){ return ymd(new Date(s.finishedAt))===String(a.date); })[0];
      var match=S.routines.filter(function(r){ return String(r.name||'').toLowerCase()===String(a.name).toLowerCase(); })[0]
             || S.days.filter(function(d){ return String(d.name||'').toLowerCase()===String(a.name).toLowerCase(); })[0];
      var ses={id:old?old.id:uid(),dayId:(old&&old.dayId)||(match?match.id:''),dayName:String(a.name),
        startedAt:end-mins*60000,finishedAt:end,dayNote:'',notes:String(a.notes||''),review:null,ex:ex};
      put('sessions',ses,true);
      sysMsg((old?'Replaced ':'Logged ')
        +when.toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short'})+' — '+ses.dayName);
      return {ok:true,date:String(a.date),exercises:ex.map(function(e){return e.name;}),
        volume_kg:fmt(volume(ses)),replaced:!!old};
    }},

  { name:'get_exercise_history',
    description:'Every logged set for one exercise, newest first, so you can pick the next weight from real data.',
    inputSchema:{type:'object',properties:{name:{type:'string'}},required:['name']},
    execute:function(a){
      var h=historyFor(a.name).slice(0,8).map(function(x){
        return {date:ymd(new Date(x.at)),sets:x.sets.map(function(s){ return s.kg+'kg x '+s.reps; })};
      });
      return {exercise:a.name,logged:h,suggestion:suggest(a.name,0,'','')};
    }}
  ];
}

function planSnapshot(){
  var L=[],t=new Date();
  L.push("TODAY: "+t.toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long',year:'numeric'})+" ("+ymd(t)+")");
  L.push('MAIN TRAINING DAYS right now: '+mainDayNames()+'. These come from whichever standing routines are in force.');
  L.push('GYM: '+gym().name+'. Hours: '+[1,2,3,4,5,6,0].map(function(w){
    var h=gymDay(w); return DOW[w]+' '+(h?h[0]+'-'+h[1]:'closed'); }).join(', ')
    +'. Never schedule a session on a day it is closed, and warn when a day closes early.');
  L.push('');
  L.push('STANDING WEEKLY ROUTINE (a routine with a start date only applies from that date on):');
  if(!S.routines.length) L.push('  (none set)');
  S.routines.slice().sort(function(a,b){return ((a.weekday+6)%7)-((b.weekday+6)%7);}).forEach(function(r){
    L.push('  '+DOW[r.weekday|0]+(r.effectiveFrom?' from '+r.effectiveFrom:' (in force now)')+': '+r.name
      +(r.note?' [note: '+r.note+']':'')+' — '+((r.exercises||[]).length?(r.exercises||[]).map(function(e){
      return e.name+' '+(e.kind==='protocol'?(e.spec||''):(e.sets+'x'+e.reps+' @ '+(e.kg||'?')+'kg'));
    }).join('; '):'EMPTY, needs filling'));
  });
  L.push('');
  L.push('NEXT 14 DAYS (what is actually scheduled):');
  for(var i=0;i<14;i++){
    var d=new Date(t.getFullYear(),t.getMonth(),t.getDate()+i), s=ymd(d), p=plannedFor(s);
    var lbl='  '+s+' '+DOW[d.getDay()]+': ';
    if(!p) L.push(lbl+'rest');
    else if(!(p.exercises||[]).length) L.push(lbl+p.name+' (empty)');
    else L.push(lbl+p.name+' — '+(p.exercises||[]).map(function(e){
      return e.name+' '+(e.kind==='protocol'?(e.spec||''):(e.sets+'x'+e.reps+' @ '+(e.kg||'?')+'kg'));
    }).join('; ')+(p._virtual?'  [from routine]':'  [fixed for this date]'));
  }
  var fin=finished().slice(0,6);
  L.push('');
  L.push('RECENT LOGGED SESSIONS (newest first) — plan weights from these, not from the targets:');
  if(!fin.length) L.push('  (nothing logged yet)');
  fin.forEach(function(s){
    L.push('  '+ymd(new Date(s.finishedAt))+' '+s.dayName+' — '+(s.ex||[]).map(function(e){
      var d=(e.sets||[]).filter(function(x){return x.done;});
      return e.name+': '+(d.length?d.map(function(x){return num(x.kg)+'x'+num(x.reps);}).join(','):'skipped');
    }).join(' | '));
    if(s.notes) L.push('     their note: "'+s.notes+'"');
  });
  return L.join('\n');
}
function coachPreamble(){

  '- When they tell you what they actually lifted in a past session, call log_workout to put it in their history. That is what the charts and weight suggestions read, so get the numbers exactly as given and never invent a set they did not report.',

function coachSend(text){
  text=String(text||'').trim(); if(!text||S.busy) return;
  put('chat',{id:uid(),role:'user',text:text,at:Date.now()},true);
  S.draft=''; S.busy=true; S.stream=''; render();
  setTimeout(scrollEnd,30);
  if(!S.sample){ if(aiKey()) coachGemini(text); else coachRules(text); return; }

  var msgs=[{role:'user',content:coachPreamble()+'\n\nReply to this setup message with exactly: Ready.'},
            {role:'assistant',content:'Ready.'}];
  S.chat.filter(function(m){ return m.role==='user'||m.role==='assistant'; }).slice(-14).forEach(function(m){
    msgs.push({role:m.role,content:m.text});
  });
  if(msgs[msgs.length-1].role!=='user') msgs.push({role:'user',content:text});

  var done=false;
  var settle=function(text){
    if(done)return; done=true; S.busy=false; S.stream='';
    put('chat',{id:uid(),role:'assistant',text:text||'(no reply)',at:Date.now()},true);
    setTimeout(scrollEnd,30);
  };
  var timer=setTimeout(function(){ settle('That took too long — try asking again.'); },120000);

  var run=function(withTools){
    var opts={modelTier:'default',onText:function(o){ if(!done){ S.stream=o.text||''; paintStream(); } }};
    if(withTools) opts.tools=coachTools();
    return S.sample(msgs,opts);
  };

  /* tool plumbing is the most likely thing to break: fall back to plain advice rather than nothing */
  var handle=function(err,retried){
    var c=(err&&err.code)||'';
    if(c==='not_granted'){ clearTimeout(timer); return settle("I can't reach the AI coach from this page."); }
    if(c==='rate_limited'){ clearTimeout(timer); return settle('Rate limited — give it a minute and ask again.'); }
    if(!retried){
      try{
        return run(false).then(function(res){
          clearTimeout(timer);
          settle(((res&&res.text)||'')+'\n\n*(Answered without plan editing this time, so nothing in your calendar changed.)*');
        }).catch(function(e2){ handle(e2,true); });
      }catch(e3){ return handle(e3,true); }
    }
    clearTimeout(timer);
    settle('Coach unavailable'+(c?' ('+c+')':'')
      +((err&&err.message)?': '+err.message:'. Try again in a moment.'));
  };

  try{
    run(true).then(function(res){ clearTimeout(timer); settle((res&&res.text)||''); })
      .catch(function(err){ handle(err,false); });
  }catch(e){ handle(e,false); }
}

/* Mifflin-St Jeor. With no sex given, the midpoint of the two formulas. */
function energy(){
  var p=S.profile, w=num(p.weightKg), h=num(p.heightCm), a=num(p.age);
  if(!w||!h||!a) return null;
  var male=10*w+6.25*h-5*a+5, female=10*w+6.25*h-5*a-161;
  var bmr=p.sex==='m'?male:p.sex==='f'?female:(male+female)/2;
  var af=(ACT.filter(function(x){ return x[0]===(p.activity||'light'); })[0]||ACT[1])[2];
  var tdee=bmr*af;
  var adj=(AIM.filter(function(x){ return x[0]===(p.aim||'keep'); })[0]||AIM[1])[2];
  return {bmr:Math.round(bmr),tdee:Math.round(tdee),
    target:Math.max(1200,Math.round((tdee+adj)/10)*10),
    floored:(tdee+adj)<1200, protein:Math.round(w*1.8)};
}
/* smoothed body weight: raw scale readings swing with water and food */
function trendWeights(){
  var P=0.1, trend=null, out=[];
  S.weights.slice().sort(function(a,b){ return String(a.date)<String(b.date)?-1:1; })
    .forEach(function(w){
      var kg=num(w.kg); if(!kg) return;
      trend = (trend==null) ? kg : trend + P*(kg-trend);
      out.push({date:w.date,raw:kg,trend:Math.round(trend*100)/100,at:fromYmd(w.date).getTime()});
    });
  return out;
}
/* solve for expenditure instead of predicting it:
   mean intake minus the energy the trend says you actually gained or lost */
function adaptiveTDEE(){
  var tr=trendWeights();
  if(tr.length<2) return null;
  var endAt=tr[tr.length-1].at;
  var win=tr.filter(function(p){ return p.at>=endAt-21*86400000; });
  if(win.length<2) return {ready:false,why:'Weigh in a few more times over a couple of weeks.'};
  var days=Math.round((win[win.length-1].at-win[0].at)/86400000);
  if(days<10) return {ready:false,why:'Needs about two weeks between your first and last weigh-in.'};
  var logged=0,total=0;
  for(var i=0;i<=days;i++){
    var kc=dayTotals(ymd(new Date(win[0].at+i*86400000))).kcal;
    if(kc>0){ total+=kc; logged++; }
  }
  var missing=days+1-logged;
  if(logged<Math.ceil((days+1)*0.7))
    return {ready:false,why:'Food is logged on '+logged+' of the last '+(days+1)+' days. It needs about 70%.'};
  var meanIntake=total/logged;
  var dTrend=win[win.length-1].trend-win[0].trend;
  var est=meanIntake-(dTrend*7700)/days;          /* 7700 kcal per kg of tissue */
  if(!(est>800&&est<6000)) return {ready:false,why:'The numbers do not look settled yet. Keep logging.'};
  return {ready:true,tdee:Math.round(est/10)*10,days:days,logged:logged,missing:missing,
    intake:Math.round(meanIntake),dTrend:Math.round(dTrend*100)/100,
    rate:Math.round(dTrend/days*7*100)/100};
}
function logWeight(kg){
  var v=num(kg); if(!v) return;
  var d=foodDate();
  put('weights',{id:'w-'+d,date:d,kg:v},true);
  saveProfile({weightKg:v});
}

/* ---- photo estimate ---- */
function shrink(file,max,q,asData){
  return new Promise(function(res,rej){
    var url=URL.createObjectURL(file), img=new Image();
    img.onload=function(){
      var sc=Math.min(1,max/Math.max(img.width,img.height)||1);
      var c=document.createElement('canvas');
      c.width=Math.max(1,Math.round(img.width*sc));
      c.height=Math.max(1,Math.round(img.height*sc));
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(url);
      if(asData){ try{ res(c.toDataURL('image/jpeg',q)); }catch(e){ rej(e); } return; }
      c.toBlob(function(b){ b?res(b):rej(new Error('Could not process that image')); },'image/jpeg',q);
    };
    img.onerror=function(){ URL.revokeObjectURL(url); rej(new Error('That file is not an image I can read')); };
    img.src=url;
  });
}
function looseJSON(txt){
  var t=String(txt||'').replace(/```json/gi,'```').split('```').join('\n');
  var a=t.indexOf('{'), b=t.lastIndexOf('}');
  if(a<0||b<a) return null;
  try{ return JSON.parse(t.slice(a,b+1)); }catch(e){ return null; }
}
function recentMealContext(){
  var seen={},out=[];
  S.meals.slice().sort(function(a,b){ return (b.at||0)-(a.at||0); }).forEach(function(m){
    var k=String(m.name||'').toLowerCase();
    if(!k||seen[k]||out.length>=6) return;
    seen[k]=1;
    out.push('- '+m.name+': '+Math.round(num(m.kcal))+' kcal, '+Math.round(num(m.protein))+'g protein');
  });
  return out.length?('\nMeals this person has logged before, useful for anchoring their usual portion sizes:\n'+out.join('\n')+'\n'):'';
}
function foodPrompt(hint){
  return 'You estimate nutrition from photos for someone tracking calories and protein for strength training. '
   + 'Getting PORTION SIZE right matters more than naming the dish prettily.\n\n'
   + 'Work through this before answering:\n'
   + '1. List every distinct food and drink you can see, including sides, sauces and anything in a glass.\n'
   + '2. If a nutrition label, packaging or menu is visible anywhere in frame, READ IT and use those numbers instead of estimating.\n'
   + '3. Judge portion size against something of known size in the frame: a fork is about 19cm, a dinner plate 26-28cm, '
   + 'a side plate about 20cm, a standard mug 300ml, a drinks can 330ml, an adult hand span about 20cm. '
   + 'Name which reference you used. If there is nothing to scale against, say so and widen your range.\n'
   + '4. Account for what the photo hides: cooking oil, butter, dressing, sauce, sugar in drinks. '
   + 'A pan-fried item carries roughly 10-15g of oil you cannot see. State what you assumed.\n'
   + '5. Give grams for each item first, then the kcal and macros for that exact weight.\n'
   + (hint?('\nThe person has told you this about the meal, and it OVERRIDES your visual estimate:\n"'+hint+'"\n'):'')
   + recentMealContext()
   + '\nReply with ONLY this JSON object, no prose and no code fences:\n'
   + '{"name":"short meal name",'
   + '"items":[{"name":"item","grams":0,"kcal":0,"protein":0,"carbs":0,"fat":0}],'
   + '"low_kcal":0,"high_kcal":0,"confidence":"low",'
   + '"assumptions":"what you assumed about portions and hidden fat, and the size reference you used",'
   + '"to_improve":"the single thing that would most improve this estimate"}\n\n'
   + 'Rules: grams is the edible weight of that item. protein, carbs and fat in grams. '
   + 'confidence is low, medium or high — use low when the portion is genuinely ambiguous. '
   + 'low_kcal and high_kcal must be an honest range for the whole meal, not a token one. '
   + 'If it is not food, return an empty items array and say so in assumptions.';
}

/* per-gram rates let the user correct grams and have everything else follow, idempotently */
function prepItems(raw){
  return (raw||[]).map(function(i){
    var g=num(i.grams), k=num(i.kcal), pr=num(i.protein), c=num(i.carbs), f=num(i.fat);
    var it={name:String(i.name||'Item'),grams:g,kcal:k,protein:pr,carbs:c,fat:f};
    if(g>0) it.per={kcal:k/g,protein:pr/g,carbs:c/g,fat:f/g};
    return it;
  }).filter(function(i){ return i.name; });
}
function recalc(pd){
  if(!pd||!pd.items||!pd.items.length) return pd;
  var t={kcal:0,protein:0,carbs:0,fat:0};
  pd.items.forEach(function(i){
    t.kcal+=num(i.kcal); t.protein+=num(i.protein); t.carbs+=num(i.carbs); t.fat+=num(i.fat);
  });
  pd.kcal=Math.round(t.kcal); pd.protein=Math.round(t.protein);
  pd.carbs=Math.round(t.carbs); pd.fat=Math.round(t.fat);
  return pd;
}

/* ================= FOOD LOOKUP: name search, barcode, AI by name ================= */
var OFF='https://world.openfoodfacts.org';
var OFF_FIELDS='code,product_name,brands,quantity,serving_size,serving_quantity,nutriments';
var searchT=0, searchSeq=0;

function offItem(p){
  if(!p) return null;
  var n=p.nutriments||{};
  var k=num(n['energy-kcal_100g']);
  if(!k&&num(n['energy_100g'])) k=num(n['energy_100g'])/4.184;      /* some entries only carry kJ */
  var nm=String(p.product_name||'').trim();
  if(!k||!nm) return null;
  var pr=num(n.proteins_100g), c=num(n.carbohydrates_100g), f=num(n.fat_100g);
  var sq=num(p.serving_quantity), g=sq>0&&sq<1500?sq:100;
  var brand=String(p.brands||'').split(',')[0].trim();
  return {
    name:nm+(brand&&nm.toLowerCase().indexOf(brand.toLowerCase())<0?' ('+brand+')':''),
    grams:g, k100:Math.round(k), p100:Math.round(pr*10)/10,
    serving:sq>0?String(p.serving_size||sq+' g'):'',
    kcal:Math.round(k*g/100), protein:Math.round(pr*g/10)/10, carbs:Math.round(c*g/10)/10, fat:Math.round(f*g/10)/10,
    per:{kcal:k/100,protein:pr/100,carbs:c/100,fat:f/100}
  };
}
function offGet(url){
  var ctl=typeof AbortController!=='undefined'?new AbortController():null;
  var t=setTimeout(function(){ if(ctl) ctl.abort(); },12000);
  return fetch(url,ctl?{signal:ctl.signal}:{}).then(function(r){
    clearTimeout(t);
    if(!r.ok){ var e=new Error('http'); e.status=r.status; throw e; }
    return r.json();
  },function(e){ clearTimeout(t); throw e; });
}
function lookupErr(e){
  if(typeof navigator!=='undefined'&&navigator.onLine===false) return 'You are offline. Type the numbers in, or try again with signal.';
  if(e&&e.status===429) return 'The food database is busy. Wait a moment and search again.';
  if(e&&e.status) return 'The food database gave an error ('+e.status+'). Try again shortly.';
  return hosted()?'The food database cannot be reached from inside Claude. It works in the browser version.'
                 :'Could not reach the food database. Check your connection and try again.';
}
function useFoodItem(it,source){
  var pd=S.food.pending&&!S.food.pending.editId?S.food.pending:{thumb:'',kcal:0,protein:0,carbs:0,fat:0};
  pd.name=it.name; pd.items=[{name:it.name,grams:it.grams,kcal:it.kcal,protein:it.protein,carbs:it.carbs,fat:it.fat,per:it.per}];
  pd.source=source; pd.confidence=''; pd.assumptions=it.serving?'One serving on the label is '+it.serving+'. Change the grams to what you ate.'
    :'No serving size on the label, so this starts at 100 g. Change the grams to what you ate.';
  recalc(pd);
  S.food.pending=pd; S.food.search=null; S.food.err=''; S.view='food'; render();
}

function searchHTML(){
  var s=S.food.search, h='';
  if(!s||!s.q) return '<div class="fs-hint">Type a product or meal and matches appear here.</div>';
  if(s.loading) h+='<div class="fs-hint"><span class="spin"></span>Searching for '+esc(s.q)+'…</div>';
  if(s.err) h+='<div class="fs-hint" style="color:#e8d98a">'+esc(s.err)+'</div>';

  });

      + '<small>For home-cooked or restaurant food that has no label</small></span><i>AI</i></button>';

}
function paintSearch(){ var el=document.getElementById('fsres'); if(el) el.innerHTML=searchHTML(); }
function foodSearchSoon(q){
  q=String(q||'').trim();
  clearTimeout(searchT);
  if(q.length<3){ S.food.search=null; paintSearch(); return; }
  S.food.search={q:q,loading:true,results:(S.food.search&&S.food.search.results)||[]};
  paintSearch();
  searchT=setTimeout(function(){ foodSearch(q); },850);       /* the database allows only a few searches a minute */
}
function foodSearch(q){
  var seq=++searchSeq;
  offGet(OFF+'/cgi/search.pl?search_terms='+encodeURIComponent(q)
    +'&search_simple=1&action=process&json=1&page_size=20&sort_by=unique_scans_n&fields='+OFF_FIELDS)
  .then(function(d){
    if(seq!==searchSeq) return;
    var out=((d&&d.products)||[]).map(offItem).filter(Boolean).slice(0,8);
    S.food.search={q:q,results:out,done:true}; paintSearch();
  })
  .catch(function(e){
    if(seq!==searchSeq) return;
    S.food.search={q:q,results:[],err:lookupErr(e)}; paintSearch();
  });
}
function namePrompt(q){
  return 'Estimate the nutrition of this food or meal for someone tracking calories and protein: "'+q+'".\n'
   + 'Assume one typical adult portion unless an amount is given. Break it into its main components.\n'
   + 'Reply with ONLY a JSON object, no prose, in this shape:\n'
   + '{"name":"short name","items":[{"name":"component","grams":150,"kcal":250,"protein":30,"carbs":0,"fat":14}],'
   + '"low_kcal":400,"high_kcal":650,"confidence":"low|medium|high","assumptions":"one sentence on the portion you assumed"}';
}
function aiFood(){
  var s=S.food.search; if(!s||!s.q||s.ai) return;
  s.ai=true; paintSearch();

  (S.sample?S.sample(namePrompt(q)):geminiCall(namePrompt(q)))
  .then(function(res){

    var items=prepItems(d.items);

    pd.name=String(d.name||q); pd.items=items; pd.source='ai';

  })
  .catch(function(e){
    if(S.food.search){ S.food.search.ai=false; S.food.search.err=photoErr(e).replace('that photo','that meal'); }
    paintSearch();
  });
}

/* ---- barcode: its own layer outside #app so a redraw never kills the camera ---- */
var SCAN=null;
function closeScanner(){
  if(!SCAN) return;
  clearInterval(SCAN.timer);
  try{ if(SCAN.stream) SCAN.stream.getTracks().forEach(function(t){ t.stop(); }); }catch(e){}
  if(SCAN.el&&SCAN.el.parentNode) SCAN.el.parentNode.removeChild(SCAN.el);
  SCAN=null;
}
function scanMsg(t){ if(SCAN&&SCAN.msg) SCAN.msg.textContent=t; }
function lookupBarcode(code){
  code=String(code||'').replace(/\D/g,'');
  if(code.length<8){ scanMsg('A barcode has 8 to 13 digits.'); return; }
  if(SCAN){ if(SCAN.busy) return; SCAN.busy=true; }
  scanMsg('Found '+code+'. Looking it up…');
  offGet(OFF+'/api/v2/product/'+code+'.json?fields='+OFF_FIELDS)
  .then(function(d){
    var it=d&&d.status===1?offItem(d.product):null;
    if(!it){ if(SCAN) SCAN.busy=false;
      scanMsg(d&&d.status===1?'That product is listed without calories. Add it manually.':'Barcode '+code+' is not in the database. Add it manually.'); return; }
    closeScanner(); useFoodItem(it,'barcode');
  })
  .catch(function(e){ if(SCAN) SCAN.busy=false; scanMsg(lookupErr(e)); });
}
function openScanner(){
  closeScanner();
  var el=document.createElement('div');
  el.setAttribute('style','position:fixed;inset:0;z-index:90;background:#07080b;display:flex;flex-direction:column;padding:16px;gap:12px;overflow:auto');
  el.innerHTML='<div style="display:flex;justify-content:space-between;align-items:center">'
    + '<b style="font-size:17px">Scan a barcode</b><button class="btn" style="width:auto" data-s="close">Close</button></div>'
    + '<div style="position:relative;border-radius:16px;overflow:hidden;background:#000;aspect-ratio:4/3;max-height:46vh">'
    + '<video playsinline muted autoplay style="width:100%;height:100%;object-fit:cover"></video>'
    + '<div style="position:absolute;left:8%;right:8%;top:50%;height:2px;background:var(--acc);opacity:.85"></div></div>'
    + '<div data-s="msg" style="font-size:13.5px;color:var(--mut);line-height:1.5;min-height:40px">Starting the camera…</div>'
    + '<label class="btn" data-s="shot" style="display:none">Take a photo of the barcode instead'
    + '<input type="file" accept="image/*" capture="environment" style="position:absolute;left:-9999px;width:1px;height:1px;opacity:0"></label>'
    + '<div style="display:flex;gap:8px"><input data-s="num" type="text" inputmode="numeric" placeholder="or type the number under the bars" style="flex:1">'
    + '<button class="btn p" style="width:auto" data-s="go">Look up</button></div>';
  document.body.appendChild(el);
  var q=function(s){ return el.querySelector(s); };
  SCAN={el:el,msg:q('[data-s="msg"]'),video:q('video'),stream:null,timer:0,busy:false};
  q('[data-s="close"]').addEventListener('click',closeScanner);
  q('[data-s="go"]').addEventListener('click',function(){ lookupBarcode(q('[data-s="num"]').value); });
  q('[data-s="num"]').addEventListener('keydown',function(ev){ if(ev.key==='Enter') lookupBarcode(q('[data-s="num"]').value); });

  var det=null;
  try{ if('BarcodeDetector' in window) det=new window.BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e']}); }catch(e){ det=null; }
  var shot=q('[data-s="shot"]'), shotIn=shot.querySelector('input');
  if(det) shotIn.addEventListener('change',function(){
    var f=shotIn.files&&shotIn.files[0]; shotIn.value=''; if(!f) return;
    scanMsg('Reading the photo…');
    createImageBitmap(f).then(function(bmp){ return det.detect(bmp); })
      .then(function(r){ if(r&&r.length) lookupBarcode(r[0].rawValue); else scanMsg('No barcode found in that photo. Fill the frame with the bars and try again.'); })
      .catch(function(){ scanMsg('Could not read that photo. Type the number instead.'); });
  });
  var noLive=function(why){
    SCAN&&(SCAN.video.parentNode.style.display='none');
    if(det){ shot.style.display=''; scanMsg(why+' Take a photo of the barcode, or type the number.'); }
    else scanMsg(why+' Type the number printed under the bars.');
  };
  if(!det){ noLive('This browser cannot read barcodes from the camera.'); return; }
  if(!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia)){ noLive('The camera is not available on this page.'); return; }
  navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false}).then(function(stream){
    if(!SCAN||SCAN.el!==el){ stream.getTracks().forEach(function(t){ t.stop(); }); return; }
    SCAN.stream=stream; SCAN.video.srcObject=stream;
    var p=SCAN.video.play(); if(p&&p.catch) p.catch(function(){});
    scanMsg('Hold the barcode on the line.');
    SCAN.timer=setInterval(function(){
      if(!SCAN||SCAN.busy||SCAN.video.readyState<2) return;
      det.detect(SCAN.video).then(function(r){ if(r&&r.length&&SCAN&&!SCAN.busy) lookupBarcode(r[0].rawValue); }).catch(function(){});
    },300);
  }).catch(function(){ if(SCAN&&SCAN.el===el) noLive('The camera was blocked or is in use.'); });
}

function photoErr(e){
  var c=(e&&e.code)||'', m=(e&&e.message)||'';
  if(!S.sample) return m==='unreadable'?'The AI answered but not in a form I could read. Try again, or add it manually.':aiErr(e);
  return c==='images_unavailable'?'This view cannot send photos to Claude. It works in a desktop browser, and in the standalone app with a Gemini key.'
    : c==='not_granted'?'Claude was not allowed on this page, so the photo could not be read.'
    : c==='image_rejected'?'That image could not be used. Try a JPEG or PNG under 20 MB.'
    : c==='rate_limited'?'Rate limited. Try again in a minute.'
    : c==='refused'?'Claude declined that photo.'
    : m==='unreadable'?'Claude answered but not in a form I could read. Try again, or add it manually.'
    : m==='no-image'?'No photo came through from the picker. Try choosing it again.'
    : 'Could not estimate that photo'+(c?' ('+c+')':'')+'. Try again, or add it manually.';
}
function analyzePhoto(files,hint,keep){
  if(!S.sample&&!aiKey()){ S.food.err='Photo estimates need an AI key. Add one in You, Settings.'; S.view='food'; render(); return; }
  S.food.analyzing=true; S.food.err='';
  if(!keep) S.food.pending=null;
  S.view='food'; render();

  var blobs=[], thumbs=[], prep=Promise.resolve();
  if(files&&files.length){
    Array.prototype.slice.call(files,0,3).forEach(function(f){
      prep=prep
        .then(function(){ return shrink(f,160,0.6,true).catch(function(){ return ''; }); })   /* a thumbnail is optional */
        .then(function(t){ if(t) thumbs.push(t);
          /* Claude resizes on its side, so send the original; Gemini gets a smaller copy when we can make one */
          return S.sample?f:shrink(f,1200,0.85,false).catch(function(){ return f; }); })
        .then(function(b){ blobs.push(b); });
    });
  } else if(keep&&S.food.pending){
    blobs=S.food.pending.blobs||[]; thumbs=S.food.pending.thumbs||[];
  }

  prep.then(function(){
    if(!blobs.length) throw new Error('no-image');
    if(!S.sample) return geminiCall(foodPrompt(hint),{images:blobs});
    return Promise.resolve(S.sample.limits?S.sample.limits():null).catch(function(){ return null; }).then(function(l){
      if(l&&!l.images){ var e=new Error('images'); e.code='images_unavailable'; throw e; }
      return S.sample(foodPrompt(hint),{images:blobs});
    });
  })
  .then(function(res){
    var d=looseJSON(res&&res.text);
    if(!d) throw new Error('unreadable');
    var items=prepItems(d.items);
    var pd={
      name:String(d.name||'Meal'),
      items:items, blobs:blobs, thumbs:thumbs, thumb:thumbs[0]||'',
      low:Math.round(num(d.low_kcal)), high:Math.round(num(d.high_kcal)),
      confidence:String(d.confidence||''), assumptions:String(d.assumptions||''),
      toImprove:String(d.to_improve||''), hint:hint||'', source:'photo',
      kcal:0,protein:0,carbs:0,fat:0
    };
    if(items.length) recalc(pd);
    S.food.analyzing=false; S.food.pending=pd; render();
  })
  .catch(function(e){
    S.food.analyzing=false; S.food.err=photoErr(e); render();
  });
}

function viewFood(){
  if(S.food.pending) return mealEditor(S.food.pending);

function musclesFor(name){
  var n=String(name||'');
  for(var i=0;i<EXMAP.length;i++) if(EXMAP[i][0].test(n)) return EXMAP[i][1];
  return null;
}
/* score = sets completed, doubled when every set reached the top of its rep range */
function muscleScores(ses){
  var out={};
  (ses.ex||[]).forEach(function(e){
    if(e.kind==='protocol') return;
    var w=musclesFor(e.name); if(!w) return;
    var done=(e.sets||[]).filter(function(x){ return x.done; });
    if(!done.length) return;
    var top=topRep((e.target&&e.target.reps)||'');
    var hit=done.filter(function(x){
      var r=String(x.rir==null?'':x.rir).trim();
      if(r!=='') return num(x.rir)<=1;            /* a reported RIR beats guessing from reps */
      return top>0&&num(x.reps)>=top;
    }).length;
    var pts=done.length*(1+(done.length?hit/done.length:0));
    Object.keys(w).forEach(function(m){ out[m]=(out[m]||0)+pts*w[m]; });
  });
  return out;
}
