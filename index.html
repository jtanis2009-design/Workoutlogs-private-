var BACKUP_SETS=['days','routines','sessions','meals','weights','skips','chars','checkins','water','measures'];
function buildBackup(){
  var out={app:'Workout Log',format:1,exported:new Date().toISOString(),
    settings:S.settings,profile:S.profile};
  BACKUP_SETS.forEach(function(k){ out[k]=store(k); });
  return out;
}
function backupSummary(b){
  return [(b.sessions||[]).length+' sessions',(b.days||[]).length+' dated workouts',
    (b.routines||[]).length+' routines',(b.meals||[]).length+' meals',
    (b.weights||[]).length+' weigh-ins'].join(', ');
}
function hosted(){ return !!(window.claude&&typeof window.claude.use==='function'); }
function markBackup(){ try{ localStorage.setItem('wl_lastbackup',String(Date.now())); }catch(e){} }
function backupAge(){
  var t=0; try{ t=num(localStorage.getItem('wl_lastbackup')); }catch(e){}
  return t?Math.floor((Date.now()-t)/86400000):null;
}
function exportData(){
  var json=JSON.stringify(buildBackup(),null,1), name='workout-log-'+ymd()+'.json';
  var viaLink=function(){
    try{
      var url=URL.createObjectURL(new Blob([json],{type:'application/json'}));
      var a=document.createElement('a'); a.href=url; a.download=name;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function(){ URL.revokeObjectURL(url); },4000);
      markBackup(); toast('Backup saved to your downloads'); render();
    }catch(e){ toast('Could not save the backup here'); }
  };
  if(!hosted()){ viaLink(); return; }
  window.claude.use('downloads').then(function(dl){
    if(!dl) throw new Error('nodl');
    return dl.save({filename:name,data:json});
  }).then(function(){ markBackup(); toast('Backup saved'); })
  .catch(function(){
    try{
      navigator.clipboard.writeText(json).then(function(){ toast('Backup copied to the clipboard'); },
        function(){ toast('Could not save the backup here'); });
    }catch(e){ toast('Could not save the backup here'); }
  });
}
function applyBackup(b,mode){
  if(!b||typeof b!=='object') { toast('That file is not a Workout Log backup'); return; }
  if(!b.sessions&&!b.days&&!b.routines){ toast('That file has no workout data in it'); return; }
  var n=0;
  BACKUP_SETS.forEach(function(k){
    var incoming=b[k]||[];
    if(mode==='replace') store(k).slice().forEach(function(r){ drop(k,r.id); });
    incoming.forEach(function(r){
      if(!r||!r.id) return;
      if(mode==='merge'&&byId(k,r.id)) return;      /* keep what is already here */
      put(k,r,true); n++;
    });
  });
  if(b.profile) saveProfile(b.profile);
  if(b.settings){ S.settings=b.settings; saveSettings(); }
  S.importing=null; render();
  toast('Restored '+n+' records');
}
function readBackupFile(f){
  var r=new FileReader();
  r.onload=function(){
    var b; try{ b=JSON.parse(String(r.result)); }catch(e){ toast('That file is not valid JSON'); return; }
    S.importing=b; render();
  };
  r.onerror=function(){ toast('Could not read that file'); };
  r.readAsText(f);
}

  try{

      new Notification(title,{body:body,icon:'icon-192.png',tag:'wl'});

    }

}
function inQuiet(){
  var f=num(S.profile.quietFrom), t=num(S.profile.quietTo);

}
/* nudges only fire while the page is open — there is no background worker here */
function checkNudge(){
  if(!S.profile.remind||inQuiet()) return;
  var every=Math.max(1,num(S.profile.remindEvery)||3)*3600000;
  if(Date.now()-(S.lastNudge||0)<every) return;
  var d=ymd(), p=plannedFor(d);
  if(sessionOn(d)||skipOn(d)||!p||!(p.exercises||[]).length) return;
  S.lastNudge=Date.now();

  if(!notify('Workout Log',msg)) toast(msg);
}

function applyTheme(){
  var ms=milestones();
  var t=THEMES.filter(function(x){ return x.id===(S.profile.theme||'red'); })[0]||THEMES[0];
  if(!unlocked(t,ms)) t=THEMES[0];
  try{
    document.documentElement.style.setProperty('--acc',t.acc);
    document.documentElement.style.setProperty('--acc-d',t.ink);
  }catch(e){}
}

function squareThumb(file,size,q){
  return new Promise(function(res,rej){
    var url=URL.createObjectURL(file), img=new Image();
    img.onload=function(){
      var m=Math.min(img.width,img.height);
      var c=document.createElement('canvas'); c.width=c.height=size;
      c.getContext('2d').drawImage(img,(img.width-m)/2,(img.height-m)/2,m,m,0,0,size,size);
      URL.revokeObjectURL(url);
      try{ res(c.toDataURL('image/jpeg',q)); }catch(e){ rej(e); }
    };
    img.onerror=function(){ URL.revokeObjectURL(url); rej(new Error('bad image')); };
    img.src=url;
  });
}
function avatarHTML(size){
  var a=String(S.profile.avatar||'');
  if(a.indexOf('data:')===0)
    return '<img src="'+esc(a)+'" alt="" style="width:'+size+'px;height:'+size+'px">';
  if(a.indexOf('look:')===0){ var al=lookById(a.slice(5)); if(al&&unlocked(al,milestones())) return pixArt('lk_'+al.id,size); }
  if(a.indexOf('char:')===0){
    var c=CHARS.filter(function(x){ return x.id===(CHAR_MOVED[a.slice(5)]||a.slice(5)); })[0];
    if(c&&unlocked(c,milestones())) return spriteSVG(c.id,size,true);
  }
  return spriteSVG(activeChar().id,size);
}

function isoWeek(d){
  var t=new Date(d.getFullYear(),d.getMonth(),d.getDate());
  t.setDate(t.getDate()+3-((t.getDay()+6)%7));
  var first=new Date(t.getFullYear(),0,4);
  return t.getFullYear()+'-'+Math.round(((t-first)/86400000-3+((first.getDay()+6)%7))/7);
}
function daysTrained(a,b){
  var d={}; finished().forEach(function(s){ if(s.finishedAt>=a&&s.finishedAt<b) d[ymd(new Date(s.finishedAt))]=1; });
  return Object.keys(d).length;
}

function doubleLogs(){
  var c={}, cut=Date.now()-21*864e5;
  finished().forEach(function(s){ if(s.finishedAt>=cut){ var k=ymd(new Date(s.finishedAt)); c[k]=(c[k]||0)+1; } });
  return Object.keys(c).filter(function(k){ return c[k]>1; }).sort();
}
function weeksOnTarget(){
  var target=Math.max(1,num(S.profile.weekTarget)||3), ws=weekStart(), n=0, pausedW=0;
  var pause=String(S.profile.pauseUntil||'');
  for(var i=0;i<12;i++){
    var a=new Date(ws.getFullYear(),ws.getMonth(),ws.getDate()-i*7);
    var b=new Date(a.getFullYear(),a.getMonth(),a.getDate()+7);
    if(pause&&fromYmd(pause).getTime()>=a.getTime()){ n++; pausedW++; continue; }
    if(daysTrained(a.getTime(),b.getTime())>=target) n++;

}

  if(MSC.v&&Date.now()-MSC.t<400) return MSC.v;

function milestonesRaw(){
  var fin=finished();
  var weeks={}; fin.forEach(function(s){ weeks[isoWeek(new Date(s.finishedAt))]=1; });
  var streak=0, cur=new Date();
  for(var i=0;i<104;i++){
    var w=isoWeek(new Date(cur.getFullYear(),cur.getMonth(),cur.getDate()-i*7));
    if(weeks[w]) streak++; else if(i>0) break;
  }
  var byWeek={}; fin.forEach(function(s){
    var w=isoWeek(new Date(s.finishedAt)); byWeek[w]=(byWeek[w]||0)+volume(s);
  });
  var bestWeek=0; Object.keys(byWeek).forEach(function(k){ if(byWeek[k]>bestWeek) bestWeek=byWeek[k]; });
  var top=0; fin.forEach(function(s){ (s.ex||[]).forEach(function(e){
    (e.sets||[]).forEach(function(x){ if(x.done&&num(x.kg)>top) top=num(x.kg); }); }); });
  var fd={}; S.meals.forEach(function(m){ fd[m.date]=1; });
  return {sessions:fin.length,streak:streak,onTarget:weeksOnTarget().weeks,bestWeek:Math.round(bestWeek),
    topSet:top,foodDays:Object.keys(fd).length,weighIns:(S.weights||[]).length,checkins:(S.checkins||[]).length,prs:totalPRs(),
    volume:Math.round(fin.reduce(function(a,s){ return a+volume(s); },0))};

function hashStr(s){ var h=5381,i=s.length; while(i) h=(h*33)^s.charCodeAt(--i); return (h>>>0).toString(36)+'.'+s.length; }

function fbReq(url,opts){

      if(!r.ok){

        e.status=r.status; e.code=String((er&&(er.status||er.message))||''); e.fb=String((er&&er.message)||'');

function fbPost(url,body,token){

    },function(e){

function authErr(e){

  return /EMAIL_EXISTS/.test(c)?'That email already has an account. Log in instead.'
    : /INVALID_LOGIN_CREDENTIALS|INVALID_PASSWORD|EMAIL_NOT_FOUND/.test(c)?'Email or password is not right.'
    : /INVALID_EMAIL|MISSING_EMAIL/.test(c)?'That does not look like an email address.'
    : /WEAK_PASSWORD|MISSING_PASSWORD/.test(c)?'Use a password of at least 6 characters.'
    : /TOO_MANY_ATTEMPTS/.test(c)?'Too many tries. Wait a few minutes.'
    : /OPERATION_NOT_ALLOWED|CONFIGURATION_NOT_FOUND|ADMIN_ONLY/.test(c)?'Email login is not switched on in Firebase yet (Authentication, Sign-in method).'
    : /USER_DISABLED/.test(c)?'This account has been disabled.'
    : /API_KEY|PERMISSION_DENIED/.test(c)?'Firebase refused this app’s key ('+c.slice(0,60)+').'

function syncErr(e){
  if(e&&e.expired) return 'You were signed out. Log in again to keep syncing.';
  if(!e||!e.status) return 'Offline. Changes are kept on this device and upload when you are back online.';
  if(e.status===403) return 'Signed in, but the database rules block saving. Paste the rules into Firestore, Rules.';
  if(e.status===404) return 'Signed in, but the Firestore database has not been created yet.';
  if(e.status===429) return 'Sync is being rate limited. It will retry.';
  return 'Sync failed ('+e.status+' '+(e.code||'')+'). It will retry.';
}

/* ---- what is on this device, one string per record ---- */
function syncSnapshot(){
  var m={};
  SYNC_COLLS.forEach(function(c){
    var list=c==='chat'?S.chat.slice(-60):store(c);
    (list||[]).forEach(function(o){ if(o&&o.id!=null&&o.id!=='') m[c+'/'+o.id]=JSON.stringify(o); });
  });
  m['profile/me']=JSON.stringify(S.profile||{});
  m['settings/app']=JSON.stringify(S.settings||{});
  return m;
}
/* dirty = differs from what the cloud last confirmed. da[key]={h:hash now,t:when it last changed} */
function markDirty(snap){
  var sh=lsJ('wl_sync_sh',{}), da=lsJ('wl_sync_da',{}), now=Date.now(), k, h;
  for(k in snap){
    h=hashStr(snap[k]);
    if(sh[k]===h){ if(da[k]) delete da[k]; }
    else if(!da[k]||da[k].h!==h) da[k]={h:h,t:now};
  }
  for(k in sh){ if(snap[k]==null&&(!da[k]||da[k].h!=='x')) da[k]={h:'x',t:now}; }
  for(k in da){ if(snap[k]==null&&sh[k]==null) delete da[k]; }
  lsS('wl_sync_da',da);
  return {sh:sh,da:da};
}
function pendingCount(){ try{ return Object.keys(markDirty(syncSnapshot()).da).length; }catch(e){ return 0; } }

function fbDocs(){ return 'projects/'+FB.projectId+'/databases/(default)/documents'; }
function docId(key){ return key.replace(/[^A-Za-z0-9_-]/g,function(c){ return '~'+c.charCodeAt(0).toString(16); }); }

function pullChanges(tok){
  var out=[], cur=lsJ('wl_sync_cur','');
  var page=function(){
    var q={from:[{collectionId:'items'}],orderBy:[{field:{fieldPath:'s'},direction:'ASCENDING'}],limit:300};
    if(cur) q.where={fieldFilter:{field:{fieldPath:'s'},op:'GREATER_THAN',value:{timestampValue:cur}}};
    return fbPost('https://firestore.googleapis.com/v1/'+fbDocs()+'/users/'+AUTH.uid+':runQuery',{structuredQuery:q},tok)
    .then(function(rows){
      var n=0;
      (rows||[]).forEach(function(r){
        var f=r&&r.document&&r.document.fields; if(!f||!f.k) return;
        n++;
        out.push({key:f.k.stringValue,j:f.j?f.j.stringValue:null,t:num(f.t&&f.t.integerValue),d:!!(f.d&&f.d.booleanValue)});
        if(f.s&&f.s.timestampValue) cur=f.s.timestampValue;
      });
      return n>=300?page():{docs:out,cur:cur};
    });
  };
  return page();
}
function setLocal(key,obj){
  var i=key.indexOf('/'), coll=key.slice(0,i), id=key.slice(i+1);
  if(coll==='profile'){ S.profile=obj||{}; return; }
  if(coll==='settings'){ if(obj) S.settings=obj; return; }
  if(SYNC_COLLS.indexOf(coll)<0) return;
  var out=[], hit=false;
  (S[coll]||[]).forEach(function(o){
    if(String(o.id)===id){ hit=true; if(obj) out.push(obj); } else out.push(o);
  });
  if(!hit&&obj) out.push(obj);
  S[coll]=out;
}
function applyRemote(docs,first){
  if(!docs.length) return false;
  var snap=syncSnapshot(), st=markDirty(snap), sh=st.sh, da=st.da, changed=false;
  docs.forEach(function(d){
    var loc=snap[d.key], dirty=da[d.key], obj=null;
    if(!d.d&&d.j==null) return;
    if(!d.d&&loc===d.j){ sh[d.key]=hashStr(d.j); delete da[d.key]; return; }
    if(d.d&&loc==null){ delete sh[d.key]; delete da[d.key]; return; }
    if(dirty&&!first&&dirty.t>=d.t) return;            /* this device changed it more recently: ours goes up instead */
    if(!d.d){ try{ obj=JSON.parse(d.j); }catch(e){ return; } }
    setLocal(d.key,obj);
    if(d.d) delete sh[d.key]; else sh[d.key]=hashStr(d.j);
    delete da[d.key]; snap[d.key]=d.d?null:d.j;
    changed=true;
  });
  lsS('wl_sync_sh',sh); lsS('wl_sync_da',da);
  if(changed){
    S.days=sortDays(S.days);
    S.chat=S.chat.slice().sort(function(a,b){ return (a.at||0)-(b.at||0); });
    SY.applying=true; try{ saveLocal(); } finally{ SY.applying=false; }
    try{ applyTheme(); }catch(e){}
    setTimeout(normalizeNames,0);
  }
  return changed;
}
function pushChanges(tok){
  var snap=syncSnapshot(), st=markDirty(snap), keys=Object.keys(st.da);
  if(!keys.length) return Promise.resolve(0);
  var base=fbDocs()+'/users/'+AUTH.uid+'/items/', chunks=[], sent=0;
  for(var i=0;i<keys.length;i+=100) chunks.push(keys.slice(i,i+100));
  var run=function(ci){
    if(ci>=chunks.length) return Promise.resolve(sent);
    var part=chunks[ci], stamp={};
    var writes=part.map(function(k){
      var gone=snap[k]==null, f={k:{stringValue:k},t:{integerValue:String(st.da[k].t)},d:{booleanValue:gone}};
      if(!gone) f.j={stringValue:snap[k]};
      stamp[k]=st.da[k].h;
      return {update:{name:base+docId(k),fields:f},updateTransforms:[{fieldPath:'s',setToServerValue:'REQUEST_TIME'}]};
    });
    return fbPost('https://firestore.googleapis.com/v1/'+fbDocs()+':commit',{writes:writes},tok).then(function(){
      var sh=lsJ('wl_sync_sh',{}), da=lsJ('wl_sync_da',{});
      part.forEach(function(k){
        if(stamp[k]==='x') delete sh[k]; else sh[k]=stamp[k];
        if(da[k]&&da[k].h===stamp[k]) delete da[k];       /* typed again meanwhile? then it stays queued */
      });
      lsS('wl_sync_sh',sh); lsS('wl_sync_da',da);
      sent+=part.length;
      return run(ci+1);
    });
  };
  return run(0);
}

function syncNow(){

/* ================= DELOAD ALERT ================= */
function deloadState(){
  var now=Date.now(), out={due:false,lifts:[],checked:0};
  var last=S.profile.lastDeload||'';
  if(last){ out.weeksSince=(now-fromYmd(last).getTime())/(7*864e5);
    if(out.weeksSince<4){ out.recent=true; out.upcoming=last>ymd(); return out; } }
  var recent=finished().filter(function(s){ return s.finishedAt>=now-28*864e5; });
  if(recent.length<4) return out;
  var cutNow=cutting();
  var names={};
  recent.forEach(function(s){ (s.ex||[]).forEach(function(e){ if(e.kind!=='protocol'&&!isTimed(e)) names[exKey(e.name)]=e.name; }); });
  Object.keys(names).forEach(function(k){
    var rows=progData(names[k]), pts=rows.filter(function(r){ return r.e1rm>0; });
    if(pts.length<3) return;
    out.checked++;
    var st=stallInfo(rows), a=pts[pts.length-1].e1rm, b=pts[pts.length-2].e1rm, dp=b?(b-a)/b*100:0;
    if(dp>=(cutNow?5:3)) out.lifts.push({name:names[k],why:'down '+fmt(Math.round(dp))+'% on last time'});
    else if(st&&st.stalled&&!cutNow) out.lifts.push({name:names[k],why:'flat for about '+fmt(Math.max(1,Math.round(st.weeks)))+' weeks'});
  });
  out.due=out.lifts.length>=2&&out.lifts.length>=Math.ceil(out.checked*0.4);
  out.planned=plannedDeload(); if(out.planned) out.due=true;
  if(out.due&&S.profile.deloadSnooze&&S.profile.deloadSnooze>=ymd()) out.snoozed=true;
  return out;
}

    else { before=JSON.parse(JSON.stringify(p)); doc=JSON.parse(JSON.stringify(p)); }

/* ================= PR WALL ================= */
var PRW={k:'',v:null};
function prWall(){
  var fin=finished(), sets=0;
  fin.forEach(function(s){ (s.ex||[]).forEach(function(e){ (e.sets||[]).forEach(function(x){ if(x.done) sets+=num(x.kg)+num(x.reps); }); (e.segs||[]).forEach(function(x){ if(x.done) sets++; }); }); });
  var k=fin.length+':'+(fin[0]?fin[0].finishedAt:0)+':'+sets;
  if(PRW.k===k) return PRW.v;
  var timeline=[], best={};
  fin.slice().sort(function(a,b){ return a.finishedAt-b.finishedAt; }).forEach(function(s){
    var p=sessionPRs(s);
    (s.ex||[]).forEach(function(e){
      if(p[e.id]) timeline.push({at:s.finishedAt,name:e.name,text:p[e.id].text,was:p[e.id].was,sid:s.id,eid:e.id});
      if(e.kind==='protocol') return;
      var key=exKey(e.name), b=best[key]||(best[key]={name:e.name,kg:0,reps:0,kgAt:0,e1:0,e1Set:null,secs:0,secsAt:0,timed:isTimed(e)});
      b.name=e.name;
      (e.sets||[]).forEach(function(x){
        if(!x.done||x.warm) return;
        var kg=num(x.kg), r=num(x.reps);
        if(b.timed){ if(r>b.secs){ b.secs=r; b.secsAt=s.finishedAt; } return; }
        if(kg>b.kg||(kg===b.kg&&r>b.reps)){ b.kg=kg; b.reps=r; b.kgAt=s.finishedAt; }
        var v=e1rm(e,x); if(v>b.e1){ b.e1=v; b.e1Set={kg:kg,reps:r}; }
      });
    });
  });
  var list=Object.keys(best).map(function(k2){ return best[k2]; }).filter(function(b){ return b.kg||b.secs; })
    .sort(function(a,b){ return Math.max(b.kgAt,b.secsAt)-Math.max(a.kgAt,a.secsAt); });
  PRW={k:k,v:{timeline:timeline.reverse(),best:list}};
  return PRW.v;
}

    (e.sets||[]).forEach(function(x){ if(x.done&&num(x.kg)>0) ws[Math.round(num(x.kg)*100)/100]=1; }); }); });
  var list=Object.keys(ws).map(Number).sort(function(a,b){ return a-b; }), best=0;

function cutting(){ try{ var b=bodyState(); return b.ready&&b.phase==='cutting'; }catch(e){ return false; } }
function lossWarning(){
  var b; try{ b=bodyState(); }catch(e){ return null; }

  var extra=Math.round(((Math.abs(b.pct)-0.75)/100*b.kg*7700/7)/50)*50;

function labelPrompt(){
  return 'This photo shows a food package, mostly its nutrition table (Dutch: "Voedingswaarde", "per 100 g", "per portie"). Read it.\n'
    + 'Give the values per 100 g (or per 100 ml). If only per-portion values are printed, convert them using the portion size. If energy is only in kJ, divide by 4.184.\n'
    + 'Name: the product name and brand as printed on the front if visible, otherwise a short description.\n'
    + 'Reply with ONLY this JSON, no prose: {"name":"","per100":{"kcal":0,"protein":0,"carbs":0,"fat":0},"serving_g":0,"readable":true}\n'
    + 'Set readable to false if there is no legible nutrition table.';
}
function myFoodItem(f,g){
  g=num(g)||num(f.serving)||100;
  var p={kcal:num(f.k100)/100,protein:num(f.p100)/100,carbs:num(f.c100)/100,fat:num(f.f100)/100};
  return {name:f.name,grams:g,k100:Math.round(num(f.k100)),p100:Math.round(num(f.p100)*10)/10,serving:num(f.serving)?fmt(num(f.serving))+' g':'',
    kcal:Math.round(p.kcal*g),protein:Math.round(p.protein*g*10)/10,carbs:Math.round(p.carbs*g*10)/10,fat:Math.round(p.fat*g*10)/10,per:p,mine:true};
}
function myFoodMatches(q){

  var w=q.split(/\s+/);
  return (S.profile.myFoods||[]).filter(function(f){ var n=String(f.name).toLowerCase(); return w.every(function(x){ return n.indexOf(x)>=0; }); })
    .slice(0,4).map(function(f){ return myFoodItem(f); });
}
function saveMyFood(f){

function analyzeLabel(file){
  if(!aiKey()){ S.food.err='Reading labels needs an AI key. Add one in You, Settings.'; S.view='food'; render(); return; }
  S.food.analyzing=true; S.food.err=''; S.view='food'; render();
  shrink(file,1400,0.9,false).catch(function(){ return file; })
  .then(function(b){ return geminiCall(labelPrompt(),{images:[b],json:true}); })
  .then(function(res){
    var d=looseJSON(res&&res.text), p=d&&d.per100;
    if(!d||d.readable===false||!p||!num(p.kcal)) throw new Error('label');
    var f={name:String(d.name||'Product').trim().slice(0,80),k100:num(p.kcal),p100:num(p.protein),c100:num(p.carbs),f100:num(p.fat),serving:num(d.serving_g)>0&&num(d.serving_g)<1500?num(d.serving_g):0};

function plannedDeload(){
  var every=num(S.profile.deloadEvery); if(!every) return null;
  var fin=finished(); if(fin.length<4) return null;

/* ================= VS LAST TIME, WHILE LOGGING ================= */
function vsLast(e){
  if(e.kind==='protocol') return '';
  var h=historyFor(e.name); if(!h.length) return '';
  var last=h[0], done=(e.sets||[]).filter(function(x){ return x.done&&!x.warm; });
  var timed=isTimed(e), unit=timed?' s':'';
  var lastTxt=last.sets.map(function(x){ return timed?fmt(x.reps)+'s':fmt(x.kg)+'×'+fmt(x.reps); }).join(' · ');
  var out='<div class="vsl"><span>Last time: '+esc(lastTxt)+'</span>';
  if(done.length){
    var nowV=0,lastV=0,nowR=0,lastR=0;
    done.forEach(function(x,i){ nowV+=num(x.kg)*num(x.reps); nowR+=num(x.reps); var l=last.sets[i]; if(l){ lastV+=l.kg*l.reps; lastR+=l.reps; } });
    var cmp='';
    if(!timed&&lastV>0&&nowV>0){ var pc=Math.round((nowV-lastV)/lastV*100); cmp=(pc>0?'+':'')+pc+'% volume'; }
    else if(lastR>0){ var dr=nowR-lastR; cmp=(dr>0?'+':'')+fmt(dr)+(timed?' s':' reps'); }
    if(cmp) out+='<b class="'+(/^\+/.test(cmp)?'up':/^-/.test(cmp)?'dn':'')+'">'+esc(cmp)+' so far</b>';
  }
  return out+'</div>';
}

/* ================= CSV EXPORT (Strong format, which Hevy and others import) ================= */
function csvCell(v){ v=String(v==null?'':v); return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; }
function strongCSV(){
  var rows=[['Date','Workout Name','Duration','Exercise Name','Set Order','Weight','Reps','Distance','Seconds','Notes','Workout Notes','RPE']];
  var p2=function(n){ return (n<10?'0':'')+n; };
  finished().slice().sort(function(a,b){ return a.finishedAt-b.finishedAt; }).forEach(function(s){
    var st=new Date(s.startedAt||s.finishedAt), date=st.getFullYear()+'-'+p2(st.getMonth()+1)+'-'+p2(st.getDate())+' '+p2(st.getHours())+':'+p2(st.getMinutes())+':'+p2(st.getSeconds());
    var mins=Math.max(1,Math.round(((s.finishedAt||0)-(s.startedAt||s.finishedAt||0))/60000)), dur=(mins>=60?Math.floor(mins/60)+'h ':'')+(mins%60)+'m';
    (s.ex||[]).forEach(function(e){
      if(e.kind==='protocol'){
        (e.segs||[]).forEach(function(x,i){ if(!x.done) return; var n=segNums(e,x);
          rows.push([date,s.dayName||'Workout',dur,e.name,i+1,'','',n.kmh&&n.min?Math.round(n.kmh*n.min/60*100)/100:'',n.min?Math.round(n.min*60):'',x.label||'',s.notes||'','']); });
        return;
      }
      var timed=isTimed(e), k=0;
      (e.sets||[]).forEach(function(x){ if(!x.done) return; k++;
        var rpe=x.rir!=null&&x.rir!==''?Math.max(1,10-num(x.rir)):(x.fail?10:'');
        rows.push([date,s.dayName||'Workout',dur,e.name,x.warm?'W':k,num(x.kg)?num(x.kg):(timed?'':0),timed?'':num(x.reps),'',timed?num(x.reps):'',e.comment||'',s.notes||'',rpe]); });
    });
  });
  return rows.map(function(r){ return r.map(csvCell).join(','); }).join('\n');
}
function exportCSV(){
  var txt=strongCSV(), n=txt.split('\n').length-1;
  if(!n){ toast('No finished workouts to export yet'); return; }
  try{
    var b=new Blob([txt],{type:'text/csv'}), u=URL.createObjectURL(b), a=document.createElement('a');
    a.href=u; a.download='workout-log-'+ymd()+'.csv'; document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(u); a.remove(); },1500);
    toast(n+' sets exported');
  }catch(e){ toast('Could not save the file here'); }
}

/* ================= PROTEIN GAP HELPER ================= */
function foodCandidates(){
  var g={}, cut=ymd(new Date(Date.now()-60*864e5));
  (S.profile.favMeals||[]).concat(S.meals.filter(function(m){ return m.date>=cut; })).forEach(function(m){
    var k=String(m.name||'').trim().toLowerCase(), p=num(m.protein), kc=num(m.kcal);
    if(!k||p<8||kc<=0||g[k]) return;
    g[k]=mealTemplate(m);
  });
  return Object.keys(g).map(function(k){ return g[k]; });
}
/* the smallest, leanest combination of your own foods that closes the gap */
function proteinGap(d){
  var pg=num(S.profile.proteinGoal); if(!pg) return null;
  var t=dayTotals(d), gap=Math.round(pg-t.protein); if(gap<10) return {done:true,gap:gap};
  var kcLeft=num(S.profile.calGoal)?num(S.profile.calGoal)-t.kcal:9999;
  var c=foodCandidates(); if(!c.length) return {gap:gap,opts:[]};
  /* lean foods first; pizza-style meals only if nothing leaner exists */
  var lean=c.filter(function(x){ return x.protein/x.kcal>=0.06; }); if(lean.length>=2) c=lean;
  c=c.sort(function(a,b){ return b.protein/b.kcal-a.protein/a.kcal; }).slice(0,12);
  var combos=[];
  c.forEach(function(a,i){ combos.push([a]);
    c.forEach(function(b,j){ if(j<i) return; combos.push([a,b]);
      c.forEach(function(d2,k2){ if(k2<j) return; combos.push([a,b,d2]); }); }); });
  var scored=combos.map(function(cb){
    var p=cb.reduce(function(s,x){ return s+x.protein; },0), k=cb.reduce(function(s,x){ return s+x.kcal; },0);
    var short=Math.max(0,gap-p), over=Math.max(0,k-kcLeft), extra=Math.max(0,p-gap-25);
    var distinct={}; cb.forEach(function(x){ distinct[x.name]=1; }); var reps=cb.length-Object.keys(distinct).length;
    return {foods:cb,protein:p,kcal:k,score:short*10+over*0.6+k*0.15+extra*2+(cb.length-1)*15+reps*25};
  }).sort(function(x,y){ return x.score-y.score; });
  var seen={}, opts=[];
  scored.forEach(function(o){                     /* three genuinely different ideas, not the same foods reshuffled */
    var names={}; o.foods.forEach(function(f){ names[f.name]=1; });
    var key=Object.keys(names).sort().join('+'); if(seen[key]||opts.length>=3) return; seen[key]=1;
    o.label=foodsLabel(o.foods); opts.push(o); });
  return {gap:gap,kcLeft:Math.round(kcLeft),opts:opts};
}
function foodsLabel(fs){
  var n={}, order=[]; fs.forEach(function(f){ if(!n[f.name]){ n[f.name]=0; order.push(f.name); } n[f.name]++; });
  return order.map(function(k){ return (n[k]>1?n[k]+'× ':'')+k; }).join(' + ');
}
function gapCard(d){
  if(d!==ymd()) return '';
  var pgap=proteinGap(d); if(!pgap) return '';
  if(pgap.done) return '';
  var hr=new Date().getHours(); if(hr<14&&!S.food.gapOpen) return '<div class="lbar" style="margin:-2px 0 12px"><span>'+pgap.gap+' g protein to go today.</span><button data-act="gap-open">Ideas</button></div>';
  S.food.gapList=pgap.opts;
  var h='<div class="card"><div class="card-b" style="padding-top:13px"><div style="display:flex;align-items:baseline;gap:8px"><b style="font-size:14.5px;flex:1">Protein to go</b>'
    + '<span style="font-weight:800;color:#3987e5">'+pgap.gap+' g</span></div>';
  if(!pgap.opts.length) h+='<div class="hint">Log a few meals with protein and I will suggest your own foods to close the gap.</div>';
  else {
    h+='<div style="font-size:12px;color:var(--mut2);margin:2px 0 6px">From what you usually eat'+(num(S.profile.calGoal)?', keeping inside your '+Math.max(0,pgap.kcLeft)+' kcal left':'')+':</div>';
    pgap.opts.forEach(function(o,i){
      h+='<button class="gapopt" data-act="gap-add" data-i="'+i+'"><span><b>'+esc(o.label)+'</b>'
        + '<small>'+o.protein+' g protein · '+o.kcal+' kcal'+(o.protein>=pgap.gap?'':' · '+(pgap.gap-o.protein)+' g short')+'</small></span><i>+ Add</i></button>';
    });
  }
  return h+'</div></div>';
}

/* ================= SUPERSETS (Quick mode) ================= */
function primaryOf(name){ var w=musclesFor(name)||{}, mx=0; Object.keys(w).forEach(function(m){ if(w[m]>mx) mx=w[m]; });
  return Object.keys(w).filter(function(m){ return w[m]>=mx*0.85; }); }
function pairSupersets(ses){
  var lifts=ses.ex.filter(function(e){ return e.kind!=='protocol'&&!(e.sets||[]).some(function(s){ return s.done; })&&!e.ss; });
  var used={}, letter=0;
  lifts.forEach(function(a,i){
    if(used[a.id]) return;
    var pa=primaryOf(a.name);
    for(var j=i+1;j<lifts.length;j++){
      var b=lifts[j]; if(used[b.id]) continue;
      var pb=primaryOf(b.name);
      if(pa.length&&pb.length&&!pa.some(function(m){ return pb.indexOf(m)>=0; })){
        var L='ABCD'[letter++]; used[a.id]=used[b.id]=1;
        a.ss=L+'1'; b.ss=L+'2';
        var ai=ses.ex.indexOf(a), bi=ses.ex.indexOf(b);
        if(bi!==ai+1){ ses.ex.splice(bi,1); ses.ex.splice(ses.ex.indexOf(a)+1,0,b); }   /* partners sit together */
        break;
      }
    }
  });
  return ses;
}
function ssPartner(ses,ei){
  var e=ses.ex[ei]; if(!e||!e.ss) return null;
  var want=e.ss[0]+(e.ss[1]==='1'?'2':'1');
  for(var i=0;i<ses.ex.length;i++) if(ses.ex[i].ss===want) return i;
  return null;
}

/* ================= CALENDAR EXPORT (.ics) ================= */
function icsEsc(s){ return String(s||'').replace(/\\/g,'\\\\').replace(/;/g,'\;').replace(/,/g,'\\,').replace(/\r?\n/g,'\\n'); }
function icsFold(line){ var out=[]; while(line.length>73){ out.push(line.slice(0,73)); line=' '+line.slice(73); } out.push(line); return out.join('\r\n'); }
function workoutTimeFor(ds){
  var t=String(S.profile.calTime||'18:00'), w=fromYmd(ds).getDay(), gh=gymDay(w);
  var start=hm(t)||1080, dur=num(S.profile.calDur)||75;
  if(gh){ var open=hm(gh[0]), close=hm(gh[1]);
    if(start+dur>close) start=Math.max(open+15,close-dur-15);    /* weekends close early: fit the session in */
    if(start<open) start=open+15; }
  return {start:start,dur:dur};
}
function buildICS(weeks){
  var L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Workout Log//EN','CALSCALE:GREGORIAN','METHOD:PUBLISH','X-WR-CALNAME:Workouts'];
  var stamp=new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+Z$/,'Z'), n=0, today=ymd();
  for(var i=0;i<(weeks||4)*7;i++){
    var ds=shiftYmd(today,i), p=plannedFor(ds);
    if(!p||!(p.exercises||[]).length||sessionOn(ds)) continue;
    var tm=workoutTimeFor(ds), d=fromYmd(ds);
    var st=new Date(d.getFullYear(),d.getMonth(),d.getDate(),Math.floor(tm.start/60),tm.start%60);
    var en=new Date(st.getTime()+tm.dur*60000);
    var f=function(x){ return x.getFullYear()+pad(x.getMonth()+1)+pad(x.getDate())+'T'+pad(x.getHours())+pad(x.getMinutes())+'00'; };
    var desc=(p.exercises||[]).map(function(e){ return '- '+e.name+(e.kind==='protocol'?' ('+(e.spec||'')+')':' '+(e.sets||'?')+' x '+(e.reps||'?')+(num(e.kg)?' @ '+fmt(num(e.kg))+' kg':'')); }).join('\n');
    L.push('BEGIN:VEVENT','UID:wl-'+ds+'@workoutlog','DTSTAMP:'+stamp,'DTSTART:'+f(st),'DTEND:'+f(en),
      icsFold('SUMMARY:'+icsEsc(p.name||'Workout')),icsFold('LOCATION:'+icsEsc(gym().name)),icsFold('DESCRIPTION:'+icsEsc(desc)),
      'BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+icsEsc(p.name||'Workout'),'TRIGGER:-PT60M','END:VALARM','END:VEVENT');
    n++;
  }
  L.push('END:VCALENDAR');
  return {text:L.join('\r\n')+'\r\n',n:n};
}
function exportICS(){
  var r=buildICS(4);
  if(!r.n){ toast('Nothing planned in the next 4 weeks'); return; }
  try{
    var url=URL.createObjectURL(new Blob([r.text],{type:'text/calendar'}));
    var a=document.createElement('a'); a.href=url; a.download='workouts-'+ymd()+'.ics';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); },4000);

  }catch(e){ toast('Could not make the calendar file here'); }
}

/* ================= TIMED HOLDS (dead hang, plank): the reps box holds seconds ================= */
function isTimed(e){ var l=exLib(e&&e.name); return !!(l&&l.load==='time'); }

/* ================= QUICK CHANGES DURING A WORKOUT ================= */
function liveSuggest(ses,ei){
  var cur=ses.ex[ei], inSes={}, out=[], seen={};
  (ses.ex||[]).forEach(function(e){ inSes[exKey(e.name)]=1; });
  var addN=function(n){ var k=exKey(n); if(!n||inSes[k]||seen[k]) return; seen[k]=1; out.push(n); };
  var mine=[];                                               /* your own exercises first, newest first */
  finished().forEach(function(s){ (s.ex||[]).forEach(function(e){ if(e.kind!=='protocol') mine.push(e.name); }); });
  S.routines.forEach(function(r){ (r.exercises||[]).forEach(function(e){ if(e.kind!=='protocol') mine.push(e.name); }); });
  if(cur&&cur.kind!=='protocol'){
    var lib=exLib(cur.name), w=musclesFor(cur.name)||{}, prim=Object.keys(w).filter(function(m){ return w[m]>=0.85; });
    mine.forEach(function(n){ var w2=musclesFor(n)||{}; if(prim.some(function(m){ return w2[m]>=0.85; })) addN(n); });
    if(lib) lib.alt.forEach(function(a){ if(EXBYID[a]) addN(EXBYID[a].name); });
    Object.keys(EXBYID).forEach(function(id){ var w3=musclesFor(EXBYID[id].name)||{};          /* then anything else for the same muscle */
      if(prim.some(function(m){ return w3[m]>=0.85; })) addN(EXBYID[id].name); });
  } else mine.forEach(addN);
  return out.slice(0,7);
}
/* a typed name: your own name for that exercise if you have one, else the library name, else as typed */
function typedExName(raw){
  raw=String(raw||'').trim(); if(!raw) return '';
  var fixed=fixTypos(raw), l=exLib(fixed)||exLib(raw);
  if(!l) return canonExName(titleCase(raw));
  var key='#'+l.id, own='';
  finished().concat(S.routines.map(function(r){ return {ex:r.exercises}; })).forEach(function(s){
    (s.ex||[]).forEach(function(e){ if(!own&&e.kind!=='protocol'&&exKey(e.name)===key) own=e.name; }); });
  return canonExName(own||l.name);
}
/* weight from your plan when there is no logged history yet */
function planKg(name){
  var key=exKey(name), kg='';
  S.routines.concat(S.days).forEach(function(d){ (d.exercises||[]).forEach(function(e){
    if(!kg&&e.kind!=='protocol'&&exKey(e.name)===key&&num(e.kg)) kg=fmt(num(e.kg)); }); });
  return kg;
}
function liveNewEx(name,like){
  var nm=name, lib=exLib(nm), timed=lib&&lib.load==='time';
  var n=Math.max(1,Math.min(15,like?like.n:3)), reps=(like&&like.reps)||(timed?'30-60':'8-12');
  var kg=lastKg(nm)||planKg(nm); if(!kg&&lib&&lib.load!=='kg') kg='0';
  var sg=suggest(nm,kg,reps,String(n),stepFor({name:nm,kg:kg}));
  var st=[]; for(var i=0;i<n;i++) st.push({kg:kg===''&&!sg.kg?'':fmt(sg.kg||num(kg)),reps:String(timed?topRep(reps):(num(reps)||topRep(reps))||''),rir:'',done:false});
  return {id:uid(),kind:'strength',name:nm,note:lib?lib.how.split('. ')[0]+'.':'',hint:sg.why||'',base:0,perSide:false,
    target:{sets:n,reps:reps,kg:num(kg)},sets:st,comment:''};
}
function liveChange(fn,msg){
  var s=active(); if(!s) return;
  var before=JSON.parse(JSON.stringify(s)), c=JSON.parse(JSON.stringify(s));
  if(fn(c)===false) return;
  UNDO={label:'live',items:[{coll:'sessions',id:s.id,before:before}]};
  S.liveMsg=msg; S.liveMenu=null; S.liveText='';
  put('sessions',c,true); render();
}
function liveSwap(ei,name,typed){
  name=String(name||'').trim(); if(!name) return;
  var s=active(); if(!s||!s.ex[ei]) return;
  if(typed&&isMuscleWord(name)){ toast('Abs is the muscle group. Pick an exercise, e.g. Abdominals or abdominal crunches.'); return; }
  var old=s.ex[ei], nm=typed?typedExName(name):name;
  liveChange(function(c){
    var e=c.ex[ei], done=(e.sets||[]).filter(function(x){ return x.done; }).length, left=(e.sets||[]).length-done;
    var nx=liveNewEx(nm,{n:Math.max(1,left||1),reps:e.kind==='protocol'?'':(e.target&&e.target.reps)||''});
    nx.t0=done?'':e.t0; 
    if(done){ e.sets=e.sets.filter(function(x){ return x.done; }); c.ex.splice(ei+1,0,nx); }   /* keep what you did, finish on the new one */
    else c.ex.splice(ei,1,nx);
  },(old.name+' → '+nm)+((old.sets||[]).some(function(x){ return x.done; })?' (done sets kept)':''));
}
function liveAdd(name,at,typed){
  name=String(name||'').trim(); if(!name) return;
  if(typed&&isMuscleWord(name)){ toast('Abs is the muscle group. Pick an exercise, e.g. Abdominals or abdominal crunches.'); return; }
  var nm=typed?typedExName(name):name;
  liveChange(function(c){
    var pos=at!=null?at:c.ex.length;
    if(at==null){ for(var i=c.ex.length-1;i>=0;i--){ if(c.ex[i].kind==='protocol') pos=i; else break; } }   /* before the finisher */
    var prev=c.ex[pos-1]&&c.ex[pos-1].kind!=='protocol'?c.ex[pos-1]:null;
    c.ex.splice(pos,0,liveNewEx(nm,prev&&!isTimed({name:nm})&&!isTimed(prev)?{n:prev.sets.length,reps:(prev.target&&prev.target.reps)||''}:null));
  },'Added '+nm);
}

      + '<div style="font-size:12px;margin-top:2px"><span style="color:var(--acc)">'+esc(rvp[e.id].text)+'</span> <span style="color:var(--mut2)">· '+esc(rvp[e.id].was)+'</span>'+prShareBtn(ses.id,e.id)+'</div></div>'; });
    h+='</div></div>';
  }

function viewPlan(){
  var now=new Date();
  if(!S.cal) S.cal={y:now.getFullYear(),m:now.getMonth()};
  if(!S.sel) S.sel=ymd(now);
  var y=S.cal.y, m=S.cal.m;
  var first=new Date(y,m,1), off=(first.getDay()+6)%7;
  var dim=new Date(y,m+1,0).getDate(), rows=Math.ceil((off+dim)/7);

  var h='<div class="card"><div class="card-b" style="padding:15px">'
    + '<div class="cal-h"><button class="cal-nav" data-act="cal" data-d="-1">‹</button>'
    + '<b>'+first.toLocaleDateString(LOC(),{month:'long',year:'numeric'})+'</b>'
    + '<button class="cal-nav" data-act="cal-today">•</button>'
    + '<button class="cal-nav" data-act="cal" data-d="1">›</button></div>'
    + '<div class="dow"><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span><span>S</span></div>'
    + '<div class="grid">';
  for(var i=0;i<rows*7;i++){
    var d=new Date(y,m,1-off+i), ds=ymd(d);
    var out=d.getMonth()!==m, p=plannedFor(ds), log=sessionOn(ds), sk=skipOn(ds);
    var hasWork=!!(p&&(p.exercises||[]).length);
    var slot=!!(p&&!hasWork&&!/^rest/i.test(p.name||''));
    var cls='cell'+(out?' out':'')
      + (!out&&mainDays(ds).indexOf(d.getDay())>=0?' main':'')
      + (!out&&hasWork&&!log?' has':'')
      + (!out&&log?' done':'')
      + (!out&&!log&&sk?' skip':'')
      + (ds===ymd(now)?' today':'')
      + (ds===S.sel?' sel':'');
    var dot=log?'<span class="dot done"></span>'
      :sk?'<span class="dot miss"></span>'
      :hasWork?'<span class="dot"></span>'
      :slot?'<span class="dot ghost"></span>':'';
    h+='<button class="'+cls+'" data-act="pick-date" data-d="'+ds+'">'+d.getDate()+(out?'':dot)+'</button>';
  }
  h+='</div><div class="legend">'
    + '<span><i style="background:var(--acc)"></i>planned</span>'
    + '<span><i style="background:#38e2a8"></i>done</span>'
    + '<span><i style="background:#d9a05a"></i>missed</span>'
    + '<span><i style="background:#4a5330"></i>to fill</span></div></div></div>';

  var sd=S.sel, sp=plannedFor(sd), slog=sessionOn(sd), ssk=skipOn(sd), dd=fromYmd(sd);
  h+='<div class="sec-t">'+esc(dd.toLocaleDateString(LOC(),{weekday:'long',day:'numeric',month:'long'}))
    + (mainDays(sd).indexOf(dd.getDay())>=0?', a main day':'')+'</div>';

  if(ssk) h+='<div class="skipcard"><b>Missed — '+esc(ssk.reason)+'</b>'
    + '<small>'+(sp?esc(sp.name):'Nothing planned')+'</small>'
    + '<button class="btn" style="margin-top:11px" data-act="skip-clear" data-d="'+sd+'">Undo</button></div>';
  if(slog) h+='<div class="card"><div class="card-b" style="padding-top:14px">'
    + '<span class="chip b">logged</span> <span style="font-size:13px;color:var(--mut)">'
    + esc(slog.dayName)+', '+fmt(volume(slog))+' kg</span></div></div>';

  if(!sp){
    h+='<div class="card"><div class="empty" style="padding:24px 18px">'
      + '<p style="margin-bottom:14px">Nothing planned on this day.</p>'
      + '<button class="btn p" data-act="add-day" data-d="'+sd+'">Add a workout here</button></div></div>';
  } else if(!(sp.exercises||[]).length){
    h+='<div class="card"><div class="empty" style="padding:24px 18px">'
      + '<p style="margin-bottom:14px"><b style="color:var(--txt);font-size:16px">'+esc(sp.name)+'</b><br>No exercises in it yet.</p>'
      + '<button class="btn p" data-act="fill-day" data-id="'+esc(sp.id)+'" data-d="'+sd+'">Fill it in</button></div></div>';
  } else {
    if(!slog&&sd<ymd())
      h+='<button class="btn" style="margin-bottom:12px" data-act="log-past" data-id="'+esc(sp.id)+'" data-d="'+sd+'">Log this as done</button>';
    h+=dayEditor(sp);
  }

  h+='<div class="sec-t">Standing week</div>';
  routineDays().forEach(function(w){
    var r=routineFor(w), n=r?(r.exercises||[]).length:0, fu=futureRoutine(w);
    var full=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'][w];
    h+='<button class="pick" data-act="goto-dow" data-w="'+w+'">'
      + '<span class="t"><b>'+full+'</b><small>'
      + (r&&n?esc(r.name)+', '+n+' item'+(n===1?'':'s')
          +(r.effectiveFrom?' (since '+esc(fromYmd(r.effectiveFrom).toLocaleDateString(LOC(),{day:'numeric',month:'short'}))+')':'')
        :(r?esc(r.name)+', nothing in it yet':'nothing set'))
      + (fu?'<br>becomes '+esc(fu.name)+' from '+esc(fromYmd(fu.effectiveFrom).toLocaleDateString(LOC(),{day:'numeric',month:'short'})):'')
      + '</small></span><span class="go">›</span></button>';
  });
  h+='<div class="sec-t">Calendar</div>'+calCard();
  return h;
}

/* ---------------- render ---------------- */
var QUIET=false, DIRTY=false, PDOWN=false, flushT=0;
function typingNow(){
  var a=document.activeElement;
  return !!(a&&a.dataset&&a.dataset['in']&&(a.tagName==='INPUT'||a.tagName==='TEXTAREA'));
}
/* for background updates (a sync echo): wait until the keyboard is down */
function renderSoft(){ if(typingNow()){ DIRTY=true; return; } render(); }
function flushSoon(){
  clearTimeout(flushT);
  flushT=setTimeout(function(){ if(DIRTY&&!PDOWN&&!typingNow()) render(); },180);
}
function render(){
  if(QUIET){ DIRTY=true; return; }          /* state is saved; the screen catches up on blur */
  DIRTY=false;
  var a=document.activeElement;
  var fk=(a&&a.dataset)?a.dataset.fkey:null,pos=null;
  try{ if(a&&a.selectionStart!=null) pos=a.selectionStart; }catch(e){}
  var body, gate=S.ready&&needLogin();
  document.body.classList.toggle('gated',!!gate);
  if(gate){ app.innerHTML=loginView(); return; }
  if(!S.ready) body='<div class="card"><div class="empty"><p><span class="spin"></span>Loading your workouts…</p></div></div>';
  else if(S.view==='plan') body=viewPlan();
  else if(S.view==='food') body=viewFood();
  else if(S.view==='coach') body=viewCoach();
  else if(S.view==='you') body=viewYou();
  else if(S.view==='history') body=viewHistory();
  else body=viewToday();
  app.innerHTML=head()+body;
  Array.prototype.forEach.call(document.querySelectorAll('nav button'),function(b){
    b.classList.toggle('on',b.dataset.tab===S.view);
  });
  if(fk){
    var el=app.querySelector('[data-fkey="'+fk+'"]');
    if(el){ el.focus(); try{ if(pos!=null) el.setSelectionRange(pos,pos); }catch(e){} }
  }
  paintRest();
}

/* ---------------- events ---------------- */
document.addEventListener('click',function(ev){
  var t=ev.target.closest('[data-act]');

    if(act==='add-seg-p') ex.segs.push({label:'',detail:''});
    else ex.segs.splice(parseInt(t.dataset.j,10),1);
    put('days',dd2); return;
  }

  if(act==='lv-menu'){ var mi=parseInt(t.dataset.ei,10); S.liveMenu=S.liveMenu===mi?null:mi; S.liveText=''; S.confirm=null; render(); return; }
  if(act==='lv-add-open'){ S.liveMenu='add'; S.liveText=''; render(); return; }
  if(act==='lv-after'){ S.liveMenu='add'+(parseInt(t.dataset.ei,10)+1); S.liveText=''; render(); return; }
  if(act==='lv-close'){ S.liveMenu=null; S.liveText=''; render(); return; }
  if(act==='lv-swap'){ liveSwap(parseInt(t.dataset.ei,10),t.dataset.n); return; }
  if(act==='lv-swap-typed'){ liveSwap(parseInt(t.dataset.ei,10),S.liveText,true); return; }
  if(act==='lv-add'){ liveAdd(t.dataset.n,t.dataset.at!=null?parseInt(t.dataset.at,10):null); return; }
  if(act==='lv-add-typed'){ liveAdd(S.liveText,t.dataset.at!=null?parseInt(t.dataset.at,10):null,true); return; }
  if(act==='lv-move'){ var mi2=parseInt(t.dataset.ei,10), dd=parseInt(t.dataset.d,10);
    liveChange(function(c){ var j=mi2+dd; if(j<0||j>=c.ex.length) return false; var tmp=c.ex[mi2]; c.ex[mi2]=c.ex[j]; c.ex[j]=tmp; },'Moved '+(active().ex[mi2]||{}).name);
    S.liveMenu=mi2+dd; render(); return; }
  if(act==='lv-undo'){ try{ undoChange(); }catch(e){} S.liveMsg=''; render(); return; }

  var ses=active(); if(!ses){ render(); return; }
  var c2=JSON.parse(JSON.stringify(ses));
  var ei=parseInt(t.dataset.ei,10), si=parseInt(t.dataset.si,10);
  if(act==='tick'){
    S.liveMsg='';
    var nowDone=!c2.ex[ei].sets[si].done;
    c2.ex[ei].sets[si].done=nowDone;
    if(nowDone){
      if(!c2.ex[ei].t0) c2.ex[ei].t0=nowHM();
      if(!c2.ex[ei].t1&&c2.ex[ei].sets.every(function(x){ return x.done; })) c2.ex[ei].t1=nowHM();
    }
    put('sessions',c2);
    var sp=ssPartner(c2,ei), firstOfPair=c2.ex[ei].ss&&c2.ex[ei].ss[1]==='1'&&sp!=null&&(c2.ex[sp].sets||[]).some(function(x){ return !x.done; });
    if(nowDone&&firstOfPair){ primeAudio(); if(S.rest){ S.rest=null; paintRest(); } toast('Straight to '+c2.ex[sp].name); }
    else if(nowDone){ primeAudio(); startRest(); }        /* a tap is our one chance to unlock audio */
    else if(S.rest){ S.rest=null; paintRest(); }
    return;
  }
  if(act==='tick-seg'){
    var sgd=!c2.ex[ei].segs[si].done; c2.ex[ei].segs[si].done=sgd;
    if(sgd){
      if(!c2.ex[ei].t0) c2.ex[ei].t0=nowHM();
      if(!c2.ex[ei].t1&&c2.ex[ei].segs.every(function(x){ return x.done; })) c2.ex[ei].t1=nowHM();
    }
    put('sessions',c2); return;
  }
  if(act==='stamp'){ c2.ex[ei][t.dataset.k==='t1'?'t1':'t0']=nowHM(); put('sessions',c2); return; }
  if(act==='set-warm'){ var ws=c2.ex[ei].sets[si]; if(ws){ ws.warm=!ws.warm; put('sessions',c2); } return; }
  if(act==='add-set'){ var st=c2.ex[ei].sets,l=st[st.length-1]||{kg:'0',reps:''};
    st.push({kg:l.kg,reps:l.reps,rir:'',done:false}); put('sessions',c2); return; }
  if(act==='del-set'){ if(c2.ex[ei].sets.length>1){ c2.ex[ei].sets.pop(); put('sessions',c2); } return; }
  if(act==='add-seg'){ c2.ex[ei].segs=c2.ex[ei].segs||[]; c2.ex[ei].segs.push({label:'',detail:'',done:false}); put('sessions',c2); return; }
  if(act==='del-seg'){ if((c2.ex[ei].segs||[]).length>1){ c2.ex[ei].segs.pop(); put('sessions',c2); } return; }
  if(act==='submit'){
    S.parked=false;
    c2.finishedAt=c2.reFinish||Date.now();     /* a reopened session keeps its original date */
    if(c2.reFinish) delete c2.reFinish;
    put('sessions',c2,true); toast('Workout logged 💪'); askReview(c2.id); return;
  }
  render();
});

document.addEventListener('keydown',function(ev){
  if(ev.key==='Enter'&&!ev.shiftKey){
    var el=ev.target;
    if(el&&el.dataset&&el.dataset['in']==='draft'){ ev.preventDefault(); coachSend(S.draft); }
    if(el&&el.dataset&&el.dataset['in']==='food-w'){ ev.preventDefault(); var wb=document.querySelector('[data-act="w-log"]'); if(wb) wb.click(); }
    if(el&&(el.id==='au-pw'||el.id==='au-email')){ ev.preventDefault(); authSubmit(S.auth&&S.auth.mode==='signup'?'signup':'login'); }
    if(el&&el.id==='au-newpw'){ ev.preventDefault(); changePassword(); }
    if(el&&el.dataset&&el.dataset['in']==='live-text'){ ev.preventDefault();
      if(typeof S.liveMenu==='number') liveSwap(S.liveMenu,S.liveText,true);
      else if(S.liveMenu==='add') liveAdd(S.liveText,null,true);
      else if(String(S.liveMenu||'').indexOf('add')===0) liveAdd(S.liveText,parseInt(String(S.liveMenu).slice(3),10),true); }
  }
});

document.addEventListener('input',function(ev){
  QUIET=true;
  try{ inputMain(ev); } finally{ QUIET=false; }
});
document.addEventListener('pointerdown',function(){ PDOWN=true; },true);
['pointerup','pointercancel'].forEach(function(t){
  document.addEventListener(t,function(){ setTimeout(function(){ PDOWN=false; flushSoon(); },0); },true);
});
document.addEventListener('focusout',function(ev){
  flushSoon();
  var t=ev&&ev.target; if(t&&t.dataset&&t.dataset['in']==='ex-name') setTimeout(normalizeNames,250);
});
document.addEventListener('change',function(ev){
  var t=ev.target;
  if(t&&t.dataset&&/^mv-/.test(t.dataset['in']||'')){ render(); return; }
  if(DIRTY&&t&&(t.type==='date'||t.type==='time')) render();   /* a picker has closed, nothing is being typed */
});
function inputMain(ev){
  var el=ev.target.closest('[data-in]'); if(!el) return;
  var kind=el.dataset['in'], v=el.value;

  if(kind.indexOf('mv-')===0&&mvInput(kind,el)) return;
  if(kind==='mach-set'||kind==='mach-step'){ var me=(active()||{ex:[]}).ex[parseInt(el.dataset.ei,10)]; if(me) setMach(me.name,kind==='mach-set'?{set:v}:{step:num(v)}); return; }
  if(kind==='by-prot'||kind==='by-kcal'){ S.food[kind]=v; setByMacro(kind,v); render(); return; }
  if(kind==='combo-name'){ if(S.food.combo) S.food.combo.name=v; return; }
  if(kind==='food-w'){ S.food.wText=v; return; }
  if(kind==='cal-time'){ saveProfile({calTime:v}); return; }
  if(kind==='cal-dur'){ saveProfile({calDur:num(v)||75}); return; }
  if(kind==='meas'){ S.measEdit=S.measEdit||{}; S.measEdit[el.dataset.k]=v; return; }
  if(kind==='ci-note'){ S.ci=S.ci||{}; S.ci.note=v; return; }
  if(kind.indexOf('p-')===0){
    if(!S.food.pending) return;
    var f={'p-name':'name','p-kcal':'kcal','p-protein':'protein','p-carbs':'carbs',
           'p-fat':'fat','p-hint':'hint'}[kind];
    if(f) S.food.pending[f]=v;
    if(kind==='p-name'&&S.food.pending.source==='manual'&&!S.food.pending.editId
       &&!(S.food.pending.items&&S.food.pending.items.length)) foodSearchSoon(v);
    return;                       /* no re-render: keeps the keyboard and caret steady */
  }
  if(kind==='i-grams'){
    var pdd=S.food.pending; if(!pdd||!pdd.items) return;
    var it=pdd.items[parseInt(el.dataset.i,10)]; if(!it||!it.per) return;
    var g=num(v);
    it.grams=v;
    it.kcal=Math.round(it.per.kcal*g); it.protein=Math.round(it.per.protein*g*10)/10;
    it.carbs=Math.round(it.per.carbs*g*10)/10; it.fat=Math.round(it.per.fat*g*10)/10;
    recalc(pdd);
    var te=document.getElementById('mtot'); if(te) te.innerHTML=totInner(pdd);   /* live total, no redraw */
    render();
    return;
  }
  if(kind.indexOf('c-')===0&&S.charEdit){
    var cf={'c-name':'name','c-tag':'tag','c-voice':'voice'}[kind];
    if(cf) S.charEdit[cf]=v;
    return;
  }
  if(kind.indexOf('pr-')===0){
    var g={'pr-name':'name','pr-age':'age','pr-height':'heightCm','pr-weight':'weightKg',
           'pr-cal':'calGoal','pr-prot':'proteinGoal','pr-coachname':'coachName',
           'pr-every':'remindEvery','pr-qfrom':'quietFrom','pr-qto':'quietTo',
           'pr-setslo':'setsLo','pr-setshi':'setsHi','pr-weektarget':'weekTarget','pr-water':'waterGoal'}[kind];
    if(kind==='pr-pause'){ saveProfile({pauseUntil:v}); return; }
    if(!g) return;
    var patch={}; patch[g]=(g==='name'||g==='coachName')?v:num(v);
    saveProfile(patch); return;
  }
  if(kind==='ai-key'){
    try{ localStorage.setItem('wl_aikey',cleanKey(v)); localStorage.removeItem('wl_aimodel'); }catch(e){}
    S.aiTest=null;
    var tb=document.querySelector('[data-act="ai-test"]'); if(tb) tb.disabled=!String(v).trim();
    return;
  }
  if(kind==='gym-name'||kind==='gym-o'||kind==='gym-c'){
    var g2=JSON.parse(JSON.stringify(gym()));
    if(kind==='gym-name') g2.name=v;
    else { var gw=el.dataset.w; g2.hours[gw]=g2.hours[gw]||['','']; g2.hours[gw][kind==='gym-o'?0:1]=v; }
    S.settings.gym=g2; saveSettings(); return;
  }
  if(kind==='set-rest'||kind==='set-step'){
    var val=num(v);
    if(kind==='set-rest') S.settings.rest=(String(v).trim()===''?90:Math.max(0,Math.round(val)));
    else S.settings.step=val>0?val:STEP;
    saveSettings(); return;
  }

  if(kind==='draft'){
    S.draft=v;
    var b=document.querySelector('.send'); if(b) b.disabled=!v.trim()||S.busy;
    return;
  }

  if(kind==='live-text'){ S.liveText=v; return; }
  if(kind==='notes'||kind==='ex-comment'||kind==='ex-t0'||kind==='ex-t1'||kind.indexOf('set-')===0||kind==='seg-label'||kind==='seg-detail'||kind==='seg-kmh'||kind==='seg-min'||kind==='seg-incl'){
    var ses=active(); if(!ses) return;
    var c=JSON.parse(JSON.stringify(ses));
    if(kind==='notes'){ c.notes=v; put('sessions',c); return; }
    var ei=parseInt(el.dataset.ei,10), si=parseInt(el.dataset.si,10);
    if(!c.ex[ei]) return;
    if(kind==='ex-comment') c.ex[ei].comment=v;
    else if(kind==='set-kg') c.ex[ei].sets[si].kg=v;
    else if(kind==='set-reps') c.ex[ei].sets[si].reps=v;
    else if(kind==='set-rir') c.ex[ei].sets[si].rir=v;
    else if(kind==='ex-t0') c.ex[ei].t0=v;
    else if(kind==='ex-t1') c.ex[ei].t1=v;
    else if(kind==='seg-label') c.ex[ei].segs[si].label=v;
    else if(kind==='seg-detail') c.ex[ei].segs[si].detail=v;
    else if(kind==='seg-kmh'||kind==='seg-min'||kind==='seg-incl'){
      var sg=c.ex[ei].segs[si]; sg.act=sg.act||{};
      sg.act[kind==='seg-kmh'?'kmh':kind==='seg-min'?'min':'incl']=String(v).replace(',','.').replace(/[^0-9.]/g,'');
    }
    put('sessions',c); return;
  }

  var d=resolveDay(el.dataset.id); if(!d) return;
  if(d._virtual){
    var real=materialize(el.dataset.id); if(!real) return;
    d=real;
    /* re-target the field to the new copy next render */
  }
  var day=JSON.parse(JSON.stringify(d));
  if(kind==='day-name'){ day.name=v; put('days',day); return; }
  if(kind==='day-date'){ day.date=v; S.sel=v; put('days',day); return; }
  if(kind==='day-note'){ day.note=v; put('days',day); return; }
  var i=parseInt(el.dataset.i,10);
  if(!day.exercises||!day.exercises[i]) return;
  var e=day.exercises[i];
  if(kind==='ex-name') e.name=v;
  else if(kind==='ex-sets') e.sets=v;
  else if(kind==='ex-reps') e.reps=v;
  else if(kind==='ex-kg') e.kg=v;
  else if(kind==='ex-step') e.step=v;
  else if(kind==='ex-base') e.base=v;
  else if(kind==='ex-spec') e.spec=v;
  else if(kind==='ex-note') e.note=v;
  else if(kind==='seg-label-p'||kind==='seg-detail-p'){
    var j=parseInt(el.dataset.j,10);
    e.segs=e.segs||[]; if(!e.segs[j]) return;
    e.segs[j][kind==='seg-label-p'?'label':'detail']=v;
  }
  put('days',day);
}

    window.addEventListener('load',function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
