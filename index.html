/* Monday-start week bucket */
function weekStart(d){
  var x=new Date((d||new Date()).getTime());
  x=new Date(x.getFullYear(),x.getMonth(),x.getDate());
  x.setDate(x.getDate()-((x.getDay()+6)%7));
  return x;
}
/* weekly fractional sets: 1.0 to the primary muscle, k (default 0.5) to synergists */
function weeklySets(offset){
  var ws=weekStart(); ws.setDate(ws.getDate()+(offset||0)*7);
  var we=new Date(ws.getFullYear(),ws.getMonth(),ws.getDate()+7);
  var k=num(S.profile.synK)||0.5, total={}, direct={};
  finished().forEach(function(s){
    if(s.finishedAt<ws.getTime()||s.finishedAt>=we.getTime()) return;
    (s.ex||[]).forEach(function(e){
      if(e.kind==='protocol') return;
      var w=musclesFor(e.name); if(!w) return;
      var n=(e.sets||[]).filter(function(x){ return x.done&&!x.warmup; }).length;
      if(!n) return;
      Object.keys(w).forEach(function(m){
        total[m]=(total[m]||0)+n*(w[m]>=1?1:w[m]*(k/0.5));
        if(w[m]>=1) direct[m]=(direct[m]||0)+n;
      });
    });
  });
  return {total:total,direct:direct,start:ws,end:we};
}
/* muscles worth listing: trained lately, or sitting in an upcoming plan */
function trackedMuscles(){
  var seen={};
  finished().slice(0,40).forEach(function(s){
    (s.ex||[]).forEach(function(e){
      var w=musclesFor(e.name); if(w) Object.keys(w).forEach(function(m){ seen[m]=1; });
    });
  });
  S.routines.concat(S.days).forEach(function(d){
    (d.exercises||[]).forEach(function(e){
      var w=musclesFor(e.name); if(w) Object.keys(w).forEach(function(m){ seen[m]=1; });
    });
  });
  return Object.keys(seen);
}

/* ================= AI WITHOUT CLAUDE ================= */
/* Three tiers: Claude when hosted there, your own Gemini key in a plain browser,
   and a built-in rule engine that needs nothing at all. */
function aiKey(){ try{ return String(localStorage.getItem('wl_aikey')||'').trim(); }catch(e){ return ''; } }
function aiMode(){ return S.sample?'claude':(aiKey()?'gemini':'rules'); }
var GEM='https://generativelanguage.googleapis.com/v1beta/';
function blobB64(b){
  return new Promise(function(res,rej){
    var r=new FileReader();
    r.onload=function(){ res(String(r.result).split(',')[1]||''); };
    r.onerror=function(){ rej(new Error('Could not read the image')); };
    r.readAsDataURL(b);
  });
}
/* model names change often, so ask the API what exists instead of hardcoding one */
function geminiModel(){
  var saved=''; try{ saved=String(localStorage.getItem('wl_aimodel')||''); }catch(e){}
  if(saved) return Promise.resolve(saved);
  return fetch(GEM+'models?pageSize=200',{headers:{'x-goog-api-key':aiKey()}})
    .then(function(r){ return r.json().then(function(j){
      if(!r.ok){ var e=new Error((j&&j.error&&j.error.message)||('HTTP '+r.status)); e.status=r.status; throw e; }
      return j; }); })
    .then(function(j){
      var all=(j.models||[]).filter(function(m){
        var g=m.supportedGenerationMethods; return !g||g.indexOf('generateContent')>=0; })
        .map(function(m){ return String(m.name||'').replace(/^models\//,''); })
        .filter(function(n){ return /^gemini-/.test(n)&&!/embedding|image|tts|audio|live|vision-only/.test(n); });
      var ver=function(n){ var m=n.match(/gemini-(\d+(?:\.\d+)?)/); return m?parseFloat(m[1]):0; };
      var rank=function(n){ return ver(n)*10+(/flash/.test(n)?3:0)-(/lite/.test(n)?2:0)-(/preview|exp/.test(n)?4:0); };
      all.sort(function(a,b){ return rank(b)-rank(a); });
      if(!all.length) throw new Error('No usable Gemini model on this key');
      try{ localStorage.setItem('wl_aimodel',all[0]); }catch(e){}
      return all[0];
    });
}
function geminiCall(msgs,opts,retried){
  opts=opts||{};
  if(typeof msgs==='string') msgs=[{role:'user',content:msgs}];
  return Promise.all((opts.images||[]).map(blobB64)).then(function(b64){
    return geminiModel().then(function(model){
      var contents=msgs.map(function(m){
        return {role:m.role==='assistant'?'model':'user',parts:[{text:String(m.content)}]}; });
      b64.forEach(function(d){ contents[contents.length-1].parts.push({inline_data:{mime_type:'image/jpeg',data:d}}); });
      return fetch(GEM+'models/'+encodeURIComponent(model)+':generateContent',{method:'POST',
        headers:{'Content-Type':'application/json','x-goog-api-key':aiKey()},
        body:JSON.stringify({contents:contents})});
    });
  }).then(function(r){
    return r.json().then(function(j){
      if(!r.ok){
        if(r.status===404&&!retried){            /* the remembered model was retired: pick again */
          try{ localStorage.removeItem('wl_aimodel'); }catch(e){}
          return geminiCall(msgs,opts,true);
        }
        var e=new Error((j&&j.error&&j.error.message)||('HTTP '+r.status)); e.status=r.status; throw e;
      }
      var c=((j.candidates||[])[0]||{}).content;
      var t=((c&&c.parts)||[]).map(function(p){ return p.text||''; }).join('');
      if(!t) throw new Error('The model sent back an empty reply');
      return {text:t};
    });
  });
}
function aiErr(e){
  var s=e&&e.status;
  return s===400||s===401||s===403?'The AI key was rejected. Check it in You, Settings.'
    : s===429?'The AI key has hit its rate limit. Try again in a minute.'
    : 'Could not reach the AI'+(e&&e.message?' ('+String(e.message).slice(0,90)+')':'')+'.';
}

/* ---------- the built-in review: computed, not written ---------- */
function localReview(ses){
  var c=counts(ses), L=[], hard=0, strength=(ses.ex||[]).filter(function(e){ return e.kind!=='protocol'; });
  strength.forEach(function(e){ (e.sets||[]).forEach(function(x){
    if(!x.done) return;
    var r=String(x.rir==null?'':x.rir).trim(), top=topRep((e.target&&e.target.reps)||'');
    if(r!==''?num(x.rir)<=1:(top>0&&num(x.reps)>=top)) hard++;
  }); });
  var pct=c.total?Math.round(c.done/c.total*100):0;
  L.push('## Verdict');
  L.push((pct>=100?'Everything on the plan got done':pct>=80?'Most of the plan got done':'A partial session')
    +': **'+c.done+' of '+c.total+'** items, **'+hard+' hard sets**'
    +(pct<80?'. Skipped work is listed below so it does not quietly vanish.':'.'));

  var up=[],flat=[],down=[],skipped=[];
  strength.forEach(function(e){
    var done=(e.sets||[]).filter(function(x){ return x.done; });
    if(!done.length){ skipped.push(e.name); return; }
    var rows=progData(e.name), n=rows.length;
    var line='**'+e.name+'** '+done.map(function(x){ return fmt(num(x.kg))+'×'+fmt(num(x.reps)); }).join(', ');
    if(n>=2&&rows[n-1].e1rm&&rows[n-2].e1rm){
      var d=(rows[n-1].e1rm-rows[n-2].e1rm)/rows[n-2].e1rm*100;
      line+=' — estimated 1RM '+(d>=0?'+':'')+fmt(Math.round(d*10)/10)+'% on last time';
      (d>0.5?up:d<-0.5?down:flat).push(line);
    } else flat.push(line+' — first comparison point');
  });
  L.push('## What stood out');
  up.concat(flat,down).slice(0,6).forEach(function(x){ L.push('- '+x); });
  if(skipped.length) L.push('- Not done: '+skipped.join(', '));

  var timed=(ses.ex||[]).map(function(e){ return {n:e.name,m:exMins(e)}; }).filter(function(x){ return x.m!=null; });
  if(timed.length){
    var tot=timed.reduce(function(a,x){ return a+x.m; },0);
    timed.sort(function(a,b){ return b.m-a.m; });
    L.push('## Pacing');
    L.push('- '+tot+' minutes on timed exercises. Longest: **'+timed[0].n+'** at '+timed[0].m+' min'
      +(timed.length>1?'; shortest: '+timed[timed.length-1].n+' at '+timed[timed.length-1].m+' min.':'.'));
    var slow=[];
    (ses.ex||[]).forEach(function(e,i){
      var nx=(ses.ex||[])[i+1];
      if(nx&&hm(e.t1)!=null&&hm(nx.t0)!=null){ var g=hm(nx.t0)-hm(e.t1); if(g<0) g+=1440; if(g>=6&&g<120) slow.push(g+' min before '+nx.name); }
    });
    if(slow.length) L.push('- Slow changeovers: '+slow.join(', ')+'.');
  }

  L.push('## Next time');
  var nextN=0;
  strength.forEach(function(e){
    if(nextN>=5||!(e.sets||[]).some(function(x){ return x.done; })) return;
    var t=e.target||{}, sg=suggest(e.name,t.kg,t.reps,t.sets,stepFor(e));
    if(!sg.why) return;
    L.push('- **'+e.name+'**: '+(sg.kg>num(t.kg)+0.001?'go to '+fmt(sg.kg)+' kg':'stay at '+fmt(sg.kg)+' kg and add reps')+'.');
    nextN++;
  });
  if(!nextN) L.push('- Repeat this session and beat one number in it.');
  return L.join('\n\n');
}

/* ---------- the built-in coach: understands a fixed set of requests ---------- */
var DOWFULL=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
function niceDate(ds){ return fromYmd(ds).toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'short'}); }
function workoutPool(){
  var seen={}, out=[], today=ymd();
  var add=function(w){ var k=String(w.name||'').toLowerCase(); if(!k||seen[k]||!(w.exercises||[]).length) return; seen[k]=1; out.push(w); };
  for(var w=0;w<7;w++){ var r=routineFor(w,today); if(r) add(r); }
  S.days.forEach(function(d){ if(Math.abs(dayDiff(fromYmd(d.date||today),new Date()))<=21) add(d); });
  return out;
}
function lastTouched(name){
  var k=String(name||'').toLowerCase(), t=0, today=ymd();
  finished().forEach(function(s){ if(String(s.dayName||'').toLowerCase()===k&&s.finishedAt>t) t=s.finishedAt; });
  for(var i=0;i<7;i++){                       /* something already on the calendar this week counts as covered */
    var ds=ymd(new Date(Date.now()+i*86400000)), p=plannedFor(ds);
    if(p&&(p.exercises||[]).length&&String(p.name||'').toLowerCase()===k) t=Math.max(t,fromYmd(ds).getTime());
  }
  return t;
}
function freeDays(){
  var out=[], ws=weekStart(), today=ymd();
  for(var i=0;i<7;i++){
    var d=new Date(ws.getFullYear(),ws.getMonth(),ws.getDate()+i), ds=ymd(d);
    if(ds<today||sessionOn(ds)||!gymDay(d.getDay())) continue;
    var p=plannedFor(ds);
    if(p&&(p.exercises||[]).length) continue;
    out.push(ds);
  }
  return out;
}
function busy(ds){ var p=plannedFor(ds); return !!(sessionOn(ds)||(p&&(p.exercises||[]).length)); }
function shiftYmd(ds,n){ var d=fromYmd(ds); return ymd(new Date(d.getFullYear(),d.getMonth(),d.getDate()+n)); }
function cloneEx(list){ return JSON.parse(JSON.stringify(list||[])).map(function(e){ e.id=uid(); return e; }); }

function ruleCoach(text){
  var q=' '+String(text||'').toLowerCase()+' ', today=ymd();
  var has=function(){ for(var i=0;i<arguments.length;i++) if(q.indexOf(arguments[i])>=0) return true; return false; };
  var days=[]; q.replace(/\b(today|tomorrow|mon|tue|wed|thu|fri|sat|sun)[a-z]*/g,function(m,k){ days.push(k); return m; });
  var toDate=function(k){
    if(k==='today') return today;
    if(k==='tomorrow') return shiftYmd(today,1);
    var w=['sun','mon','tue','wed','thu','fri','sat'].indexOf(k);
    for(var i=0;i<7;i++){ var ds=shiftYmd(today,i); if(fromYmd(ds).getDay()===w) return ds; }
    return today;
  };

  /* gym hours */
  if(has('open','close','closing','closes','hours')&&!has('workout','session')){
    var st=gymStatus(), L=[gym().name+' is '+st.text+'.',''];
    [1,2,3,4,5,6,0].forEach(function(w){ var h=gymDay(w); L.push('- '+DOWFULL[w]+': '+(h?h[0]+' to '+h[1]:'closed')); });
    return L.join('\n');
  }

  /* move a workout */
  if(has('move','swap','shift','reschedule')&&days.length>=2){
    var from=toDate(days[0]), to=toDate(days[1]), p=plannedFor(from);
    if(!p||!(p.exercises||[]).length) return 'There is nothing planned on '+niceDate(from)+' to move.';
    if(busy(to)) return niceDate(to)+' already has a workout. Clear it first, or pick another day.';
    if(!gymDay(fromYmd(to).getDay())) return gym().name+' is closed on '+niceDate(to)+'.';
    put('days',{id:uid(),name:p.name,date:to,note:p.note||'',exercises:cloneEx(p.exercises),source:'coach'},true);
    if(p._virtual) put('days',{id:uid(),name:'Rest day',date:from,note:'Moved to '+niceDate(to)+'.',exercises:[],source:'coach'},true);
    else drop('days',p.id);
    sysMsg('Moved '+p.name+' to '+niceDate(to));
    return '**'+p.name+'** is now on '+niceDate(to)+' (gym open '+gymLine(to)+'), and '+niceDate(from)+' is free.';
  }

  /* an extra session this week */
  if(has('extra','one more','another','additional')&&has('session','workout','time','train','day')){
    var free=freeDays();
    if(!free.length) return 'There is no free day left this week when the gym is open. Tell me a day to move something instead.';
    var pick=free.filter(function(ds){ return !busy(shiftYmd(ds,-1))&&!busy(shiftYmd(ds,1)); })[0]||free[0];
    var pool=workoutPool();
    if(!pool.length) return 'There are no workouts to copy yet. Build one in Plan first.';
    pool.sort(function(a,b){ return lastTouched(a.name)-lastTouched(b.name); });
    var w=pool[0];
    put('days',{id:uid(),name:w.name,date:pick,note:w.note||'',exercises:cloneEx(w.exercises),source:'coach'},true);
    sysMsg('Added '+niceDate(pick)+' — '+w.name);
    return 'Added **'+w.name+'** on '+niceDate(pick)+'. I picked it because it is the workout you have gone longest without, '
      + 'and that day '+(busy(shiftYmd(pick,-1))||busy(shiftYmd(pick,1))?'was the only gap left':'has a rest day either side')
      + '. The gym is open '+gymLine(pick)+'.';
  }

  /* bump weights that were earned */
  if(has('bump','increase','raise','heavier','update')&&has('weight','kg','load')){
    var changed={};
    var walk=function(coll,doc){
      var touched=false, copy=JSON.parse(JSON.stringify(doc));
      (copy.exercises||[]).forEach(function(e){
        if(e.kind==='protocol') return;
        var sg=suggest(e.name,e.kg,e.reps,e.sets,stepFor(e));
        if(sg.why&&sg.kg>num(e.kg)+0.001){ changed[e.name]=fmt(num(e.kg))+' → '+fmt(sg.kg)+' kg'; e.kg=fmt(sg.kg); touched=true; }
      });
      if(touched) put(coll,copy,true);
    };
    S.routines.slice().forEach(function(r){ walk('routines',r); });
    S.days.slice().forEach(function(d){ if(d.date>=today) walk('days',d); });
    var names=Object.keys(changed);
    if(!names.length) return 'Nothing has earned a bump yet. A weight goes up once every set reaches the top of its rep range.';
    sysMsg('Raised '+names.length+' weight'+(names.length===1?'':'s'));
    return 'Raised these in your plan, because you hit the top of the range on every set last time:\n\n'
      + names.map(function(n){ return '- **'+n+'**: '+changed[n]; }).join('\n');
  }

  /* what to train */
  if(has('ideal','recommend','what should i train','which workout','what would be','best workout','what do you think')){
    var wk=weeklySets(0).total, lo=num(S.profile.setsLo)||10, pool2=workoutPool();
    if(!pool2.length) return 'There are no workouts in your plan yet to choose between.';
    var score=function(w){ var sc=0; (w.exercises||[]).forEach(function(e){
      var m=musclesFor(e.name); if(m) Object.keys(m).forEach(function(k){ sc+=Math.max(0,lo-(wk[k]||0))*m[k]; }); }); return sc; };
    pool2.sort(function(a,b){ return score(b)-score(a); });
    var best=pool2[0], low=trackedMuscles().filter(function(m){ return (wk[m]||0)<lo; })
      .sort(function(a,b){ return (wk[a]||0)-(wk[b]||0); }).slice(0,4);
    var when=days.length?toDate(days[0]):null;
    return 'I would do **'+best.name+'**'+(when?' on '+niceDate(when)+' (gym open '+gymLine(when)+')':'')+'.'
      + (low.length?' It covers what is furthest under your weekly target: '
          + low.map(function(m){ return (MNAME[m]||m)+' at '+fmt(Math.round((wk[m]||0)*10)/10)+' sets'; }).join(', ')+'.':'')
      + '\n\nSay "add an extra session" and I will put it on the calendar.';
  }

  /* progress */
  if(has('progress','stall','plateau','how am i','stronger','improv')){
    var names2=exerciseNames(); if(!names2.length) return 'Nothing is logged yet, so there is no trend to read.';
    var L2=['Estimated 1RM, first logged to latest:',''];
    names2.slice(0,8).forEach(function(n){
      var d=progData(n).filter(function(p){ return p.e1rm>0; });
      if(!d.length) return;
      var st2=stallInfo(progData(n));
      L2.push('- **'+n+'**: '+fmt(d[0].e1rm)+' → '+fmt(d[d.length-1].e1rm)+' kg'+(st2&&st2.stalled?' — stalled':''));
    });
    return L2.join('\n');
  }

  /* the week / today */
  if(has('week','schedule','coming up','plan')){
    var L3=['Next seven days:',''];
    for(var i=0;i<7;i++){ var ds=shiftYmd(today,i), p3=plannedFor(ds);
      L3.push('- '+niceDate(ds)+': '+(sessionOn(ds)?'done':skipOn(ds)?'missed ('+skipOn(ds).reason+')'
        :(p3&&(p3.exercises||[]).length)?'**'+p3.name+'**':'rest')+' · gym '+gymLine(ds)); }
    return L3.join('\n');
  }
  if(has('today','tonight','now')){
    var p4=plannedFor(today);
    return (sessionOn(today)?'You already trained today.':(p4&&(p4.exercises||[]).length)
      ?'**'+p4.name+'** is on today, '+(p4.exercises||[]).length+' items.':'Nothing is planned today.')
      + ' '+gym().name+' is '+gymStatus().text+'.';
  }

  return 'I am the built-in coach, so I understand a fixed set of requests:\n\n'
    + '- "add an extra session this week"\n- "move Thursday to Friday"\n- "bump my weights"\n'
    + '- "what should I train on Sunday"\n- "how is my progress"\n- "what is on this week"\n- "when does the gym close"\n\n'
    + 'For free-form questions, add a free Gemini key in You, Settings and I can answer anything about your training.';
}
function coachRules(text){
  var reply; try{ reply=ruleCoach(text); }catch(e){ reply='That request tripped me up. Try rephrasing it.'; }
  S.busy=false; S.stream='';

 'You cannot call tools directly in this setup. To change anything, end your reply with one line that begins with',

function runActions(raw){
  var a=raw.indexOf('['), b=raw.lastIndexOf(']'); if(a<0||b<a) return 0;

function coachGemini(text){

  S.chat.filter(function(m){ return m.role==='user'||m.role==='assistant'; }).slice(-14).forEach(function(m){
    msgs.push({role:m.role,content:m.text}); });
  if(msgs[msgs.length-1].role!=='user') msgs.push({role:'user',content:text});
  var settle=function(t){ S.busy=false; S.stream='';
    put('chat',{id:uid(),role:'assistant',text:t||'(no reply)',at:Date.now()},true); setTimeout(scrollEnd,30); };
  geminiCall(msgs).then(function(res){
    var t=String(res.text||''), i=t.lastIndexOf('ACTIONS:');
    if(i>=0){ runActions(t.slice(i+8)); t=t.slice(0,i).trim(); }

function buildBackup(){

    settings:S.settings,profile:S.profile};

}

function hosted(){ return !!(window.claude&&typeof window.claude.use==='function'); }
function markBackup(){ try{ localStorage.setItem('wl_lastbackup',String(Date.now())); }catch(e){} }
function backupAge(){
  var t=0; try{ t=num(localStorage.getItem('wl_lastbackup')); }catch(e){}
  return t?Math.floor((Date.now()-t)/86400000):null;
}
function exportData(){
  var json=JSON.stringify(buildBackup(),null,1), name='workout-log-'+ymd()+'.json';
  var viaLink=function(){
    try{
      var url=URL.createObjectURL(new Blob([json],{type:'application/json'}));
      var a=document.createElement('a'); a.href=url; a.download=name;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function(){ URL.revokeObjectURL(url); },4000);
      markBackup(); toast('Backup saved to your downloads'); render();
    }catch(e){ toast('Could not save the backup here'); }
  };
  if(!hosted()){ viaLink(); return; }
  window.claude.use('downloads').then(function(dl){
    if(!dl) throw new Error('nodl');
    return dl.save({filename:name,data:json});
  }).then(function(){ markBackup(); toast('Backup saved'); })
  .catch(function(){
    try{
      navigator.clipboard.writeText(json).then(function(){ toast('Backup copied to the clipboard'); },
        function(){ toast('Could not save the backup here'); });
    }catch(e){ toast('Could not save the backup here'); }
  });
}
function applyBackup(b,mode){
  if(!b||typeof b!=='object') { toast('That file is not a Workout Log backup'); return; }
  if(!b.sessions&&!b.days&&!b.routines){ toast('That file has no workout data in it'); return; }
  var n=0;
  BACKUP_SETS.forEach(function(k){
    var incoming=b[k]||[];
    if(mode==='replace') store(k).slice().forEach(function(r){ drop(k,r.id); });
    incoming.forEach(function(r){
      if(!r||!r.id) return;
      if(mode==='merge'&&byId(k,r.id)) return;      /* keep what is already here */
      put(k,r,true); n++;
    });
  });
  if(b.profile) saveProfile(b.profile);
  if(b.settings){ S.settings=b.settings; saveSettings(); }
  S.importing=null; render();
  toast('Restored '+n+' records');
}

    var b; try{ b=JSON.parse(String(r.result)); }catch(e){ toast('That file is not valid JSON'); return; }
    S.importing=b; render();
  };
  r.onerror=function(){ toast('Could not read that file'); };
  r.readAsText(f);
}

function isoWeek(d){
  var t=new Date(d.getFullYear(),d.getMonth(),d.getDate());
  t.setDate(t.getDate()+3-((t.getDay()+6)%7));
  var first=new Date(t.getFullYear(),0,4);
  return t.getFullYear()+'-'+Math.round(((t-first)/86400000-3+((first.getDay()+6)%7))/7);
}
function weeksOnTarget(){
  var target=Math.max(1,num(S.profile.weekTarget)||3), ws=weekStart(), n=0, pausedW=0;
  var pause=String(S.profile.pauseUntil||'');
  for(var i=0;i<12;i++){
    var a=new Date(ws.getFullYear(),ws.getMonth(),ws.getDate()-i*7);
    var b=new Date(a.getFullYear(),a.getMonth(),a.getDate()+7);
    if(pause&&fromYmd(pause).getTime()>=a.getTime()){ n++; pausedW++; continue; }
    var c=finished().filter(function(s){ return s.finishedAt>=a.getTime()&&s.finishedAt<b.getTime(); }).length;
    if(c>=target) n++;
  }
  return {weeks:n,target:target,paused:pausedW};
}
function milestones(){
  var fin=finished();
  var weeks={}; fin.forEach(function(s){ weeks[isoWeek(new Date(s.finishedAt))]=1; });
  var streak=0, cur=new Date();
  for(var i=0;i<104;i++){
    var w=isoWeek(new Date(cur.getFullYear(),cur.getMonth(),cur.getDate()-i*7));
    if(weeks[w]) streak++; else if(i>0) break;
  }
  var byWeek={}; fin.forEach(function(s){
    var w=isoWeek(new Date(s.finishedAt)); byWeek[w]=(byWeek[w]||0)+volume(s);
  });
  var bestWeek=0; Object.keys(byWeek).forEach(function(k){ if(byWeek[k]>bestWeek) bestWeek=byWeek[k]; });
  var top=0; fin.forEach(function(s){ (s.ex||[]).forEach(function(e){
    (e.sets||[]).forEach(function(x){ if(x.done&&num(x.kg)>top) top=num(x.kg); }); }); });
  var fd={}; S.meals.forEach(function(m){ fd[m.date]=1; });
  return {sessions:fin.length,streak:streak,onTarget:weeksOnTarget().weeks,bestWeek:Math.round(bestWeek),
    topSet:top,foodDays:Object.keys(fd).length,
    volume:Math.round(fin.reduce(function(a,s){ return a+volume(s); },0))};
}

function hashStr(s){ var h=5381,i=s.length; while(i) h=(h*33)^s.charCodeAt(--i); return (h>>>0).toString(36)+'.'+s.length; }

function fbReq(url,opts){
  return fetch(url,opts).then(function(r){
    return r.text().then(function(tx){
      var j=null; try{ j=tx?JSON.parse(tx):null; }catch(e){}
      if(!r.ok){
        var er=Array.isArray(j)?(j[0]&&j[0].error):(j&&j.error);
        var e=new Error((er&&er.message)||('http '+r.status));
        e.status=r.status; e.code=String((er&&(er.status||er.message))||''); e.fb=String((er&&er.message)||'');
        throw e;
      }
      return j;
    });
  });
}
function fbPost(url,body,token){

  return fbReq('https://securetoken.googleapis.com/v1/token?key='+FB.apiKey,{method:'POST',
      headers:{'Content-Type':'application/x-www-form-urlencoded'},
      body:'grant_type=refresh_token&refresh_token='+encodeURIComponent(AUTH.rt)})
    .then(function(d){

      AUTH.it=d.id_token; AUTH.rt=d.refresh_token||AUTH.rt; AUTH.exp=Date.now()+(num(d.expires_in)||3600)*1000; saveAuth();

    },function(e){
      if(e&&e.status===400&&/TOKEN_EXPIRED|USER_DISABLED|USER_NOT_FOUND|INVALID_REFRESH_TOKEN/.test(e.fb||'')){

function authErr(e){

  if(!e||(!e.status&&!c)) return 'No connection. Check your signal and try again.';
  return /EMAIL_EXISTS/.test(c)?'That email already has an account. Log in instead.'
    : /INVALID_LOGIN_CREDENTIALS|INVALID_PASSWORD|EMAIL_NOT_FOUND/.test(c)?'Email or password is not right.'
    : /INVALID_EMAIL|MISSING_EMAIL/.test(c)?'That does not look like an email address.'
    : /WEAK_PASSWORD|MISSING_PASSWORD/.test(c)?'Use a password of at least 6 characters.'
    : /TOO_MANY_ATTEMPTS/.test(c)?'Too many tries. Wait a few minutes.'
    : /OPERATION_NOT_ALLOWED|CONFIGURATION_NOT_FOUND|ADMIN_ONLY/.test(c)?'Email login is not switched on in Firebase yet (Authentication, Sign-in method).'
    : /USER_DISABLED/.test(c)?'This account has been disabled.'

function syncErr(e){
  if(e&&e.expired) return 'You were signed out. Log in again to keep syncing.';
  if(!e||!e.status) return 'Offline. Changes are kept on this device and upload when you are back online.';
  if(e.status===403) return 'Signed in, but the database rules block saving. Paste the rules into Firestore, Rules.';
  if(e.status===404) return 'Signed in, but the Firestore database has not been created yet.';
  if(e.status===429) return 'Sync is being rate limited. It will retry.';
  return 'Sync failed ('+e.status+' '+(e.code||'')+'). It will retry.';

/* dirty = differs from what the cloud last confirmed. da[key]={h:hash now,t:when it last changed} */
function markDirty(snap){
  var sh=lsJ('wl_sync_sh',{}), da=lsJ('wl_sync_da',{}), now=Date.now(), k, h;
  for(k in snap){
    h=hashStr(snap[k]);
    if(sh[k]===h){ if(da[k]) delete da[k]; }
    else if(!da[k]||da[k].h!==h) da[k]={h:h,t:now};
  }
  for(k in sh){ if(snap[k]==null&&(!da[k]||da[k].h!=='x')) da[k]={h:'x',t:now}; }
  for(k in da){ if(snap[k]==null&&sh[k]==null) delete da[k]; }
  lsS('wl_sync_da',da);
  return {sh:sh,da:da};
}

function pullChanges(tok){
  var out=[], cur=lsJ('wl_sync_cur','');
  var page=function(){
    var q={from:[{collectionId:'items'}],orderBy:[{field:{fieldPath:'s'},direction:'ASCENDING'}],limit:300};
    if(cur) q.where={fieldFilter:{field:{fieldPath:'s'},op:'GREATER_THAN',value:{timestampValue:cur}}};
    return fbPost('https://firestore.googleapis.com/v1/'+fbDocs()+'/users/'+AUTH.uid+':runQuery',{structuredQuery:q},tok)
    .then(function(rows){
      var n=0;
      (rows||[]).forEach(function(r){
        var f=r&&r.document&&r.document.fields; if(!f||!f.k) return;
        n++;
        out.push({key:f.k.stringValue,j:f.j?f.j.stringValue:null,t:num(f.t&&f.t.integerValue),d:!!(f.d&&f.d.booleanValue)});
        if(f.s&&f.s.timestampValue) cur=f.s.timestampValue;

function setLocal(key,obj){

}

function pushChanges(tok){
  var snap=syncSnapshot(), st=markDirty(snap), keys=Object.keys(st.da);
  if(!keys.length) return Promise.resolve(0);
  var base=fbDocs()+'/users/'+AUTH.uid+'/items/', chunks=[], sent=0;
  for(var i=0;i<keys.length;i+=100) chunks.push(keys.slice(i,i+100));
  var run=function(ci){
    if(ci>=chunks.length) return Promise.resolve(sent);
    var part=chunks[ci], stamp={};
    var writes=part.map(function(k){
      var gone=snap[k]==null, f={k:{stringValue:k},t:{integerValue:String(st.da[k].t)},d:{booleanValue:gone}};
      if(!gone) f.j={stringValue:snap[k]};
      stamp[k]=st.da[k].h;
      return {update:{name:base+docId(k),fields:f},updateTransforms:[{fieldPath:'s',setToServerValue:'REQUEST_TIME'}]};
    });
    return fbPost('https://firestore.googleapis.com/v1/'+fbDocs()+':commit',{writes:writes},tok).then(function(){
      var sh=lsJ('wl_sync_sh',{}), da=lsJ('wl_sync_da',{});
      part.forEach(function(k){
        if(stamp[k]==='x') delete sh[k]; else sh[k]=stamp[k];
        if(da[k]&&da[k].h===stamp[k]) delete da[k];       /* typed again meanwhile? then it stays queued */
      });
      lsS('wl_sync_sh',sh); lsS('wl_sync_da',da);
      sent+=part.length;
      return run(ci+1);
    });
  };
  return run(0);
}
function paintSync(){

function syncLine(){
  if(!AUTH) return '';
  if(SY.busy) return 'Syncing…';
  if(SY.err) return SY.err;
  if(!SY.last) return 'Not synced yet on this device.';
  var m=Math.round((Date.now()-SY.last)/60000);
  return 'Synced '+(m<1?'just now':m===1?'a minute ago':m<60?m+' minutes ago':'over an hour ago')+'.';
}
function syncNow(){
  if(!syncOn()||!AUTH||!S.ready) return Promise.resolve();
  if(SY.busy){ SY.again=true; return Promise.resolve(); }
  SY.busy=true; SY.again=false; paintSync();
  var first=!lsJ('wl_sync_cur','');
  return idToken().then(function(tok){
    return pullChanges(tok).then(function(r){
      var changed=applyRemote(r.docs,first);
      lsS('wl_sync_cur',r.cur||'');
      if(changed) renderSoft();
      return pushChanges(tok);
    });
  }).then(function(){ SY.err=''; SY.last=Date.now(); },function(e){
    SY.err=syncErr(e);
    if(e&&e.expired) render();
  }).then(function(){
    SY.busy=false; paintSync();
    if(SY.again) syncSoon(800);
  });
}
function syncSoon(ms){ if(!syncOn()||!AUTH) return; clearTimeout(SY.t); SY.t=setTimeout(syncNow,ms==null?2500:ms); }

    + '<span class="chip a">review</span></div><div class="card-b">'+statsBlock(ses);

function viewPlan(){
  var now=new Date();
  if(!S.cal) S.cal={y:now.getFullYear(),m:now.getMonth()};
  if(!S.sel) S.sel=ymd(now);
  var y=S.cal.y, m=S.cal.m;
  var first=new Date(y,m,1), off=(first.getDay()+6)%7;
  var dim=new Date(y,m+1,0).getDate(), rows=Math.ceil((off+dim)/7);

  var h='<div class="card"><div class="card-b" style="padding:15px">'
    + '<div class="cal-h"><button class="cal-nav" data-act="cal" data-d="-1">‹</button>'
    + '<b>'+first.toLocaleDateString(undefined,{month:'long',year:'numeric'})+'</b>'
    + '<button class="cal-nav" data-act="cal-today">•</button>'
    + '<button class="cal-nav" data-act="cal" data-d="1">›</button></div>'
    + '<div class="dow"><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span><span>S</span></div>'
    + '<div class="grid">';
  for(var i=0;i<rows*7;i++){
    var d=new Date(y,m,1-off+i), ds=ymd(d);
    var out=d.getMonth()!==m, p=plannedFor(ds), log=sessionOn(ds), sk=skipOn(ds);
    var hasWork=!!(p&&(p.exercises||[]).length);
    var slot=!!(p&&!hasWork&&!/^rest/i.test(p.name||''));
    var cls='cell'+(out?' out':'')
      + (!out&&mainDays(ds).indexOf(d.getDay())>=0?' main':'')
      + (!out&&hasWork&&!log?' has':'')
      + (!out&&log?' done':'')
      + (!out&&!log&&sk?' skip':'')
      + (ds===ymd(now)?' today':'')
      + (ds===S.sel?' sel':'');
    var dot=log?'<span class="dot done"></span>'
      :sk?'<span class="dot miss"></span>'
      :hasWork?'<span class="dot"></span>'
      :slot?'<span class="dot ghost"></span>':'';
    h+='<button class="'+cls+'" data-act="pick-date" data-d="'+ds+'">'+d.getDate()+(out?'':dot)+'</button>';
  }
  h+='</div><div class="legend">'
    + '<span><i style="background:var(--acc)"></i>planned</span>'
    + '<span><i style="background:#38e2a8"></i>done</span>'
    + '<span><i style="background:#d9a05a"></i>missed</span>'
    + '<span><i style="background:#4a5330"></i>to fill</span></div></div></div>';

  var sd=S.sel, sp=plannedFor(sd), slog=sessionOn(sd), ssk=skipOn(sd), dd=fromYmd(sd);
  h+='<div class="sec-t">'+esc(dd.toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long'}))
    + (mainDays(sd).indexOf(dd.getDay())>=0?', a main day':'')+'</div>';

  if(ssk) h+='<div class="skipcard"><b>Missed — '+esc(ssk.reason)+'</b>'
    + '<small>'+(sp?esc(sp.name):'Nothing planned')+'</small>'
    + '<button class="btn" style="margin-top:11px" data-act="skip-clear" data-d="'+sd+'">Undo</button></div>';
  if(slog) h+='<div class="card"><div class="card-b" style="padding-top:14px">'
    + '<span class="chip b">logged</span> <span style="font-size:13px;color:var(--mut)">'
    + esc(slog.dayName)+', '+fmt(volume(slog))+' kg</span></div></div>';

  if(!sp){
    h+='<div class="card"><div class="empty" style="padding:24px 18px">'
      + '<p style="margin-bottom:14px">Nothing planned on this day.</p>'
      + '<button class="btn p" data-act="add-day" data-d="'+sd+'">Add a workout here</button></div></div>';
  } else if(!(sp.exercises||[]).length){
    h+='<div class="card"><div class="empty" style="padding:24px 18px">'
      + '<p style="margin-bottom:14px"><b style="color:var(--txt);font-size:16px">'+esc(sp.name)+'</b><br>No exercises in it yet.</p>'
      + '<button class="btn p" data-act="fill-day" data-id="'+esc(sp.id)+'" data-d="'+sd+'">Fill it in</button></div></div>';
  } else {
    if(!slog&&sd<ymd())
      h+='<button class="btn" style="margin-bottom:12px" data-act="log-past" data-id="'+esc(sp.id)+'" data-d="'+sd+'">Log this as done</button>';
    h+=dayEditor(sp);
  }

  h+='<div class="sec-t">Standing week</div>';
  routineDays().forEach(function(w){
    var r=routineFor(w), n=r?(r.exercises||[]).length:0, fu=futureRoutine(w);
    var full=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'][w];
    h+='<button class="pick" data-act="goto-dow" data-w="'+w+'">'
      + '<span class="t"><b>'+full+'</b><small>'
      + (r&&n?esc(r.name)+', '+n+' item'+(n===1?'':'s')
          +(r.effectiveFrom?' (since '+esc(fromYmd(r.effectiveFrom).toLocaleDateString(undefined,{day:'numeric',month:'short'}))+')':'')
        :(r?esc(r.name)+', nothing in it yet':'nothing set'))
      + (fu?'<br>becomes '+esc(fu.name)+' from '+esc(fromYmd(fu.effectiveFrom).toLocaleDateString(undefined,{day:'numeric',month:'short'})):'')
      + '</small></span><span class="go">›</span></button>';
  });
  return h;
}

/* ---------------- render ---------------- */
var QUIET=false, DIRTY=false, PDOWN=false, flushT=0;
function typingNow(){
  var a=document.activeElement;
  return !!(a&&a.dataset&&a.dataset['in']&&(a.tagName==='INPUT'||a.tagName==='TEXTAREA'));
}
/* for background updates (a sync echo): wait until the keyboard is down */
function renderSoft(){ if(typingNow()){ DIRTY=true; return; } render(); }
function flushSoon(){
  clearTimeout(flushT);
  flushT=setTimeout(function(){ if(DIRTY&&!PDOWN&&!typingNow()) render(); },180);
}
function render(){
  if(QUIET){ DIRTY=true; return; }          /* state is saved; the screen catches up on blur */
  DIRTY=false;
  var a=document.activeElement;
  var fk=(a&&a.dataset)?a.dataset.fkey:null,pos=null;
  try{ if(a&&a.selectionStart!=null) pos=a.selectionStart; }catch(e){}
  var body, gate=S.ready&&needLogin();
  document.body.classList.toggle('gated',!!gate);
  if(gate){ app.innerHTML=loginView(); return; }
  if(!S.ready) body='<div class="card"><div class="empty"><p><span class="spin"></span>Loading your workouts…</p></div></div>';
  else if(S.view==='plan') body=viewPlan();
  else if(S.view==='food') body=viewFood();
  else if(S.view==='coach') body=viewCoach();
  else if(S.view==='you') body=viewYou();
  else if(S.view==='history') body=viewHistory();
  else body=viewToday();
  app.innerHTML=head()+body;
  Array.prototype.forEach.call(document.querySelectorAll('nav button'),function(b){
    b.classList.toggle('on',b.dataset.tab===S.view);
  });
  if(fk){
    var el=app.querySelector('[data-fkey="'+fk+'"]');
    if(el){ el.focus(); try{ if(pos!=null) el.setSelectionRange(pos,pos); }catch(e){} }
  }
  paintRest();
}

/* ---------------- events ---------------- */
document.addEventListener('click',function(ev){
  var t=ev.target.closest('[data-act]');
  if(!t){ if(S.confirm){ S.confirm=null; render(); } return; }
  var act=t.dataset.act;

  if(act==='arm'){
    var key=t.dataset.key;
    if(S.confirm!==key){ S.confirm=key; render(); return; }
    S.confirm=null;
    if(key==='logout'){ logout(); return; }
    if(key==='discard'){ var s=active(); S.parked=false; if(s) drop('sessions',s.id); return; }
    if(key==='clearchat'){ S.chat.slice().forEach(function(m){ drop('chat',m.id); }); return; }
    var p=key.split(':');
    if(p[0]==='day'){ drop('days',p[1]); return; }
    if(p[0]==='ses'){ if(S.showReview===p[1]) S.showReview=null; drop('sessions',p[1]); return; }
    if(p[0]==='meal'){ S.food.pending=null; drop('meals',p[1]); return; }
    if(p[0]==='char'){
      S.charEdit=null;
      if(S.profile.coachChar===p[1]) saveProfile({coachChar:'coach'});
      drop('chars',p[1]); return;
    }
    if(p[0]==='ex'){
      var d=resolveDay(p[1]); if(!d) return;
      if(d._virtual){ d=materialize(p[1]); if(!d) return; }
      d=JSON.parse(JSON.stringify(d)); d.exercises.splice(parseInt(p[2],10),1); put('days',d); return;
    }
    return;
  }
  if(S.confirm) S.confirm=null;

  if(act==='preview'){ S.preview=t.dataset.id; S.view='today'; render(); return; }
  if(act==='unpreview'){ S.preview=null; render(); return; }
  if(act==='park'){ S.parked=true; render(); return; }
  if(act==='resume'){ S.parked=false; S.preview=null; S.view='today'; render(); return; }
  if(act==='tab'){ S.view=t.dataset.tab; S.showReview=null; S.preview=null; render(); if(S.view==='coach') setTimeout(scrollEnd,40); return; }
  if(act==='cal'){ var m=S.cal.m+parseInt(t.dataset.d,10); S.cal={y:S.cal.y+Math.floor(m/12),m:((m%12)+12)%12}; render(); return; }
  if(act==='cal-today'){ var n=new Date(); S.cal={y:n.getFullYear(),m:n.getMonth()}; S.sel=ymd(n); render(); return; }
  if(act==='pick-date'){ S.sel=t.dataset.d; var dd=fromYmd(S.sel); S.cal={y:dd.getFullYear(),m:dd.getMonth()}; render(); return; }
  if(act==='goto-dow'){
    var w=parseInt(t.dataset.w,10),n2=new Date();
    for(var i=0;i<14;i++){ var c=new Date(n2.getFullYear(),n2.getMonth(),n2.getDate()+i);
      if(c.getDay()===w){ S.sel=ymd(c); S.cal={y:c.getFullYear(),m:c.getMonth()}; break; } }
    var tg=resolveDay((plannedFor(S.sel)||{}).id); if(tg) S.openDay[tg.id]=true;
    render(); return;
  }
  if(act==='add-day'){ addDay(t.dataset.d); return; }
  if(act==='add-ex'){ addEx(t.dataset.id,'strength'); return; }
  if(act==='add-pro'){ addEx(t.dataset.id,'protocol'); return; }
  if(act==='start'){ startSession(t.dataset.id); return; }
  if(act==='toggle-day'){ var i2=t.dataset.id; S.openDay[i2]=!S.openDay[i2]; render(); return; }
  if(act==='toggle-ses'){ var j2=t.dataset.id; S.openSes[j2]=!S.openSes[j2]; render(); return; }
  if(act==='close-review'){ S.showReview=null; S.reviewText=''; S.view='history'; render(); return; }
  if(act==='open-review'){
    var sv=byId('sessions',t.dataset.id);
    if(sv&&sv.review){ S.showReview=sv.id; S.reviewText=sv.review.text; S.reviewNote=''; S.view='today'; render(); }
    else askReview(t.dataset.id);
    return;
  }
  if(act==='again'){ askReview(t.dataset.id); return; }
  if(act==='htab'){ S.histTab=t.dataset.t; render(); return; }
  if(act==='wk'){ S.weekOff=Math.min(0,(S.weekOff||0)+parseInt(t.dataset.d,10)); render(); return; }

  /* --- food --- */
  if(act==='fday'){
    var cur=fromYmd(foodDate());
    var nd=new Date(cur.getFullYear(),cur.getMonth(),cur.getDate()+parseInt(t.dataset.d,10));
    if(ymd(nd)>ymd()) return;
    S.food.date=ymd(nd); S.food.pending=null; render(); return;
  }
  if(act==='toggle-remind'){
    saveProfile({remind:!S.profile.remind});
    toast(!S.profile.remind?'Reminders off':'Reminders on');
    return;
  }
  if(act==='ask-notify'){ askNotify(); return; }
  if(act==='ai-test'){
    toast('Testing the key…');
    geminiCall('Reply with the single word: ready').then(function(){
      var mdl=''; try{ mdl=localStorage.getItem('wl_aimodel')||''; }catch(e){}
      toast('Key works'+(mdl?' — using '+mdl:'')); render();
    }).catch(function(e){ toast(aiErr(e)); });
    return;
  }
  if(act==='export'){ exportData(); return; }
  if(act==='goto-backup'){ S.view='you'; S.panels.set=true; render(); return; }
  if(act==='import'){ var bi=document.getElementById('backupin'); if(bi){ bi.value=''; bi.click(); } return; }
  if(act==='imp-cancel'){ S.importing=null; render(); return; }
  if(act==='imp-merge'){ applyBackup(S.importing,'merge'); return; }
  if(act==='imp-replace'){ applyBackup(S.importing,'replace'); return; }
  if(act==='photo'){ var fi=document.getElementById('photoin'); if(fi){ fi.value=''; fi.click(); } return; }
  if(act==='au-login'){ authSubmit('login'); return; }
  if(act==='au-signup'){ authSubmit('signup'); return; }
  if(act==='au-reset'){ authSubmit('reset'); return; }
  if(act==='au-skip'){ try{ localStorage.setItem('wl_nologin','1'); }catch(e){} S.auth=null; render(); return; }
  if(act==='au-open'){ try{ localStorage.removeItem('wl_nologin'); }catch(e){} S.auth=null; render(); return; }
  if(act==='au-sync'){ syncNow(); return; }
  if(act==='au-pw-toggle'){ S.pwOpen=!S.pwOpen; S.pwMsg=''; render(); return; }
  if(act==='au-pw-save'){ changePassword(); return; }
  if(act==='scan'){ openScanner(); return; }
  if(act==='pick-food'){
    var sr=S.food.search&&S.food.search.results&&S.food.search.results[parseInt(t.dataset.i,10)];
    if(sr) useFoodItem(sr,'search'); return;
  }
  if(act==='ai-food'){ aiFood(); return; }
  if(act==='manual'){
    S.food.search=null;
    S.food.pending={name:'',kcal:'',protein:'',carbs:'',fat:'',thumb:'',source:'manual'};
    render(); return;
  }
  if(act==='food-cancel'){ S.food.pending=null; S.food.search=null; clearTimeout(searchT); searchSeq++; render(); return; }
  if(act==='reestimate'){
    var pr=S.food.pending; if(!pr) return;
    analyzePhoto(null,String(pr.hint||''),true); return;
  }
  if(act==='rm-item'){
    var pi=S.food.pending; if(!pi||!pi.items) return;
    pi.items.splice(parseInt(t.dataset.i,10),1);
    if(!pi.items.length){ pi.kcal=pi.protein=pi.carbs=pi.fat=0; }
    else recalc(pi);
    render(); return;
  }
  if(act==='detach'){
    var pf2=S.food.pending; if(!pf2) return;
    recalc(pf2); pf2.items=[]; render(); return;
  }
  if(act==='edit-meal'){
    var mm=byId('meals',t.dataset.id); if(!mm) return;
    S.food.pending=Object.assign({},mm,{editId:mm.id}); render(); return;
  }
  if(act==='save-meal'){
    var pd=S.food.pending; if(!pd) return;
    if(!num(pd.kcal)&&!String(pd.name||'').trim()){ toast('Give it a name or some calories'); return; }
    put('meals',{
      id:pd.editId||uid(), date:pd.date||foodDate(), at:pd.at||Date.now(),
      name:String(pd.name||'Meal').trim()||'Meal',
      kcal:Math.round(num(pd.kcal)), protein:Math.round(num(pd.protein)),
      carbs:Math.round(num(pd.carbs)), fat:Math.round(num(pd.fat)),
      note:String(pd.assumptions||pd.note||''), thumb:pd.thumb||(pd.thumbs&&pd.thumbs[0])||'',
      source:pd.source||'manual',
      items:(pd.items||[]).map(function(i){
        return {name:i.name,grams:num(i.grams),kcal:num(i.kcal),
                protein:num(i.protein),carbs:num(i.carbs),fat:num(i.fat)};
      })
    },true);
    S.food.pending=null; render(); return;
  }
  if(act==='skip-open'){ S.skipFor=t.dataset.d; render(); return; }
  if(act==='skip-cancel'){ S.skipFor=''; render(); return; }
  if(act==='skip-set'){ setSkip(t.dataset.d,t.dataset.r); S.skipFor=''; S.preview=null;
    toast('Marked as missed — '+t.dataset.r); return; }
  if(act==='skip-clear'){ setSkip(t.dataset.d,null); toast('Unmarked'); return; }

  if(act==='cstrip'){ S.coachPick=!S.coachPick; render(); return; }
  if(act==='pick-theme'){ saveProfile({theme:t.dataset.t}); applyTheme(); return; }
  if(act==='pick-title'){ saveProfile({title:t.dataset.t}); return; }
  if(act==='new-char'){ S.charEdit={name:'',tag:'',voice:'',img:''}; S.view='you'; render(); return; }
  if(act==='edit-char'){ var ec=byId('chars',t.dataset.c); if(ec){ S.charEdit=Object.assign({},ec); S.view='you'; render(); } return; }
  if(act==='char-cancel'){ S.charEdit=null; render(); return; }
  if(act==='char-img'){ var ci2=document.getElementById('charin'); if(ci2){ ci2.value=''; ci2.click(); } return; }
  if(act==='char-save'){
    var ce=S.charEdit; if(!ce) return;
    if(!String(ce.name||'').trim()){ toast('Give the character a name'); return; }
    var cid=ce.id||('c-'+uid());
    put('chars',{id:cid,name:String(ce.name).trim(),tag:String(ce.tag||'Your own character'),
      voice:String(ce.voice||'Speak plainly and warmly, like a good gym coach.'),img:ce.img||''},true);
    S.charEdit=null; saveProfile({coachChar:cid}); toast('Saved — coach is now '+ce.name); return;
  }

  if(act==='panel'){ var pk=t.dataset.k; S.panels[pk]=!S.panels[pk]; render(); return; }
  if(act==='av-open'){ S.avatarPick=!S.avatarPick; render(); return; }
  if(act==='av-char'){ saveProfile({avatar:'char:'+t.dataset.c}); S.avatarPick=false; return; }
  if(act==='av-clear'){ saveProfile({avatar:''}); S.avatarPick=false; return; }
  if(act==='av-upload'){ var ai=document.getElementById('avatarin'); if(ai){ ai.value=''; ai.click(); } return; }
  if(act==='pick-char'){ saveProfile({coachChar:t.dataset.c}); toast('Coach is now '+(CHARS.filter(function(x){return x.id===t.dataset.c;})[0]||{}).name); return; }
  if(act==='pr-sex'){ saveProfile({sex:t.dataset.v}); return; }
  if(act==='pr-act'){ saveProfile({activity:t.dataset.v}); return; }
  if(act==='pr-aim'){ saveProfile({aim:t.dataset.v}); return; }
  if(act==='use-measured'){
    var en2=energy();
    saveProfile({calGoal:num(t.dataset.v),proteinGoal:en2?en2.protein:num(S.profile.proteinGoal)});
    toast('Goals set from your own data'); return;
  }
  if(act==='use-goal'){
    var en=energy(); if(!en) return;
    saveProfile({calGoal:en.target,proteinGoal:en.protein});
    toast('Goals set'); return;
  }
  if(act==='log-weight'){
    var wv=num(S.profile.weightKg);
    if(!wv){ toast('Put your weight in first'); return; }
    logWeight(wv); toast('Weight logged for '+dateLabel(foodDate())); return;
  }
  if(act==='prog-ex'){ S.progEx=t.dataset.n; render(); return; }
  if(act==='log-past'){ logPast(t.dataset.id,t.dataset.d); return; }
  if(act==='rest-add'){ if(S.rest){ S.rest.until=Math.max(Date.now(),S.rest.until)+30000; S.rest.rung=false; paintRest(); } return; }
  if(act==='rest-skip'){ S.rest=null; paintRest(); return; }
  if(act==='fill-day'){
    var fd=resolveDay(t.dataset.id);
    if(fd&&fd._virtual) fd=materialize(t.dataset.id);
    if(!fd){ addDay(t.dataset.d); return; }
    S.sel=fd.date; S.openDay[fd.id]=true; S.view='plan'; render(); return;
  }
  if(act==='reopen'){
    if(active()){ toast('Finish or discard the live workout first'); return; }
    var ro=byId('sessions',t.dataset.id); if(!ro) return;
    var rc=JSON.parse(JSON.stringify(ro));
    rc.reFinish=ro.finishedAt; rc.finishedAt=null; S.parked=false;
    S.view='today'; S.showReview=null; put('sessions',rc,true);
    toast('Correct the numbers, then submit again'); return;
  }
  if(act==='send'){ coachSend(S.draft); return; }
  if(act==='sugg'){ coachSend(t.dataset.q); return; }

  if(act==='ex-side'){
    var sd2=resolveDay(t.dataset.id); if(!sd2) return;
    if(sd2._virtual){ sd2=materialize(t.dataset.id); if(!sd2) return; }
    sd2=JSON.parse(JSON.stringify(sd2));
    var xe=sd2.exercises[parseInt(t.dataset.i,10)]; if(!xe) return;
    xe.perSide=!!t.dataset.v; put('days',sd2); return;
  }
  if(act==='add-seg-p'||act==='rm-seg-p'){
    var dd2=resolveDay(t.dataset.id); if(!dd2) return;
    if(dd2._virtual){ dd2=materialize(t.dataset.id); if(!dd2) return; }
    dd2=JSON.parse(JSON.stringify(dd2));
    var ex=dd2.exercises[parseInt(t.dataset.i,10)]; if(!ex) return;
    ex.segs=ex.segs||[];
    if(act==='add-seg-p') ex.segs.push({label:'',detail:''});
    else ex.segs.splice(parseInt(t.dataset.j,10),1);
    put('days',dd2); return;
  }

  var ses=active(); if(!ses){ render(); return; }
  var c2=JSON.parse(JSON.stringify(ses));
  var ei=parseInt(t.dataset.ei,10), si=parseInt(t.dataset.si,10);
  if(act==='tick'){
    var nowDone=!c2.ex[ei].sets[si].done;
    c2.ex[ei].sets[si].done=nowDone;
    if(nowDone){
      if(!c2.ex[ei].t0) c2.ex[ei].t0=nowHM();
      if(!c2.ex[ei].t1&&c2.ex[ei].sets.every(function(x){ return x.done; })) c2.ex[ei].t1=nowHM();
    }
    put('sessions',c2);
    if(nowDone){ primeAudio(); startRest(); }        /* a tap is our one chance to unlock audio */
    else if(S.rest){ S.rest=null; paintRest(); }
    return;
  }
  if(act==='tick-seg'){
    var sgd=!c2.ex[ei].segs[si].done; c2.ex[ei].segs[si].done=sgd;
    if(sgd){
      if(!c2.ex[ei].t0) c2.ex[ei].t0=nowHM();
      if(!c2.ex[ei].t1&&c2.ex[ei].segs.every(function(x){ return x.done; })) c2.ex[ei].t1=nowHM();
    }
    put('sessions',c2); return;
  }
  if(act==='stamp'){ c2.ex[ei][t.dataset.k==='t1'?'t1':'t0']=nowHM(); put('sessions',c2); return; }
  if(act==='add-set'){ var st=c2.ex[ei].sets,l=st[st.length-1]||{kg:'0',reps:''};
    st.push({kg:l.kg,reps:l.reps,rir:'',done:false}); put('sessions',c2); return; }
  if(act==='del-set'){ if(c2.ex[ei].sets.length>1){ c2.ex[ei].sets.pop(); put('sessions',c2); } return; }
  if(act==='add-seg'){ c2.ex[ei].segs=c2.ex[ei].segs||[]; c2.ex[ei].segs.push({label:'',detail:'',done:false}); put('sessions',c2); return; }
  if(act==='del-seg'){ if((c2.ex[ei].segs||[]).length>1){ c2.ex[ei].segs.pop(); put('sessions',c2); } return; }
  if(act==='submit'){
    S.parked=false;
    c2.finishedAt=c2.reFinish||Date.now();     /* a reopened session keeps its original date */
    if(c2.reFinish) delete c2.reFinish;
    put('sessions',c2,true); toast('Workout logged 💪'); askReview(c2.id); return;
  }
  render();
});

});

['pointerup','pointercancel'].forEach(function(t){

});
document.addEventListener('focusout',function(){ flushSoon(); });
document.addEventListener('change',function(ev){
  var t=ev.target;
  if(DIRTY&&t&&(t.type==='date'||t.type==='time')) render();   /* a picker has closed, nothing is being typed */
});
function inputMain(ev){
  var el=ev.target.closest('[data-in]'); if(!el) return;
  var kind=el.dataset['in'], v=el.value;

  if(kind.indexOf('p-')===0){
    if(!S.food.pending) return;
    var f={'p-name':'name','p-kcal':'kcal','p-protein':'protein','p-carbs':'carbs',
           'p-fat':'fat','p-hint':'hint'}[kind];
    if(f) S.food.pending[f]=v;
    if(kind==='p-name'&&S.food.pending.source==='manual'&&!S.food.pending.editId
       &&!(S.food.pending.items&&S.food.pending.items.length)) foodSearchSoon(v);
    return;                       /* no re-render: keeps the keyboard and caret steady */
  }
  if(kind==='i-grams'){
    var pdd=S.food.pending; if(!pdd||!pdd.items) return;
    var it=pdd.items[parseInt(el.dataset.i,10)]; if(!it||!it.per) return;
    var g=num(v);
    it.grams=v;
    it.kcal=Math.round(it.per.kcal*g); it.protein=Math.round(it.per.protein*g*10)/10;
    it.carbs=Math.round(it.per.carbs*g*10)/10; it.fat=Math.round(it.per.fat*g*10)/10;
    recalc(pdd);
    var te=document.getElementById('mtot'); if(te) te.innerHTML=totInner(pdd);   /* live total, no redraw */
    render();
    return;
  }
  if(kind.indexOf('c-')===0&&S.charEdit){
    var cf={'c-name':'name','c-tag':'tag','c-voice':'voice'}[kind];
    if(cf) S.charEdit[cf]=v;
    return;
  }
  if(kind.indexOf('pr-')===0){
    var g={'pr-name':'name','pr-age':'age','pr-height':'heightCm','pr-weight':'weightKg',
           'pr-cal':'calGoal','pr-prot':'proteinGoal','pr-coachname':'coachName',
           'pr-every':'remindEvery','pr-qfrom':'quietFrom','pr-qto':'quietTo',
           'pr-setslo':'setsLo','pr-setshi':'setsHi','pr-weektarget':'weekTarget'}[kind];
    if(kind==='pr-pause'){ saveProfile({pauseUntil:v}); return; }
    if(!g) return;
    var patch={}; patch[g]=(g==='name'||g==='coachName')?v:num(v);
    saveProfile(patch); return;
  }
  if(kind==='ai-key'){
    try{ localStorage.setItem('wl_aikey',String(v).trim()); localStorage.removeItem('wl_aimodel'); }catch(e){}
    var tb=document.querySelector('[data-act="ai-test"]'); if(tb) tb.disabled=!String(v).trim();
    return;
  }
  if(kind==='gym-name'||kind==='gym-o'||kind==='gym-c'){
    var g2=JSON.parse(JSON.stringify(gym()));
    if(kind==='gym-name') g2.name=v;
    else { var gw=el.dataset.w; g2.hours[gw]=g2.hours[gw]||['','']; g2.hours[gw][kind==='gym-o'?0:1]=v; }
    S.settings.gym=g2; saveSettings(); return;
  }
  if(kind==='set-rest'||kind==='set-step'){
    var val=num(v);
    if(kind==='set-rest') S.settings.rest=(String(v).trim()===''?90:Math.max(0,Math.round(val)));
    else S.settings.step=val>0?val:STEP;
    saveSettings(); return;
  }

  if(kind==='draft'){
    S.draft=v;
    var b=document.querySelector('.send'); if(b) b.disabled=!v.trim()||S.busy;
    return;
  }

  if(kind==='notes'||kind==='ex-comment'||kind==='ex-t0'||kind==='ex-t1'||kind.indexOf('set-')===0||kind==='seg-label'||kind==='seg-detail'){
    var ses=active(); if(!ses) return;
    var c=JSON.parse(JSON.stringify(ses));
    if(kind==='notes'){ c.notes=v; put('sessions',c); return; }
    var ei=parseInt(el.dataset.ei,10), si=parseInt(el.dataset.si,10);
    if(!c.ex[ei]) return;
    if(kind==='ex-comment') c.ex[ei].comment=v;
    else if(kind==='set-kg') c.ex[ei].sets[si].kg=v;
    else if(kind==='set-reps') c.ex[ei].sets[si].reps=v;
    else if(kind==='set-rir') c.ex[ei].sets[si].rir=v;
    else if(kind==='ex-t0') c.ex[ei].t0=v;
    else if(kind==='ex-t1') c.ex[ei].t1=v;
    else if(kind==='seg-label') c.ex[ei].segs[si].label=v;
    else if(kind==='seg-detail') c.ex[ei].segs[si].detail=v;
    put('sessions',c); return;
  }

  var d=resolveDay(el.dataset.id); if(!d) return;
  if(d._virtual){
    var real=materialize(el.dataset.id); if(!real) return;
    d=real;
    /* re-target the field to the new copy next render */
  }
  var day=JSON.parse(JSON.stringify(d));
  if(kind==='day-name'){ day.name=v; put('days',day); return; }
  if(kind==='day-date'){ day.date=v; S.sel=v; put('days',day); return; }
  if(kind==='day-note'){ day.note=v; put('days',day); return; }
  var i=parseInt(el.dataset.i,10);
  if(!day.exercises||!day.exercises[i]) return;
  var e=day.exercises[i];
  if(kind==='ex-name') e.name=v;
  else if(kind==='ex-sets') e.sets=v;
  else if(kind==='ex-reps') e.reps=v;
  else if(kind==='ex-kg') e.kg=v;
  else if(kind==='ex-step') e.step=v;
  else if(kind==='ex-base') e.base=v;
  else if(kind==='ex-spec') e.spec=v;
  else if(kind==='ex-note') e.note=v;
  else if(kind==='seg-label-p'||kind==='seg-detail-p'){
    var j=parseInt(el.dataset.j,10);
    e.segs=e.segs||[]; if(!e.segs[j]) return;
    e.segs[j][kind==='seg-label-p'?'label':'detail']=v;
  }
  put('days',day);
}

(function(){

  if(fi) fi.addEventListener('change',function(){
    if(fi.files&&fi.files.length) analyzePhoto(Array.prototype.slice.call(fi.files),'');
    fi.value='';
  });
})();

setInterval(function(){
  var el=document.getElementById('el'); if(!el) return;
  var s=active(); if(!s) return;
  el.textContent=clock(Date.now()-s.startedAt);
},30000);

try{ if(!hosted()&&navigator.storage&&navigator.storage.persist) navigator.storage.persist(); }catch(e){}
/* offline: only on your own https address, and only if sw.js was uploaded next to this file */
try{
  if(!hosted()&&'serviceWorker' in navigator&&location.protocol==='https:')
    window.addEventListener('load',function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
}catch(e){}
function offlineReady(){ try{ return !!(navigator.serviceWorker&&navigator.serviceWorker.controller); }catch(e){ return false; } }
applyTheme();
render();
try{ if(syncOn()) loadAuth(); }catch(e){}
initDb();
if(syncOn()){
  syncSoon(400);
  document.addEventListener('visibilitychange',function(){ if(!document.hidden) syncSoon(300); });
  window.addEventListener('online',function(){ syncSoon(300); });
  setInterval(function(){ if(!document.hidden) syncNow(); },120000);
}
</script>
